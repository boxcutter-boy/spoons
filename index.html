<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Spoon — energy pacing</title>
<meta name="description" content="An energy-pacing app for people who run out. Reads your calendar, learns what things actually cost you, and says what the week ahead will do to you — early enough to change it.">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#05060e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta property="og:type" content="website">
<meta property="og:title" content="Spoon — energy pacing">
<meta property="og:description" content="An energy-pacing app for people who run out. No streaks, no guilt, no accounts.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230d1026'/%3E%3Cpath d='M16 7c3 0 5 2 5 4.6 0 2.3-1.6 3.6-3.4 4.1l.6 8.4a2.2 2.2 0 0 1-4.4 0l.6-8.4C12.6 15.2 11 13.9 11 11.6 11 9 13 7 16 7Z' fill='%23e9e8f3'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Libre+Franklin:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
<style>
  /* Dark blue, from Ferri's moodboard: a grainy gradient ground, containers a
     deep navy that sits on it, and the traffic colours pulled toward the same
     family so they read as part of the picture rather than stickers on it.
     Garamond for display, system sans for everything working. */
  :root{
    --serif:"EB Garamond","Adobe Garamond Pro","Garamond","Hoefler Text",
            "Iowan Old Style","Times New Roman",Georgia,serif;
    /* Libre Franklin: a revival of Franklin Gothic, which Morris Fuller Benton
       drew in 1903. It's a newspaper face by descent, which is why it sits with
       Garamond — both are made for reading rather than for interfaces, and the
       app is mostly sentences. */
    --sans:"Libre Franklin",-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;

    --ink:#e9e8f3; --muted:#a0a3ba; --faint:#6f7492;
    --line:#333b5e; --line-strong:#525c86; --hair:#262c49;
    --fill:#0d1026; --surface:#151a36; --surface2:#1d2447;
    --ph:#171d3a; --stage:#05060e; --hatch:#1e2547;
    /* the month grid needs to be readable as a grid, so its rule is its own
       token — brighter than a hairline and unaffected by the quieter borders
       used everywhere else */
    --grid:#66719f;
    /* a translucent ground for labels that sit on the gradient itself */
    --chip:rgba(9,11,26,.82);
    /* the filled state of a chip — mid indigo, from the ground's own family
       rather than a grey */
    --sel:#4b54b0; --sel-line:#616ac9;
    /* The stroke that separates an event from the day colour behind it. Pitched
       at the value of the ground near the top of the screen rather than the
       darkest navy — a near-black outline read as a cut-out, this reads as the
       background showing through. */
    --chipstroke:#2e3163;
    /* From Ferri's palette: the green is a teal, the red a magenta, the amber a
       gold. Deeper and more saturated than the old muted set — on a dark ground
       a desaturated hue just reads as grey with a tint, and these have to carry
       meaning at chip size. */
    --ok:#23a8a2; --tight:#eda029; --over:#f0537c; --unknown:#5b6186;
    --unknown-bg:#1b2140;
    /* the saturated end of each zone — a month cell is tall enough to hold a
       gradient, so the colour arrives at the bottom of the day rather than
       washing the whole box flat */
    --ok-deep:#009ea3; --tight-deep:#d99200; --over-deep:#c6174f;
  }
  /* Tell the browser this is a dark UI, so the bits IT draws — the date field's
     picker icon, the picker itself, scrollbars — come back light instead of the
     black-on-navy default. */
  :root{color-scheme:dark}
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    margin:0; background:var(--stage); display:flex; align-items:center; justify-content:center;
    font:400 14px/1.45 var(--sans);
    color:var(--ink); padding:24px;
  }
  button{font:inherit;color:inherit;background:none;border:none;padding:0;margin:0;cursor:pointer;text-align:left}

  .stage{flex:none}
  /* The ground: soft blooms of indigo and violet over a near-black navy, with a
     fine grain laid over the top. The grain is an inline SVG turbulence rather
     than an image, so the whole thing stays one file with no assets. It's a
     background layer, not an overlay element, so nothing has to be restacked
     around it. */
  .phone{
    position:relative; width:390px; height:812px;
    background-color:var(--fill);
    background-image:
      url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='4' stitchTiles='stitch'/><feColorMatrix type='saturate' values='0'/></filter><rect width='200' height='200' filter='url(%23n)' opacity='.85'/></svg>"),
      radial-gradient(120% 52% at 14% -12%, rgba(143,126,248,.30), transparent 64%),
      radial-gradient(90% 40% at 100% 2%,  rgba(78,72,198,.26), transparent 66%),
      radial-gradient(120% 50% at 76% 40%, rgba(66,60,142,.18), transparent 68%),
      radial-gradient(130% 55% at 40% 110%, rgba(182,104,168,.13), transparent 64%),
      linear-gradient(180deg,#13173a 0%,#0d1029 44%,#07091a 100%);
    background-size:200px 200px, cover, cover, cover, cover, cover;
    background-blend-mode:soft-light, normal, normal, normal, normal, normal;
    transform-origin:top center;
    border-radius:46px; overflow:hidden; flex:none;
    display:flex; flex-direction:column;
    box-shadow:0 0 0 11px #14162c, 0 0 0 12px #2e3357, 0 26px 70px rgba(0,0,0,.7);
  }
  .island{
    position:absolute; top:9px; left:50%; transform:translateX(-50%);
    width:86px; height:22px; border-radius:12px; background:#000; z-index:9;
  }
  /* stays a phone at every size — never goes full-bleed, and grows to fill
     whatever room the window has */
  body{overflow:auto}
  .statusbar{
    height:42px;flex:none;display:flex;align-items:flex-end;justify-content:space-between;
    padding:0 26px 4px;font-size:10px;color:var(--muted);
  }
  .views{flex:1;position:relative;overflow:hidden}
  .view{
    position:absolute;inset:0;overflow-y:auto;-webkit-overflow-scrolling:touch;
    padding:16px 16px 24px;display:none;
  }
  .view.on{display:block}
  .tabs{flex:none;height:56px;border-top:1px solid var(--line);display:flex}
  .tabs button{
    flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:3px;font-size:9.5px;color:var(--faint);
  }
  .tabs button.on{color:var(--ink);font-weight:600}
  /* Line icons at the same weight as the rest of the app's glyphs: sun behind a
     cloud, a calendar, a pencil on a page. They inherit currentColor, so the
     selected tab lights the icon and the word together. */
  .tabs .ti{width:22px;height:22px;display:block;opacity:.55}
  .tabs .ti svg{width:100%;height:100%;display:block}
  .tabs button.on .ti{opacity:1}

  /* shared bits */
  .scr-head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:16px;gap:10px}
  .scr-head h2{margin:0;font-family:var(--serif);font-size:19px;font-weight:500;line-height:1.2;letter-spacing:.005em}
  .scr-head .act{font-size:11px;color:var(--muted)}
  /* Sections read as clusters: a label, its choices and the note explaining
     them are one thing, so the air goes BETWEEN groups rather than inside them. */
  .group{margin-bottom:26px}
  .group .seg{margin-bottom:7px}
  .group .tinput{margin-bottom:0}
  .group .hint{margin:0}
  .group:last-child{margin-bottom:0}
  .group .chips{margin-bottom:0}
  .label{font-size:9.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--faint);
         margin:0 0 8px;font-weight:600}
  /* containers are filled, not outlined — an outline alone disappears against a
     gradient, and the moodboard's whole idea is a solid sitting on a ground */
  .card{border:1px solid var(--line);border-radius:8px;padding:14px;background:var(--surface);
        box-shadow:0 10px 28px rgba(0,0,0,.34)}
  .btn{border:1px solid var(--line-strong);border-radius:6px;padding:10px 12px;font-size:12px;
       text-align:center;display:block;width:100%}
  .btn.strong{border-width:1.5px}
  .btn:active{background:var(--surface2)}
  .hint{font-size:10.5px;color:var(--faint)}
  .ph{background:var(--ph);border:1px solid var(--line);border-radius:4px;
      background-image:linear-gradient(to top right,transparent calc(50% - .5px),var(--line) 50%,transparent calc(50% + .5px)),
                       linear-gradient(to bottom right,transparent calc(50% - .5px),var(--line) 50%,transparent calc(50% + .5px))}

  /* forecast */
  .cond{display:flex;flex-direction:column;align-items:center;margin:14px 0 20px}
  .condbtn{display:block;padding:0;margin-bottom:14px}
  .cond .blurb{font-family:var(--serif);font-size:14.5px;line-height:1.55;margin:0 0 16px;color:var(--muted);
               text-align:center;max-width:31ch}
  /* What the number would have said, in words — and it opens the same sheet the
     bar does, since they're two halves of one statement. */
  .headline{font-family:var(--serif);font-size:27px;line-height:1.2;margin:2px 0 10px;
            text-align:center;max-width:20ch;color:var(--ink);display:block}
  .headline:active,.condbtn:active{opacity:.7}
  .charge{font-family:var(--serif);font-size:64px;font-weight:400;line-height:1;letter-spacing:-.01em}
  .charge span{font-size:18px;color:var(--muted);font-weight:400;font-family:var(--sans);
               letter-spacing:0}
  .pill{border:1px solid var(--line-strong);border-radius:999px;padding:10px 30px;margin-top:2px;
        font-size:12.5px;color:var(--ink)}
  .pill:active{background:var(--surface2)}
  .gear{width:19px;height:19px;display:block;color:var(--muted)}
  .bat{width:120px;height:16px;border:1.5px solid var(--line-strong);border-radius:3px;padding:2px;margin-bottom:5px}
  .bat i{display:block;height:100%;border-radius:1px}
  .trend{font-size:10.5px;color:var(--muted);margin-top:6px}
  .blurb{font-family:var(--serif);font-size:15px;line-height:1.5;margin:0}
  /* The line under a screen title is describing the screen, not speaking in the
     app's voice — so it stays in the working sans, and bright enough to read as
     instruction rather than as a footnote. */
  .screen-sub{font-family:var(--sans);font-size:12.5px;line-height:1.5;
              color:#c3c7dd;margin:-6px 0 18px}
  .stripgrid{display:flex}
  .stripgrid.head{border-top:1px solid var(--line)}
  .stripgrid.head button{padding:7px 6px 6px;gap:1px}
  .stripgrid.body button{padding:0 6px 10px;min-height:14px}
  .stripgrid button{
    flex:1;border:none;border-radius:0;box-shadow:-1px 0 0 var(--line);
    display:flex;flex-direction:column;gap:3px;min-width:0;align-items:stretch;
  }
  .stripgrid button:first-child{box-shadow:none}
  .stripgrid button:active{opacity:.75}
  .stripgrid .dl{font-size:9px;color:var(--faint);text-transform:uppercase;letter-spacing:.06em;
             text-align:center}
  .stripgrid .dd{font-family:var(--serif);font-size:17px;font-weight:500;line-height:1.1;text-align:center}
  /* The strip's tint is painted ONCE, behind the whole column — header, banner
     band and chips — so the gradient can rise across all three the way it does
     inside a month cell. Painting each row separately restarted the ramp at
     every seam. */
  .stripcols{position:relative}
  .colbg{position:absolute;inset:0;display:flex;z-index:0}
  .colbg i{flex:1;box-shadow:-1px 0 0 var(--line)}
  .colbg i:first-child{box-shadow:none}
  .stripcols .stripgrid,.stripcols .spans{position:relative;z-index:1}
  .stripcols .stripgrid button{background:none;background-image:none}
  /* The zone colour was ramping through the whole cell, which made a week of
     days read as blocks of saturated colour with the events floating in them.
     It only has to say "this is how the day ends" — so it sits in the bottom
     third and lets the chips have the rest. */
  .z-ok{background-image:linear-gradient(180deg,rgba(0,158,163,0) 68%,var(--ok-deep) 100%)}
  .z-tight{background-image:linear-gradient(180deg,rgba(217,146,0,0) 68%,var(--tight-deep) 100%)}
  .z-over{background-image:linear-gradient(180deg,rgba(198,23,79,0) 68%,var(--over-deep) 100%)}
  .z-unknown{background:var(--unknown-bg)}
  /* On the forecast strip the zone gets a rule across the TOP of the day and
     nothing else. A wash behind a column is a lot of screen spent on one word,
     and the column is where the events live — they should sit on the app's own
     ground, not on a coloured panel. The day letters are already tinted the same
     way, so the bar and the label say it together.
     (The month grid keeps its wash for now: there, a cell IS the day, and there
     are no chips to compete with in most of them.) */
  .colbg i{background-image:none;background-color:transparent}
  .colbg i.z-ok{border-top:3px solid var(--ok-deep)}
  .colbg i.z-tight{border-top:3px solid var(--tight-deep)}
  .colbg i.z-over{border-top:3px solid var(--over-deep)}
  .colbg i.z-unknown{border-top:3px solid var(--line-strong)}
  .stripgrid button.z-ok .dl{color:var(--ok)}
  .stripgrid button.z-tight .dl{color:var(--tight)}
  .stripgrid button.z-over .dl{color:var(--over)}
  .stripgrid button.sel .dd{text-decoration:underline;text-underline-offset:3px}
  /* --- the strip, unboxed -------------------------------------------------
     Everything above this was a calendar drawn inside a card: a bordered panel,
     ruled columns, filled rectangles in a grid. It's the one screen that isn't
     a calendar — it's a reading — so the EVENTS lose the furniture: a notch, a
     name, and the panel behind them instead of a filled rectangle each. The
     container and the column rules stay, because they're doing structural work
     rather than decorative — the panel separates the reading from the rest of
     the screen, and the rules make three days read as three days. It was the
     boxes-inside-a-box that made it look like Google Calendar, not the box. */
  /* The column rules stay — they're what makes three days read as three days
     rather than as one list that changes subject twice. They come from the
     background layer only, so a single line runs the full height behind the
     header, the banners and the events instead of restarting at every row. */
  .arcbox.plain .stripgrid button{box-shadow:none}
  .arcbox.plain .arc{padding:0 2px}
  .arcbox.plain .stripgrid.head button{padding:9px 6px 8px}
  .arcbox.plain .stripgrid.body button{padding:0 6px 12px}
  .arcbox.plain .stripgrid .dd{font-size:21px}
  .arcbox.plain .cev{
    height:auto;padding:1px 0 1px 8px;border-radius:0;background:none;
    box-shadow:inset 2px 0 0 var(--rail);color:var(--ink);
    font-size:9.5px;line-height:1.3;
  }
  .arcbox.plain .stripgrid.wide .cev b{display:block;font-weight:500;overflow:hidden;
                       text-overflow:ellipsis;white-space:nowrap;flex:1;min-width:0}
  .arcbox.plain .stripgrid.wide .cev .arrow{display:block;color:var(--c);opacity:1;font-size:10px}
  .arcbox.plain .cev.inv b{font-style:italic;opacity:.8}
  /* seven columns have no room for names, so there they stay bars — but flat
     ones in the state colour rather than chips with strokes */
  .arcbox.plain .stripgrid:not(.wide) .cev{height:4px;padding:0;border-radius:2px;
        background:var(--c);box-shadow:none;overflow:hidden}
  .arcbox.plain .spanbar{box-shadow:inset 3px 0 0 var(--rail)}
  .arcbox.plain .spanbar.slim{box-shadow:none;background:var(--c)}
  .evs{display:flex;flex-direction:column;gap:3px}
  /* The chips are light enough now that their labels have to be dark — and each
     one carries a navy stroke, so a pale event still reads as a separate object
     against a saturated day rather than melting into it. */
  /* Dark fill, light type, and a notch of the calendar's own colour down the
     left edge. The stroke is light rather than navy now — a navy outline round a
     navy chip is a chip with no edge. */
  .cev{height:7px;border-radius:2px;overflow:hidden;color:var(--ct,var(--ink));background:var(--c);
       box-shadow:inset 3px 0 0 var(--rail), 0 0 0 1px rgba(233,232,243,.16);
       display:flex;align-items:center;gap:3px}
  .cev b,.cev .arrow{display:none}
  .arrow{flex:none;font-size:11px;line-height:1;opacity:.9}
  .arrow.rep{font-size:12px;font-weight:700}
  /* one arrow per band, set tight so three of them read as one mark */
  .arrows{font-size:12px;line-height:1;letter-spacing:-.06em;color:var(--ink);white-space:nowrap}
  .arrows.plus{color:var(--ok)}
  .arrows.flat{color:var(--faint);letter-spacing:0}
  .stepper .val .zero{color:var(--faint)}
  /* Hollow means one thing only: an invitation you haven't answered. It's on
     your calendar but it isn't yours yet — the same outline Google draws. */
  .cev.inv{background:transparent;color:#fff;
           box-shadow:inset 3px 0 0 var(--rail), inset 0 0 0 1.5px var(--c)}
  /* "+1" sits wherever the chip stack happens to end, which on a gradient cell
     could be navy or full-strength colour — so it's light rather than dark, the
     one value that holds at both ends. */
  .cev.more{background:none;box-shadow:none;color:rgba(255,255,255,.92);
            font-size:8.5px;height:auto;text-align:center;
            text-shadow:0 1px 2px rgba(9,11,26,.55)}
  .cev.more b{display:block;font-weight:600;letter-spacing:.02em}
  /* labels only fit when the horizon is short */
  .stripgrid.wide .cev{height:auto;padding:2px 5px 2px 7px;font-size:9px;line-height:1.25}
  .stripgrid.wide .cev b{display:block;font-weight:500;overflow:hidden;
                     text-overflow:ellipsis;white-space:nowrap;flex:1;min-width:0}
  .stripgrid.wide .cev .arrow{display:block}
  .spans{position:relative}
  .spanbar{
    position:absolute;top:4px;height:14px;border-radius:3px;
    font-size:9px;font-weight:600;color:var(--ct,var(--ink));padding:0 6px 0 8px;
    display:flex;align-items:center;gap:3px;overflow:hidden;white-space:nowrap;
    box-shadow:inset 3px 0 0 var(--rail), 0 0 0 1px rgba(233,232,243,.16);
  }
  /* a condition is yours and keeps the colour you gave it, so it keeps dark type */

  /* conditions are pills, calendar spans stay rectangular like the chips —
     shape carries the difference even before you notice the emoji */
  .spanbar.mine{border-radius:999px;padding:0 9px}
  /* seven columns: a calendar span matches the chips exactly */
  .spanbar.slim{height:7px;border-radius:2px;padding:0}
  .spanbar .arrow{font-size:10px}
  .emo{font-size:9px;flex:none;line-height:1}
  .spanbar .arrow.rep{font-size:11px}
  .figs{display:flex;gap:18px;margin:9px 0 12px}
  .fig{font-size:11px;color:var(--muted)}
  .fig b{display:block;font-size:16px;color:var(--ink);font-weight:600;margin-top:1px}

  /* week arc */
  .arcbox{border:1px solid var(--line);border-radius:9px;margin-bottom:20px;position:relative;
          background:var(--surface);overflow:hidden;box-shadow:0 10px 28px rgba(0,0,0,.34)}
  /* the horizon switch shares the section's own label row rather than sitting
     inside the chart — nothing should cover the plot */
  .striphead{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:8px}
  .striphead .label{margin:0}
  .hzwrap{position:relative;flex:none}
  /* the label is 39x13; the target is the label plus a thumb's worth of air,
     pulled back with a negative margin so nothing moves */
  .hz{
    font-size:10px;font-weight:700;
    letter-spacing:.04em;color:var(--ink);
    padding:8px 10px;margin:-8px -10px;border-radius:7px;
  }
  .hz:active{background:var(--surface2)}
  .hzmenu{
    position:absolute;top:22px;right:0;z-index:3;background:var(--surface2);
    border:1px solid var(--line-strong);border-radius:7px;padding:4px;min-width:92px;
    display:flex;flex-direction:column;
  }
  .hzmenu button{padding:8px 10px;font-size:11.5px;border-radius:4px;color:var(--muted)}
  .hzmenu button.on{color:var(--ink);font-weight:600;background:var(--hair)}
  .arc{position:relative;width:100%;display:block;padding:10px 10px 4px;background:none;
       border-radius:8px 8px 0 0;overflow:hidden}
  .arc svg{display:block;width:100%;height:96px;overflow:visible}
  .arc .now{font-size:8.5px;fill:var(--faint)}
  /* hour labels sit in the arc's top padding, clear of the plot itself */
  .arc .hr{position:absolute;top:0;transform:translateX(-50%);font-size:8px;
           line-height:10px;color:var(--faint);letter-spacing:.02em;white-space:nowrap}
  .arc .hr.edge{transform:none}

  /* slider */
  .slider-wrap{margin:6px 0 4px;position:relative}
  /* The track is drawn here rather than by the input, so the notches can sit on
     top of it while the input — and therefore the thumb — paints above both.
     With the native track painting the colour, the only way to get notches onto
     it was a layer above the whole control, and the thumb then dragged *under*
     its own tick marks. */
  .strack{position:absolute;left:0;right:0;top:12px;height:10px;border-radius:5px;
          border:1px solid var(--line-strong);pointer-events:none;
          background:linear-gradient(to right,var(--over),var(--tight) 42%,var(--ok) 72%)}
  .notches{position:absolute;left:0;right:0;top:12px;height:10px;pointer-events:none}
  .notches i{position:absolute;top:2px;width:1px;height:6px;background:var(--fill);opacity:.5}
  input[type=range]{
    -webkit-appearance:none;appearance:none;width:100%;height:34px;background:none;margin:0;
    position:relative;z-index:1;
  }
  input[type=range]::-webkit-slider-runnable-track{
    height:10px;border-radius:5px;border:1px solid transparent;background:none;
  }
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none;appearance:none;width:34px;height:34px;margin-top:-13px;
    border-radius:50%;background:var(--ink);border:1.5px solid var(--fill);
  }
  input[type=range]::-moz-range-track{
    height:10px;border-radius:5px;border:1px solid transparent;background:none;
  }
  input[type=range]::-moz-range-thumb{
    width:32px;height:32px;border-radius:50%;background:var(--ink);border:1.5px solid var(--fill);
  }
  .ticks{display:flex;justify-content:space-between;font-size:9px;color:var(--faint);
         margin:-2px 2px 22px}
  .readout{display:flex;align-items:baseline;gap:10px;margin:2px 0 10px;min-height:44px}
  .readout .w{font-family:var(--serif);font-size:26px;font-weight:500;line-height:1.1}
  .readout .v{font-size:13px;color:var(--muted)}

  /* type diagnostic — read-only, greyscale so it never competes with the
     red/amber/green affordability signal */
  .mix{margin:0 0 4px}
  .mixrow{display:flex;align-items:center;gap:9px;margin-bottom:5px}
  .mixrow .k{font-size:10px;color:var(--muted);width:76px;flex:none;text-transform:lowercase;
             display:flex;align-items:center;gap:5px}
  .mixrow .b{flex:1;height:7px;background:var(--hair);border-radius:4px;overflow:hidden}
  .mixrow .b i{display:block;height:100%;background:var(--line-strong);border-radius:4px}
  .mixrow.top .k{color:var(--ink)}
  .mixrow.top .b i{background:var(--ink)}
  .mixnote{font-size:10.5px;color:var(--faint);margin:8px 0 0}

  /* tasks */
  .task{display:flex;align-items:center;gap:9px;padding:11px 0;border-bottom:1px solid var(--hair);width:100%}
  .task .tick{width:17px;height:17px;border:1px solid var(--line-strong);border-radius:50%;flex:none}
  .task .n{flex:1;font-size:12.5px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

  .task .c{font-size:12px;font-weight:600;min-width:22px;text-align:right;flex:none}
  .task.no{opacity:.45}
  .task.isdone .n{color:var(--muted);text-decoration:line-through}
  .task .tick.on{background:var(--sel);border-color:var(--sel-line);color:#fff;
                 display:flex;align-items:center;justify-content:center;font-size:10px}
  .undo{flex:none;font-size:10.5px;color:var(--muted);border-bottom:1px solid var(--line-strong)}
  .undo:active{color:var(--ink)}
  .taskwrap{margin:0}
  .task .par{color:var(--faint)}
  .due{font-size:10px;color:var(--muted);margin:-4px 0 8px 26px}
  .due.tight{color:var(--tight)}
  .nudge{font-size:10.5px;color:var(--faint);margin:-2px 0 10px 26px;line-height:1.45}
  /* a task's nudge belongs to that task — no rule between them */
  /* The separator belongs to the whole row — the task plus its due line and its
     nudge — not to the button. On the button it ran *behind* the due text (which
     is pulled up over it by a negative margin) and reappeared past the end of
     the sentence as a stray rule. */
  .taskwrap:has(.due) .task,.taskwrap:has(.nudge) .task{border-bottom:none}
  .taskwrap:has(.due),.taskwrap:has(.nudge){border-bottom:1px solid var(--hair)}
  .nudge button{color:var(--ink);border-bottom:1px solid var(--line-strong);font-size:10.5px}
  .subrow{display:flex;align-items:center;gap:9px;padding:8px 0;border-bottom:1px solid var(--hair)}
  .subrow .n{flex:1;font-size:12.5px}
  .subrow .c{font-size:12px;font-weight:600}
  .subrow .c.plus{color:var(--ok)}
  .subrow .rm{font-size:10px;color:var(--faint);flex:none;margin-left:10px}
  .swatches{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
  .swatches button{width:26px;height:26px;border-radius:50%;border:2px solid transparent}
  .swatches button.on{border-color:var(--ink)}
  .emojis{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:18px}
  .emojis button{width:34px;height:34px;border:1px solid var(--line);border-radius:8px;
                 font-size:16px;display:flex;align-items:center;justify-content:center}
  .emojis button.on{border-color:var(--ink);background:var(--surface2)}
  .emojis button.none{width:auto;padding:0 10px;font-size:11px;color:var(--muted)}
  .opt .dot{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:7px}
  .taskfoot{display:flex;justify-content:space-between;align-items:center;margin-top:11px}
  .taskfoot button{font-size:11px;color:var(--muted)}
  .lead{font-family:var(--serif);font-size:13px;line-height:1.45;color:var(--muted);margin:-2px 0 10px}
  .tinput{width:100%;background:var(--surface2);border:1px solid var(--line);border-radius:6px;
          padding:11px;font:inherit;font-size:13px;color:var(--ink);margin-bottom:16px}
  /* The placeholder was the browser's own grey — a warm neutral that belongs to
     no palette and reads dimmer than anything else on the screen. This is the
     app's own muted, and opacity:1 stops Firefox fading it again on top. */
  .tinput::placeholder{color:var(--muted);opacity:1}
  .tinput:focus{outline:none;border-color:var(--line-strong)}

  /* calendar handoff */
  .handoff{border:1px solid var(--line);border-radius:7px;padding:12px;margin:0 0 16px;background:var(--surface2);
           font-size:11.5px;line-height:1.5;color:var(--muted)}
  .handoff b{color:var(--ink);font-weight:600}
  .pending{font-size:9px;color:var(--tight);border:1px solid var(--tight);
           border-radius:3px;padding:1px 4px;margin-left:6px;flex:none}
  /* quieter than "pending" — nothing is waiting on the app, it's waiting on you */
  .invited{font-size:9px;color:var(--muted);border:1px solid var(--line-strong);
           border-radius:3px;padding:1px 4px;margin-left:6px;flex:none}
  .ev.isp .n,.evt.isp .n{opacity:.72}


  /* calibration */
  .hintbox{
    border:1px solid var(--line);border-left:2px solid var(--tight);border-radius:6px;
    padding:10px 11px;margin:0 0 14px;font-size:11.5px;line-height:1.45;color:var(--muted);
  }
  .hintbox.lower{border-left-color:var(--ok)}
  .hintbox b{color:var(--ink);font-weight:600}
  .hintbox button{
    display:inline-block;margin-top:8px;border:1px solid var(--line-strong);
    border-radius:5px;padding:6px 10px;font-size:11px;color:var(--ink);
  }
  .flag{
    display:inline-block;width:5px;height:5px;border-radius:50%;
    background:var(--tight);flex:none;margin-right:1px;
  }
  .flag.lower{background:var(--ok)}
  .look .opt{border-bottom:1px solid var(--hair)}
  .look .opt:last-of-type{border-bottom:none}
  .landed{display:flex;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid var(--hair)}
  .landed .n{flex:1;font-size:12px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .landed .e{font-size:10px;color:var(--faint);flex:none}
  .landed .set{display:flex;gap:4px;flex:none}
  .landed .rm{flex:none;width:22px;height:22px;margin-left:2px;border-radius:50%;
              display:flex;align-items:center;justify-content:center;
              color:var(--faint);font-size:16px;line-height:1}
  .landed .rm:active{background:var(--surface2);color:var(--ink)}
  .landed .e{min-width:26px;text-align:right}
  .landed button.n:active,.landed button.e:active{color:var(--ink)}
  .sheet .row .box{flex:none}
  .chip:active{opacity:.7}
  .landed .set button{border:1px solid var(--line);border-radius:12px;padding:4px 8px;font-size:10px;color:var(--muted)}

  /* calendar */
  .cal-nav{display:flex;gap:6px}
  .cal-nav button{width:24px;height:24px;border:1px solid var(--line);border-radius:4px;
                  display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--muted)}
  /* A month reads as a month when it's one continuous grid of tall cells with
     the events inside them. Small rounded boxes with the date jammed in a corner
     read as a row of buttons, and left no room to show what's actually in a day
     — which is the thing you open a calendar to see. */
  .dow{display:grid;grid-template-columns:repeat(7,1fr);margin-bottom:2px}
  .dow span{font-size:9px;color:var(--faint);text-align:center;text-transform:uppercase;
            letter-spacing:.06em}
  .grid{display:grid;grid-template-columns:repeat(7,1fr);
        border-top:1px solid var(--grid);border-left:1px solid var(--grid)}
  .cell{min-height:74px;display:flex;flex-direction:column;gap:2px;padding:3px 3px 5px;
        font-size:10.5px;align-items:stretch;text-align:left;
        border-right:1px solid var(--grid);border-bottom:1px solid var(--grid)}
  .cell .d{flex:none;width:19px;height:19px;line-height:19px;border-radius:50%;
           margin:0 auto 1px;text-align:center;font-family:var(--serif);font-size:12.5px;font-weight:500}
  /* The days either side of the month: same grid, same information, quieter.
     Quietened with an inset wash rather than opacity, because opacity would take
     the cell's own grid line down with it — which is the thing that was getting
     lost in the first place. */
  .cell.adj{box-shadow:inset 0 0 0 999px rgba(9,11,26,.55)}
  .cell.adj .d{opacity:.5}
  .cell.adj.sel{box-shadow:inset 0 0 0 2px #eef0ff, inset 0 0 0 999px rgba(9,11,26,.3)}
  .cell.past{color:var(--faint)}
  /* Same rule as the forecast strip: the zone is 3px across the top of the day
     and nothing else. Painted as a hard-stop gradient rather than a border or a
     box-shadow — a border would shift the contents, and the shadow slot is spoken
     for by selection and by the adjacent-month dimming. */
  .cell.ok{background-image:linear-gradient(180deg,var(--ok-deep) 3px,transparent 3px)}
  .cell.tight{background-image:linear-gradient(180deg,var(--tight-deep) 3px,transparent 3px)}
  .cell.over{background-image:linear-gradient(180deg,var(--over-deep) 3px,transparent 3px)}
  .cell.unknown{background-image:linear-gradient(180deg,var(--line-strong) 3px,transparent 3px);
                color:var(--faint)}
  /* today is filled, the selected day is ringed — Google's own shorthand, and it
     frees the cell edge to stay part of the grid */
  .cell.today .d{background:var(--ink);color:var(--fill);font-weight:600}
  /* selecting a day brightens the grid around it, rather than ringing the
     number — the cell is what you picked, so the cell is what lights up */
  .cell.sel{box-shadow:inset 0 0 0 2px #eef0ff}
  .cell .cevs{display:flex;flex-direction:column;gap:3px;min-width:0}
  /* three pixels tall is no room for a notch, so these carry state only */
  .cell .cevs i{height:3px;border-radius:1px;display:block;background:var(--c);
                box-shadow:0 0 0 1px rgba(233,232,243,.14)}
  .cell .cevs i.inv{background:transparent;box-shadow:inset 0 0 0 1px var(--c)}
  /* an unpriced event keeps its slot but not its colour — that's what used to be
     said by a dashed outline round the whole day, and this says which one */
  .cell .cevs i.un{background:#8a92b7}
  .strip button.sel .dl{color:var(--ink)}
  .stripgrid button.partial .dd{opacity:.7}
  .legend{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 14px}
  .legend span{font-size:9.5px;color:var(--muted);display:flex;align-items:center;gap:4px}
  .legend i{width:10px;height:10px;border-radius:2px;display:block;border:1px solid transparent;flex:none}
  .agenda{border-top:1px solid var(--line);padding-top:12px}
  .ev{display:flex;align-items:center;gap:9px;padding:8px 0;border-bottom:1px solid var(--hair);width:100%}
  .ev .t{font-size:10px;color:var(--faint);width:48px;flex:none}
  .ev .n{flex:1;font-size:12.5px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .ev .g,.task .g{flex:none;display:flex;align-items:center;color:var(--muted)}
  .ico{width:15px;height:15px;display:block}
  .ev .c{font-size:12px;font-weight:600;min-width:34px;text-align:right;flex:none}
  .ev .c.none{font-weight:400;color:var(--faint);font-size:10.5px}
  .ev .c.inf,.evt .d .inf{font-weight:400;color:var(--muted);font-style:italic}
  .ev .c.plus{color:var(--ok)}
  .ev.open{background:repeating-linear-gradient(135deg,transparent,transparent 4px,var(--hatch) 4px,var(--hatch) 8px)}
  .ev.open .n{color:var(--muted);font-style:italic;font-size:11.5px}
  .tot{display:flex;justify-content:space-between;padding:11px 0 0;font-size:11px;color:var(--muted)}
  .tot b{color:var(--ink)}
  .pips{display:inline-flex;gap:2px;align-items:center}
  .pips i{width:4px;height:4px;border-radius:50%;background:var(--ink);display:block}
  .pips.plus i{background:var(--ok)}

  /* day view */
  .sumline{font-size:12.5px;line-height:1.5;margin:0 0 4px}
  .tl{position:relative;margin:14px 0 14px}
  .rail{position:absolute;left:36px;top:0;bottom:0;width:9px;border-radius:5px;background:var(--unknown)}
  .tl .tick{position:absolute;left:0;width:32px;text-align:right;font-size:9px;color:var(--faint)}
  /* the rail runs 36→45, so its centre is 40.5 — a node is 17 wide and has to be
     hung from that centre, not from the rail's left edge */
  .node{position:absolute;left:40.5px;width:17px;height:17px;margin-left:-8.5px;border-radius:50%;
        background:var(--surface2);border:1.5px solid var(--line-strong)}
  .evt{position:absolute;left:58px;right:0;border:1px solid var(--line);border-radius:6px;z-index:1;
       padding:6px 9px;background:var(--surface);display:flex;align-items:center;gap:8px}
  .evt .n{flex:1;font-size:12px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .evt .d{font-size:11px;color:var(--muted);flex:none}
  .evt .d b{color:var(--ink);font-weight:600}
  .evt.key{border-color:var(--line-strong);border-width:1.5px}
  .evt.rest{background:repeating-linear-gradient(135deg,var(--surface),var(--surface) 4px,var(--hatch) 4px,var(--hatch) 8px)}
  .evt.rest .n{font-style:italic;color:var(--muted)}
  .cross{position:absolute;left:30px;right:0;border-top:1px solid var(--over);opacity:.75}
  .cross span{position:absolute;right:0;top:3px;font-size:9px;color:var(--over);background:var(--chip);padding:0 3px}
  /* "now" is deliberately neutral — the traffic colours mean affordability here,
     so borrowing one for the clock would read as a judgement */
  .nowline{position:absolute;left:30px;right:0;border-top:1px solid var(--ink);opacity:.85;z-index:2}
  .nowline i{position:absolute;left:-4px;top:-3.5px;width:7px;height:7px;border-radius:50%;
             background:var(--ink);display:block}
  .nowline span{position:absolute;right:0;top:-14px;font-size:8.5px;color:var(--ink);
                background:var(--chip);padding:0 3px;letter-spacing:.02em}

  /* log */
  .states{display:flex;flex-direction:column;gap:9px;margin-bottom:22px}
  .state{border:1px solid var(--line-strong);border-radius:8px;padding:15px 14px;font-size:14px;
         display:flex;align-items:center;gap:11px;width:100%}
  .state .dot{width:11px;height:11px;border-radius:50%;border:1px solid var(--line-strong);flex:none}
  .state.on{background:var(--surface2);border-width:1.5px}
  .divider{display:flex;align-items:center;gap:9px;margin:0 0 16px}
  .divider hr{flex:1;border:none;border-top:1px solid var(--line);margin:0}
  .divider span{font-size:9.5px;text-transform:uppercase;letter-spacing:.09em;color:var(--faint)}
  .row{display:flex;align-items:center;gap:10px;margin-bottom:18px;width:100%}
  .box{width:17px;height:17px;border:1px solid var(--line-strong);border-radius:3px;flex:none;
       display:flex;align-items:center;justify-content:center;font-size:11px}
  .chips{display:flex;flex-wrap:wrap;gap:6px;row-gap:8px;margin-top:8px}
  .chip{border:1px solid var(--line);border-radius:14px;padding:6px 11px;font-size:11px;
        font-weight:500;color:var(--muted);text-align:center}
  /* Filled, so a logged chip is an object among outlines rather than two greys
     to compare. The weight does NOT change with state — bolding the label made
     the chip wider on selection and shunted the whole row around it. */
  .chip.on{border-color:var(--sel-line);background:var(--sel);color:#fff}

  /* sheets */
  .scrim{position:absolute;inset:0;background:rgba(0,0,0,.55);opacity:0;pointer-events:none;
         transition:opacity .18s;z-index:5}
  .scrim.on{opacity:1;pointer-events:auto}
  .sheet{
    position:absolute;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line-strong);
    border-radius:14px 14px 0 0;padding:18px 16px 22px;transform:translateY(102%);
    transition:transform .22s ease;z-index:6;max-height:86%;overflow-y:auto;
    /* A closed drawer is off-screen, but a closed WINDOW is still sitting in the
       middle of the screen at opacity 0 — and opacity doesn't stop clicks. It
       was swallowing taps meant for the arc and the horizon switch, and landing
       them on its own buttons. */
    pointer-events:none;
  }
  .sheet.on{transform:translateY(0);pointer-events:auto}
  /* A window, not a drawer. A drawer is a panel you reached for; a window is the
     app holding one thing still in front of you. The post-event ask uses it, and
     so does tapping an event — you're deciding about that event, not browsing a
     tray of options attached to the bottom of the screen. */
  .sheet.modal{
    top:50%; bottom:auto; left:16px; right:16px; max-height:78%;
    border:1px solid var(--line-strong); border-radius:14px;
    transform:translateY(-50%) scale(.94); opacity:0;
    transition:transform .18s ease, opacity .18s ease;
    box-shadow:0 24px 60px rgba(0,0,0,.5);
  }
  .sheet.modal.on{transform:translateY(-50%) scale(1); opacity:1}
  .sheet h3{margin:0 0 3px;font-family:var(--serif);font-size:18px;font-weight:500;line-height:1.25}
  .sheet .sub{font-size:11px;color:var(--muted);margin:0 0 16px}
  .stepper{display:flex;align-items:center;justify-content:center;gap:20px;margin:6px 0 14px}
  .stepper button{width:42px;height:42px;border:1px solid var(--line-strong);border-radius:50%;
                  font-size:19px;display:flex;align-items:center;justify-content:center}
  .stepper .val{font-size:32px;font-weight:300;min-width:60px;text-align:center}
  .stepper .val small{font-size:13px;color:var(--muted);font-weight:400}
  .seg{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
  .seg button{border:1px solid var(--line);border-radius:14px;padding:7px 11px;font-size:11px;color:var(--muted)}
  .seg button.seg-ico{display:inline-flex;align-items:center;gap:6px}
  .seg button.addchip{color:var(--muted)}
  .seg button.on{border-color:var(--ink);color:var(--ink);background:var(--surface2);font-weight:600}
  .opt{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--hair);width:100%}
  .opt .n{flex:1;font-size:12.5px}
  .opt .d{font-size:11px;color:var(--muted)}
  .opt .d b{font-weight:600}
  .opt.good .d b{color:var(--ok)}
  .toast{
    position:absolute;left:16px;right:16px;bottom:70px;background:var(--surface2);color:var(--ink);
    border-radius:7px;padding:11px 13px;font-size:11.5px;line-height:1.4;z-index:8;
    border:1px solid var(--line-strong);
    opacity:0;transform:translateY(6px);transition:.2s;pointer-events:none;
  }
  .toast.on{opacity:1;transform:none}
  .tiredcta{margin:4px 0 22px;border-color:var(--line);color:var(--muted);font-size:12px}
  .tiredgrid{display:flex;flex-direction:column;gap:8px}
  .tiredgrid button{
    border:1px solid var(--line-strong);border-radius:8px;padding:14px 13px;
    font-size:13px;width:100%;
  }
  .tiredgrid button:active{background:var(--surface2)}
  .tiredgrid button.dim{border-color:var(--line);color:var(--muted)}
  .tiredgrid button .bx{
    display:inline-block;width:15px;height:15px;border:1px solid var(--line-strong);
    border-radius:3px;margin-right:10px;font-size:10px;line-height:14px;text-align:center;
    vertical-align:-2px;
  }
  .tiredgrid button.on{border-color:var(--ink);background:var(--surface2)}
  /* one answer, in the display face, because it's the only thing on the screen */
  /* the question and where you are in it, on one baseline — the alignment comes
     from the flex row rather than from guessing at font metrics */
  .askhead{display:flex;align-items:baseline;justify-content:space-between;gap:12px;
           margin:0 0 3px}
  .askhead h3{margin:0}
  .askpos{flex:none;font-size:11px;color:var(--faint);font-variant-numeric:tabular-nums}
  .askpos i{font-style:normal;opacity:.5;margin:0 1px}
  .helpbig{font-family:var(--serif);font-size:23px;line-height:1.25;margin:4px 0 18px;
           color:var(--ink)}
  .tiredgrid button i{font-style:normal}
  .tiredgrid .sub2{display:block;font-size:10.5px;color:var(--faint);margin-top:3px}
  .tiredgrid .likely{float:right;font-size:9px;letter-spacing:.05em;text-transform:uppercase;
                     color:var(--faint);border:1px solid var(--line);border-radius:4px;
                     padding:1px 5px;margin-top:1px}
  .tiredgrid button.dim{border-color:var(--line);color:var(--muted);font-size:12px}
  .pillrow{display:flex;gap:9px;justify-content:center;flex-wrap:wrap}
  .pill.quiet{border-color:var(--line);color:var(--muted)}
  .chartgroup{margin-bottom:16px}
  .chartq{font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);
          margin:0 0 4px;font-weight:600}
  .chartcard .recitem{padding:7px 0;font-size:12px}
  .recitem{font-size:12.5px;line-height:1.5;padding:9px 0;border-bottom:1px solid var(--hair)}
  .recitem:last-child{border-bottom:none}
  .recalt{display:flex;flex-wrap:wrap;gap:14px;margin-top:11px}
  .recalt button{font-size:10.5px;color:var(--muted);border-bottom:1px solid var(--line)}
  .treecat{margin-bottom:18px}
  .treecat h4{margin:0 0 2px;font-size:12px;font-weight:600}
  .treeq{font-size:10.5px;color:var(--faint);margin:0 0 6px}
  .rec-note{border:1px solid var(--line-strong);border-radius:8px;padding:13px;margin-bottom:18px;background:var(--surface);
            font-size:12.5px;line-height:1.5}

  /* --- the day, and what could move ------------------------------------
     This screen went through three earlier shapes — a sheet of ranked
     suggestions, a whole week in rows, a whole week in columns — before the
     question settled: which of THIS day's things is the heavy one. It turned
     out not to need a screen of its own at all. The day view already draws the
     day; it just wasn't saying which events were doing the damage. */
  .evt.drain{box-shadow:inset 3px 0 0 var(--over)}
  .evt.drain .d b{color:var(--over)}
  #v-day .ev{padding-left:9px}
  .ev.drain{box-shadow:inset 3px 0 0 var(--over)}
  .ev.drain .c{color:var(--over)}
  /* a condition or a multi-day event runs ACROSS the day rather than sitting at
     a time inside it, so it stacks above the timeline as the bar it is */
  .condline{display:flex;flex-direction:column;gap:3px;margin:0 0 12px}
  .condline span{display:flex;align-items:center;gap:5px;height:17px;padding:0 8px 0 10px;
                 border-radius:3px;font-size:9.5px;font-weight:600;color:var(--ct,var(--ink));
                 background:var(--c);
                 box-shadow:inset 3px 0 0 var(--rail), 0 0 0 1px rgba(233,232,243,.16)}

  .condline span.mine{border-radius:999px;padding:0 10px}
  .opt .arrow2{font-size:12px;color:var(--faint)}
  /* the one thing worth saying about a day that's already happened */
  .opt.mark{border:1px solid var(--line-strong);border-radius:10px;padding:12px 13px;
            border-bottom:1px solid var(--line-strong)}
  .opt.mark.on{border-color:var(--tight);color:var(--tight);
               background:linear-gradient(180deg,rgba(217,146,0,.13),rgba(217,146,0,.03))}
  .opt.mark .d{font-size:13px}

  /* An alert, not a panel — sized so you can't scroll past it without noticing,
     and holding only what it takes to decide whether to open it. The amber is
     the "you'll pay for it" zone colour: the app isn't sure yet, it's flagging. */
  .note{
    display:flex;align-items:center;gap:12px;width:100%;text-align:left;
    border:1px solid var(--tight);border-radius:12px;padding:16px 15px;
    background:linear-gradient(180deg,rgba(217,146,0,.13),rgba(217,146,0,.03));
  }
  .note:active{background:linear-gradient(180deg,rgba(217,146,0,.22),rgba(217,146,0,.08))}
  .note .nb{flex:1;min-width:0}
  .note .nh{display:block;font-family:var(--serif);font-size:16.5px;font-weight:400;
            line-height:1.3;color:var(--ink)}
  .note .nh b{font-weight:600}
  .note .np{display:block;margin-top:4px;font-size:11.5px;color:var(--muted);line-height:1.45}
  .note .chev{flex:none;font-size:20px;color:var(--tight);line-height:1}
  /* the mark an event wears when the second-look notification is counting it */
  .warn{display:flex;align-items:center;flex:none;color:var(--tight)}
  .warn .wi{width:14px;height:14px;display:block}
  .note .warn .wi{width:21px;height:21px}
</style>
</head>

<script>
"use strict";

/* ---------------------------------------------------------------------------
   MODEL
   Charge and costs are stored as fractions of max (0..1) at full resolution.
   Display rounds once, at render time — never in the data. See concept.md §4.
---------------------------------------------------------------------------- */

const TODAY = "2026-09-12";
const NOW_H = 16.75;                    /* 4:45pm — so today's events have passed */
const TYPES = {social:"so", sensory:"se", executive:"ex", physical:"ph"};
/* Two-letter abbreviations in a 13px circle were unreadable. Line glyphs,
   chosen to stay distinct at 14px: two heads, a signal, a list, a pulse. */
const ICONS = {
  social:    '<circle cx="6.8" cy="9.6" r="2.9"/><circle cx="13.4" cy="9.6" r="2.9"/>',
  sensory:   '<circle cx="5" cy="10" r="1.15" fill="currentColor" stroke="none"/>'
             +'<path d="M8.4 6.6a4.8 4.8 0 0 1 0 6.8"/><path d="M11.8 4.4a9 9 0 0 1 0 11.2"/>',
  executive: '<path d="M4.6 6.4h10.8M4.6 10h10.8M4.6 13.6h6.8"/>',
  physical:  '<path d="M3.2 10h3l2.1-4.2 3 8.4 2.1-4.2h3.4"/>'
};
/* Chips take the colour of the calendar the event came from — Google's own
   palette, so the week looks like the calendar it mirrors. Affordability lives
   on the cell BACKGROUND instead, which keeps the two from competing.
   EventKit exposes the CALENDAR's colour, not per-event colours (see §10). */
/* Google's own hue *names* — Peacock, Sage, Grape, Flamingo — pulled toward the
   app's palette so the chips belong to the screen they sit on. The seven stay as
   distinguishable from each other as Google's are; they're just tuned warmer or
   cooler. In a real build these come from EventKit and this is the mapping. */
const CALENDARS = {
  Work:     "#5FBDEC",   /* Peacock  */
  Personal: "#45C6A6",   /* Sage → teal   */
  Social:   "#BC7BD6",   /* Grape    */
  Health:   "#F394A8"    /* Flamingo → rose */
};
const CAL_OF = {
  "Standup":"Work","Deep work block":"Work","Team planning":"Work","Client call":"Work",
  "1:1 with boss":"Work","Client workshop":"Work","Office day":"Work","Team offsite":"Work",
  "Farmers market":"Personal","Groceries":"Personal","Nothing planned":"Personal",
  "Coffee with Jo":"Social","Call parents":"Social","Dinner out":"Social",
  "Dinner at Sam's":"Social","Pub quiz":"Social","Lunch with Ash":"Social",
  "Rosie's birthday":"Social",
  "Physio":"Health","Dentist":"Health","Pick up prescription":"Health","Long bath":"Health"
};
function calOf(e){ return e.cal || CAL_OF[e.name] || "Personal" }
/* Two channels on one chip, because two different things are worth knowing and
   only one of them is worth a whole colour.

   The FILL says what the event does to you — the only thing this app has an
   opinion about. Dark and saturated rather than the pale Google-calendar wash
   it started as: these sit on a coloured day cell, and a deep chip with light
   type holds its edge against a gradient where a pastel one dissolved into it.

   The NOTCH down the left edge says which calendar it came from. That's real
   information but it isn't a decision, so it gets three pixels instead of the
   whole chip — four hues across a week was a rainbow you had to look past. */
/* Stoplight, plus blue for the things that don't touch you either way. Labels
   are white on all four. */
const CHIP = {
  give:  "#0f8a5f",   /* emerald   — gives back   */
  flat:  "#4a72c8",   /* periwinkle — neither     */
  thin:  "#b5822c",   /* gold      — getting thin */
  drain: "#c9334f"    /* crimson   — draining     */
};
function calInk(){ return "#ffffff" }
/* A condition you made keeps YOUR hue, but deepened to the same weight as the
   rest — a pastel bar with dark type was the last thing on screen still dressed
   as a Google Calendar event. */
function deepen(hex,k){
  const n=parseInt(hex.slice(1),16);
  const r=Math.round((n>>16)*k), g=Math.round(((n>>8)&255)*k), b=Math.round((n&255)*k);
  return "#"+[r,g,b].map(v=>Math.max(0,Math.min(255,v)).toString(16).padStart(2,"0")).join("");
}
function chipState(e){
  /* a multi-day span carries no per-day price, only a direction */
  if(isSpan(e)) return e.dir==="up" ? "give" : e.dir==="down" ? "thin" : "flat";
  const c=costOf(e);
  if(c==null)  return "flat";
  if(c<0)      return "give";
  if(c===0)    return "flat";
  return c<COST_BANDS[1] ? "thin" : "drain";
}
function calColor(e){
  /* Only a condition YOU made keeps the colour you gave it. A multi-day thing
     off the calendar is still an event, and gets read the same way as the rest. */
  if(e.src==="spoon" && e.color) return deepen(e.color,.62);
  return CHIP[chipState(e)];
}
/* the notch: which calendar, at three pixels */
function calRail(e){ return e.color || CALENDARS[calOf(e)] }
function calColorRaw(e){ return e.color || CALENDARS[calOf(e)] }
/* Google's palette, for conditions you create yourself */
const PALETTE = ["#F0608C","#F394A8","#F7C264","#45C6A6","#5FBDEC","#BC7BD6","#8a92b7"];
/* Conditions carry an emoji you choose — the thing that tells them apart from
   calendar events at a glance, without inventing another border style. */
const EMOJI = ["🩸","🌙","🤒","🛏️","✈️","🏠","🧠","⛈️","🌱","🎉","💼","⚓"];
/* Trend arrows: down for a drain, up for a restore, nothing for neutral or
   unpriced. Conditions carry a declared direction instead of a cost. */
const TREND = { up:"\u2197", down:"\u2198" };   /* ↗ ↘ — the characters themselves */
function trendGlyph(d){ return `<span class="arrow">${TREND[d]}</span>` }
const REPEAT = "\u21bb";                        /* ↻ */
function trendOf(e){
  if(isSpan(e)) return e.dir||null;
  const c=costOf(e);
  if(c==null||c===0) return null;
  return c<0 ? "up" : "down";
}
function trendIcon(e){ const d=trendOf(e); return d?trendGlyph(d):"" }

/* The amber border tying a flagged row to the notification was right in
   principle and wrong in practice: a box around one row in a list of
   hairline-separated rows reads as "selected", not as "look at this". An icon
   makes the same claim without borrowing a state that means something else. */
const WARN_ICON = `<svg class="wi" viewBox="0 0 16 16" fill="none" stroke="currentColor"
  stroke-width="1.5" stroke-linecap="round"><circle cx="8" cy="8" r="6.5"/>
  <path d="M8 4.7v3.9"/><circle cx="8" cy="11.5" r=".85" fill="currentColor" stroke="none"/></svg>`;
/* One mark, one meaning: this is costing you more than you thought, and the
   notification below is counting it. There used to be a green dot for the
   opposite case — an event running cheaper than its estimate — and nobody could
   tell you what it meant, which is the whole argument against it. That's good
   news with nothing to do about it, and it's still waiting in the event's own
   sheet for anyone who opens it. A row in an agenda earns a mark by being
   actionable, not by being true. */
function flagMark(e){ return drainNote(e) ? `<span class="warn">${WARN_ICON}</span>` : "" }

function typeIcon(t){
  if(!t||!ICONS[t]) return "";
  return `<svg class="ico" viewBox="0 0 20 20" fill="none" stroke="currentColor"
    stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"
    aria-label="${t}">${ICONS[t]}</svg>`;
}
const ZONES = [
  {k:"over",  min:0,   color:"#f0537c"},
  {k:"tight", min:.25, color:"#eda029"},
  {k:"ok",    min:.45, color:"#23a8a2"}
];
/* Recovery is non-linear (concept.md §4): a night near full tops you up almost
   completely; a night at empty barely moves you. Deep depletion takes days. */
const NIGHT_R = .21, NIGHT_BAD = .05;
function nightRefill(c){ return NIGHT_R * (.30 + .70*c) }
const REFILL_PER_OPEN_HOUR = .022, DAY_OPEN_CAP = .10;
const DAY_START_H = 7, DAY_END_H = 23;

const YESTERDAY = "2026-09-11";
/* A multi-day event is usually a CONDITION of the week, not a spend — a
   holiday, a flare, a deload. It gets a banner and no per-day cost. */
const SEED_EVENTS = [
  ["2026-09-11","09:00","Standup",0,"executive"],
  ["2026-09-11","13:00","Lunch with Ash",.20,"social"],
  ["2026-09-11","19:30","Pub quiz",.30,"social"],
  ["2026-09-12",null,"Replenish mana",null,null,5,null,null,"#45C6A6","up","cal"],
  ["2026-09-13",null,"Sick",null,null,4,.60,28,"#F394A8","down","spoon","🤒"],
  ["2026-09-12","10:00","Farmers market",.15,"sensory"],
  ["2026-09-12","15:00","Coffee with Jo",.15,"social"],
  ["2026-09-13","17:00","Call parents",.15,"social"],
  ["2026-09-13","20:00","Long bath",-.15,"physical"],
  ["2026-09-14","09:00","Standup",0,"executive"],
  ["2026-09-14","10:00","Deep work block",0,"executive"],
  ["2026-09-14","18:00","Groceries",.10,"sensory"],
  ["2026-09-15","09:00","Standup",0,"executive"],
  ["2026-09-15","11:00","Team planning",.20,"social"],
  ["2026-09-15","17:00","Physio",.10,"physical"],
  ["2026-09-16","09:00","Standup",0,"executive"],
  ["2026-09-16","14:00","Client call",.15,"social"],
  ["2026-09-16","19:30","Dinner out",.25,"social"],
  ["2026-09-17","09:00","Standup",0,"executive"],
  ["2026-09-17","10:30","1:1 with boss",.20,"social"],
  ["2026-09-17","15:00","Client workshop",.25,"executive"],
  ["2026-09-17","19:00","Dinner at Sam's",.30,"social"],
  ["2026-09-17",null,"Pick up prescription",null,null],
  ["2026-09-18","09:00","Standup",0,"executive"],
  ["2026-09-18","11:00","Office day",null,null],
  ["2026-09-19","13:00","Rosie's birthday",null,null],
  ["2026-09-20","11:00","Nothing planned",-.30,"physical"],
  ["2026-09-21","09:00","Standup",0,"executive"],
  ["2026-09-21","14:00","Dentist",null,null],
  ["2026-09-22","09:00","Standup",0,"executive"],
  ["2026-09-22","10:00","Team offsite",.45,"social"],
  ["2026-09-23","09:00","Standup",0,"executive"],
  ["2026-09-24","12:00","Lunch with Ash",null,null],
  ["2026-09-25","09:00","Standup",0,"executive"]
];

/* Invitations you've been sent and haven't answered yet. In the real app this
   is the calendar's own RSVP status (needsAction); here it's just a list of
   names so the outline treatment has something to show. */
const SEED_INVITED = ["Dinner out", "Dinner at Sam's", "Rosie's birthday"];

/* Tasks are just untimed events — same cost, same type, same calibration loop.
   Undated ones are a pool; give one a date and it counts against that day. */
/* name, cost, type, days-since-added, hard deadline (or null) */
const SEED_TASKS = [
  ["Sort out the insurance thing", .35, "executive", 26, null],
  ["File the tax return",          .40, "executive",  9, "2026-09-30"],
  ["Call the bank",                .25, "executive",  7, null],
  ["Book dentist",                 .15, "executive", 14, null],
  ["Reply to Priya",               .10, "social",     3, null],
  ["Laundry",                      .10, "physical",   2, null],
  ["Water the plants",             .05, "physical",   5, null]
];

/* Two kinds of recovery, and they behave differently.
   Passive: available now, suggested when you're depleted.
   Planned: needs a slot in the calendar, so it gets suggested *ahead* of time
   when a day with room is coming up. */
const REPERTOIRE = [
  {n:"Lie down in the dark",         t:"sensory"},
  {n:"Walk on your own",             t:"social"},
  {n:"An evening with no decisions", t:"executive"},
  {n:"Lie down without sleeping",    t:"physical"},
  {n:"Long bath",                    t:"physical"},
  {n:"Audiobook, eyes shut",         t:"sensory"}
];
/* Seeds only — this list is yours to edit, so it lives in state. */
const SEED_PLANNED = [
  {n:"Massage",         t:"physical",  cost:-.25, at:"14:00"},
  {n:"Spa day",         t:"physical",  cost:-.30, at:"11:00"},
  {n:"Museum day",      t:"sensory",   cost:-.15, at:"11:00"},
  {n:"Quiet night in",  t:"sensory",   cost:-.20, at:"19:00"},
  {n:"Hobby day",       t:"executive", cost:-.25, at:"11:00"},
  /* the one restore that's social rather than solitary — company you don't
     have to mask around replenishes rather than costs */
  {n:"Chill hang with friends", t:"social", cost:-.15, at:"19:00"},
  /* Ferri's words. Both are whole days rather than appointments, and both are
     defined by absence — which is why they're the two biggest restores on the
     list. A day with nothing in it is not a wasted day; it's the one that pays
     for the others. */
  {n:"Factory reset day", t:"executive", cost:-.35, at:"10:00"},
  {n:"Nothing day",       t:"executive", cost:-.30, at:"10:00"}
];

/* Estimate-vs-actual history, matched by event name. Real calendars give
   recurring-series ids; here the name is the series. */
/* Which things you MARKED as draining, and when. Not a rating of everything —
   just the times you said "that one took it out of me". Standup and Office day
   appear nowhere, which is the point: they've been quietly fine for weeks and
   the app prices them accordingly. */
/* A real calendar arrives with months behind it; this prototype carries three
   days. So recurring names get a "known since" — demo scaffolding standing in
   for history the seed doesn't hold, and the thing that lets habituation show:
   Standup has been fine for five months, and is priced like it. */
const SEED_KNOWN = {
  "Standup":        150, "Office day":     120, "Groceries":       95,
  "Dinner at Sam's": 70, "1:1 with boss":  140, "Client workshop": 60,
  "Team planning":   90, "Physio":         80,  "Client call":     45
};
const SEED_DRAINS = [
  ["1:1 with boss",    3], ["1:1 with boss",   10], ["1:1 with boss",   17],
  ["Client workshop",  6], ["Client workshop", 20],
  ["Team offsite",    12],
  ["Groceries",       26]
];

/* Ferri's own recovery tree (photographed 13 Sept 2026), minus the creative
   branch. Two things it does that the app's model didn't:
   1. It distinguishes TOO MUCH from TOO LITTLE within a category — running
      around vs sedentary, overwhelmed by people vs lonely. Depletion doesn't
      always mean "needs rest", and half these branches prescribe doing more.
   2. It carries kinds the cost model doesn't track (emotional, spiritual).
      That's fine: what drains you is tagged four ways, what helps you doesn't
      have to be. */
const OVERWHELMED = {
  frozen:  "Give yourself permission to stop what you're doing and breathe.",
  anxious: "Look at what's actually coming. Knowing the shape of it is the thing that helps."
};
/* Every item now says what it ASKS OF YOU and what it COSTS IN TIME, because the
   most useless advice is advice you can't act on in the state you're in. A tree
   that offers "get a massage" to someone who can't get off the floor hasn't met
   them.
     needs — "down" can't get up · "in" upright, at home · "out" can leave
     takes — "mins" · "hour" · "evening" · "day"
   Both nest: if you can go out you can also do the lying-down ones, and an
   evening contains an hour. */
const I = (n,needs,takes)=>({n,needs,takes});
const RECOVERY_TREE = {
  physical: {label:"Physical", short:"Physically worn out", branches:[
    {dir:"much", label:"On your feet all day", items:[
      I("Lie down","down","mins"), I("Relax","down","hour"),
      I("Take a bath","in","hour"), I("Get a massage","out","hour")]},
    {dir:"little", label:"Sat still all day", items:[
      I("Take a walk","out","mins"), I("Exercise","out","hour")]}]},
  sensory: {label:"Sensory", short:"Overstimulated", branches:[
    {dir:"much", label:"Crowds, noise, bright lights, chatter", items:[
      I("Dark room and lie down","down","mins"), I("Deep breathing","down","mins"),
      I("Calm music","down","mins"), I("No phone or screens","down","hour")]}]},
  executive: {label:"Mentally taxing", short:"Brain's fried", branches:[
    {dir:"much", label:"Thinking hard all day", items:[
      I("Meditate","down","mins"), I("Turn off your phone for a bit","down","hour"),
      I("No screens","down","evening")]}]},
  social: {label:"Social", short:"Social battery", branches:[
    {dir:"much", label:"Talking to people a lot", items:[
      I("Be honest with yourself about your battery level","down","mins"),
      I("Look ahead at what you've committed to — you can cancel, real friends will understand","in","mins"),
      I("Alone time","in","evening"),
      I("Take yourself out on a solo date","out","evening")]},
    {dir:"little", label:"Lonely, not enough that meant anything", items:[
      I("Reach out to friends and family","down","mins"),
      I("Make plans with friends","in","mins"),
      I("Spend time with close friends","out","evening")]}]},
  emotional: {label:"Emotionally taxing", short:"Emotionally wrung out", branches:[
    {dir:"much", label:"A lot to feel", items:[
      I("Talk to a friend, vent","in","hour"), I("Journal — get them out","in","hour"),
      I("Alone time","in","evening"), I("Avoid social situations for a bit","in","evening")]}]},
  spiritual: {label:"Directionless", short:"Directionless", branches:[
    {dir:"any", label:"Lacking meaning or purpose", items:[
      I("Meditation","down","mins"),
      I("Listen to music or look at art that inspires you","down","hour"),
      I("A spiritual practice of some kind","in","hour"),
      I("Engage with your community","out","evening"),
      I("Volunteer locally","out","day")]}]}
};
/* the tree's items used to be plain strings; everything that prints one goes
   through here so both shapes still read */
function itemName(i){ return typeof i==="string" ? i : i.n }
const NEEDS_RANK = {down:0, in:1, out:2};
const TAKES_RANK = {mins:0, hour:1, evening:2, day:3};

/* The quick row exists so the thing you want is already there. Both lists are
   Ferri's own words, written 13 Sept 2026 — the same rule as the recovery tree
   (§8): the app never offers a phrase for your day that you didn't choose.
   They're sized, and typed: a meltdown is not a difficult conversation, and a

let S = load() || fresh();
