/* Asked the next morning, batched — not an hour after the event.
   Working out how something landed takes time, and an event's real cost
   includes payback that hasn't arrived yet, so a next-day rating is MORE
   accurate here, not less (concept.md §7).

   Decay: nothing is asked about once its name is learned well enough to price
   itself. The better it knows you, the less it speaks. */
const ASK_DEFER_LIMIT = 3;
function askable(e){
  return costOf(e)>0
      && !(S.logged||[]).includes(e.id)
      && !(S.skipped||[]).includes(e.id)
      && ((S.deferred||{})[e.id]||0) < ASK_DEFER_LIMIT
      && !isLearned(e.name);
}
function askQueue(){
  const events = eventsOn(YESTERDAY).filter(e=>e.time!=null && askable(e));
  const tasks  = S.events.filter(e=>e.task&&e.done
                   &&(e.doneAt===YESTERDAY||e.doneAt===TODAY)&&askable(e));
  return events.concat(tasks).sort((a,b)=>(a.time?hm(a.time):99)-(b.time?hm(b.time):99));
}

/* ---------- blurb ---------- */
/* The horizon is yours to pick. The shrink-as-you-drain behaviour (§8) survives
   in its strongest form — below the bottom threshold the week is hidden
   entirely — but the intermediate 7→3 step is gone with the "auto" option. */
function horizonDays(){ return S.horizon || 3 }
function trendText(){
  const d=S.charge-S.prevCharge, gap=daysBetween(S.lastLog,TODAY);
  const dt=parse(S.lastLog);
  const since = gap===0 ? "since this morning"
              : gap===1 ? "since yesterday"
              : gap<=6  ? "since "+dow(S.lastLog)
              : "since "+dt.getDate()+" "+MON[dt.getMonth()].slice(0,3);
  if(Math.abs(d)<.04) return "steady "+since;
  return (d>0?"climbing ":"dropping ")+since;
}
function stateWord(v){
  if(v<=.04) return "empty";
  if(v<.18)  return "crashing";
  if(v<.32)  return "running low";
  if(v<.46)  return "spread thin";
  if(v<.62)  return "okay";
  if(v<.80)  return "good";
  return "great";
}
/* With no number on screen, the state phrase IS the heading — it's doing the
   job the 64px figure does otherwise. So the blurb drops its own opener when a
   headline is shown, rather than saying "Feeling good. Good charge, and…".
   Same bands as the check-in's readout word, so the home screen and the slider
   can't describe the same charge differently. */
function headline(){
  const c=S.charge;
  if(c<=.04) return "One thing at a time.";
  if(c<.18)  return "Let's take it a day at a time.";
  if(c<.32)  return "Go gently today.";
  if(c<.46)  return "There's not much spare.";
  if(c<.62)  return "Enough to work with.";
  if(c<.80)  return "Feeling good.";
  return "Feeling great.";
}

function blurb(headed){
  const capNow=capOn(TODAY);
  if(capNow<1){
    const n=capNameOn(TODAY);
    const rec=S.events.find(e=>isSpan(e)&&e.cap&&e.every&&coversDate(e,TODAY));
    return `${n} — you can't get above ${fmt(capNow)} while it lasts.${rec?" It comes round again, so this is a ceiling you can plan for.":" Plan for that ceiling, not your usual one."}`;
  }
  const f=project(7), over=f.slice(1).filter(d=>zoneOf(d.end).k==="over"&&d.load>0);
  const c=S.charge, n=v=>noNums()?"":fmt(v);
  const firstOver = over[0];
  const day = firstOver?dowL(firstOver.date):"Sunday";
  if(c<=0) return headed
    ? "Anything you spend now comes out of recovery time."
    : "You're at empty. Anything you spend now comes out of recovery time.";
  if(c<.20) return headed ? "Just today, then." : "Running very low. Just today, then.";
  if(c<.35) return headed
    ? "This week is asking for more than that. Worth looking at what could move."
    : `${noNums()?"You're low":"You're at a "+n(c)}, and this week is asking for more than that. Worth looking at what could move.`;
  if(c<.50) return headed
    ? `Enough for the week as planned, but there's no slack in it. A quiet ${day} would buy you some.`
    : `${noNums()?"Middling":"You're at a "+n(c)}. Enough for the week as planned, but there's no slack in it. A quiet ${day} would buy you some.`;
  if(c<.70) return firstOver
    ? `${headed?"But ":"Decent charge, but "}${dowL(firstOver.date)} is going to be a tough one.`
    : `${headed?"The week ahead fits without much fuss.":"Decent charge, and the week ahead fits without much fuss."}`;
  if(c<.85) return firstOver
    ? `${headed?"Though ":"Good charge — though "}${dowL(firstOver.date)} is still going to be a stretch.`
    : `${headed?"This week fits — taking it easy is still the smart call.":"Good charge, and this week fits — taking it easy is still the smart call."}`;
  return firstOver
    ? `${headed?"But ":"Plenty in the tank, but "}${dowL(firstOver.date)} is heavy enough to matter.`
    : `${headed?"Plenty of room for the week you've got planned.":"Plenty of room in the tank for the week you've got planned."}`;
}
function paybackDays(debt){
  if(!debt||debt<=.01) return 0;
  return Math.max(1, Math.round(debt/(nightRefill(0)+DAY_OPEN_CAP)));
}
function recoveryDays(){
  let c=S.charge,d=0;
  while(c<.62&&d<21){ c=Math.min(1,c+nightRefill(c)+DAY_OPEN_CAP); d++ }
  return d;
}
function drainedType(){
  const since=addDays(TODAY,-7); const tally={};
  S.events.filter(e=>e.cost>0&&e.type&&e.date>=since&&e.date<=addDays(TODAY,2))
    .forEach(e=>tally[e.type]=(tally[e.type]||0)+e.cost);
  return Object.entries(tally).sort((a,b)=>b[1]-a[1])[0]?.[0]||"sensory";
}

/* ---------------------------------------------------------------------------
   WEEK ARC
   The day-view gradient generalised to a week: charge falls through each day and
   climbs overnight, so the shape is a sawtooth that sags when the week is too
   full. Past days are evening readings only; future days carry full curves.
---------------------------------------------------------------------------- */
/* One day per column, matching the strip below it, so the two read as a single
   component. Inside each column the waking hours take the first 72% and the
   overnight climb takes the rest — which is what makes it a sawtooth. */
function arcPoints(days){
  const f=project(days), pts=[];
  const SAMPLE=1.5, span=DAY_END_H-DAY_START_H, DAY1=days===1;
  f.forEach((d,i)=>{
    const at=h=>{
      let c=d.curve[0].c;
      for(let j=0;j<d.curve.length-1;j++){
        const a=d.curve[j], b=d.curve[j+1];
        if(h>=a.h&&h<=b.h&&b.h>a.h) return lerp(a.c,b.c,(h-a.h)/(b.h-a.h));
        if(d.curve[j].h<=h) c=d.curve[j].c;
      }
      return c;
    };
    /* Every horizon shares one axis: each day's column IS a 24-hour clock, so an
       hour sits at h/24 across it. The waking curve runs 7am–11pm (29%–96% of
       the column) and the gap to the next day is the overnight climb, drawn at
       its true width. The columns used to squeeze the waking day into 72% and
       give the night 28%, which put the "you are here" dot well to the left of
       where the clock says you are — 4:45pm landed at 44% of the day instead of
       70%. */
    if(i===0) pts.push({x:0, c:at(DAY_START_H), date:d.date, h:0});
    for(let h=DAY_START_H;h<=DAY_END_H+.001;h+=SAMPLE){
      const hh=Math.min(h,DAY_END_H);
      pts.push({x:(i+hh/24)/days, c:at(hh), date:d.date, h:hh});
    }
  });
  /* the last day's overnight stretch has nothing after it — carry the line to
     the edge so the chart doesn't stop short of its own frame */
  if(pts.length) pts.push({...pts[pts.length-1], x:1});
  return pts;
}
function weekArc(days){
  const W=358, H=86, PAD=5;
  const pts=arcPoints(days);
  const y=c=>PAD+(1-c)*(H-PAD*2), X=x=>x*W;

  /* smooth the polyline with midpoint quadratics — keeps the peaks, drops jitter */
  let path=`M${X(pts[0].x).toFixed(1)},${y(pts[0].c).toFixed(1)}`;
  for(let i=1;i<pts.length-1;i++){
    const mx=(X(pts[i].x)+X(pts[i+1].x))/2, my=(y(pts[i].c)+y(pts[i+1].c))/2;
    path+=`Q${X(pts[i].x).toFixed(1)},${y(pts[i].c).toFixed(1)} ${mx.toFixed(1)},${my.toFixed(1)}`;
  }
  const last=pts[pts.length-1];
  path+=`L${X(last.x).toFixed(1)},${y(last.c).toFixed(1)}`;

  const stops=pts.map(pt=>`<stop offset="${(pt.x*100).toFixed(1)}%" stop-color="${colorFor(pt.c)}"/>`).join("");
  let grid=Array.from({length:days-1},(_,i)=>
    `<line x1="${X((i+1)/days)}" y1="0" x2="${X((i+1)/days)}" y2="${H}" stroke="var(--hair)" stroke-width="1"/>`).join("");
  const lowest=pts.reduce((a,b)=>b.c<a.c?b:a,pts[0]);

  /* At one day the arc IS a clock, so it gets hour lines and a label every four
     hours. Longer horizons subdivide by day instead — hour lines across seven
     columns would be a hundred-odd strokes of noise. */
  let axis="";
  if(days===1){
    for(let h=1;h<24;h++)
      grid+=`<line x1="${X(h/24)}" y1="0" x2="${X(h/24)}" y2="${H}" stroke="var(--hair)"
               stroke-width="1" opacity="${h%4===0?"1":".45"}"/>`;
    /* midnight is labelled at both ends so the axis reads as a whole day rather
       than a window onto one — pinned to the edges, since a centred label there
       would hang half outside the frame */
    axis=`<span class="hr edge" style="left:10px">${clockLabel(0)}</span>`
       + [4,8,12,16,20].map(h=>`<span class="hr" style="left:calc(10px + (100% - 20px) * ${(h/24).toFixed(4)})">${clockLabel(h)}</span>`).join("")
       + `<span class="hr edge" style="right:10px">${clockLabel(0)}</span>`;
  }

  /* "You are here" — the dot walks the curve as the day goes by. It used to mark
     the week's lowest point, but that's already said by the colour and by the
     heads-up card, and a marker that never moves teaches you nothing. */
  const nowX = NOW_H/24/days;      /* the same clock the columns are drawn on */
  const showNow = true;
  const cAt=x=>{
    for(let i=0;i<pts.length-1;i++){
      const a=pts[i], b=pts[i+1];
      if(x>=a.x && x<=b.x && b.x>a.x) return lerp(a.c, b.c, (x-a.x)/(b.x-a.x));
    }
    return pts[pts.length-1].c;
  };
  const nowC = cAt(Math.max(0,Math.min(1,nowX)));

  return {svg:`<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">
      <defs><linearGradient id="arcg" x1="0" x2="${W}" gradientUnits="userSpaceOnUse">${stops}</linearGradient></defs>
      ${grid}
      ${showNow?`<line x1="${X(nowX)}" y1="0" x2="${X(nowX)}" y2="${H}" stroke="var(--ink)"
               stroke-width="1" opacity=".5"/>`:""}
      <line x1="0" y1="${y(.25)}" x2="${W}" y2="${y(.25)}" stroke="#2f3760" stroke-width="1"/>
      <path d="${path}" fill="none" stroke="url(#arcg)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
      ${showNow?`<circle cx="${X(nowX)}" cy="${y(nowC)}" r="3.5" fill="var(--surface)" stroke="${colorFor(nowC)}" stroke-width="2"/>`:""}
    </svg>`, axis, lowest};
}
/* The day cell shows the charge as a stack of bars — a visual, deliberately
   independent of which number scale is on, so it reads the same at /10, /100 or
   in spoons. Capped at six; the number beside it carries the precision. */
/* banners intersecting the visible window, clipped to it */
function spansIn(dates){
  const first=dates[0], n=dates.length;
  const out=[];
  for(const e of S.events){
    if(!isSpan(e)) continue;
    const len=e.span||1, step=e.every||0;
    /* every start that could touch the window */
    const starts=[];
    if(!step) starts.push(e.date);
    else {
      const k=Math.floor(daysBetween(e.date,first)/step);
      for(let i=-1;i<=Math.ceil(n/step)+1;i++) starts.push(addDays(e.date,(k+i)*step));
    }
    for(const st of starts){
      const s=daysBetween(first,st);
      const from=Math.max(0,s), to=Math.min(n-1, s+len-1);
      if(to<from) continue;
      out.push({e, from, to, open:s<0});
    }
  }
  /* Conditions stack above calendar spans — yours first, then the calendar's,
     with a gap between so the two kinds read as two groups. */
  const lay=(list)=>list.sort((a,b)=>a.from-b.from||b.to-a.to)
    .reduce((lanes,s)=>{
      let row=0;
      while(lanes.some(x=>x.row===row && !(s.from>x.to || s.to<x.from))) row++;
      lanes.push({...s,row}); return lanes;
    },[]);
  const mine=lay(out.filter(s=>isCondition(s.e)));
  const cal =lay(out.filter(s=>!isCondition(s.e)));
  const mineRows=mine.length?Math.max(...mine.map(s=>s.row))+1:0;
  return mine.map(s=>({...s,group:"mine"}))
    .concat(cal.map(s=>({...s,group:"cal",row:s.row,offsetRows:mineRows})));
}

---------------------------------------------------------------------------- */
const $ = id=>document.getElementById(id);
const GEAR = `<svg class="gear" viewBox="0 0 24 24" fill="none" stroke="currentColor"

</svg>`;

function render(){
  projCache=null;
  S.events=S.events.filter(e=>!(e.task&&e.done&&e.doneAt&&daysBetween(e.doneAt,TODAY)>DONE_KEEP_DAYS));
  renderForecast(); renderCalendar(); renderDay(); renderTasks(); renderLog();
  document.querySelectorAll(".tabs button").forEach(b=>b.classList.toggle("on",b.dataset.tab===S.tab||(S.tab==="day"&&b.dataset.tab==="calendar")));
  document.querySelectorAll(".view").forEach(v=>v.classList.remove("on"));
  $("v-"+S.tab).classList.add("on");
  save();
}

function renderForecast(){
  const f=project(horizonDays()), today=f[0], low=S.charge<.25;
  /* concept.md §4: at the bottom band the score disappears — a bleak number to
     stare at is not useful information when you're crashed. */
  /* no number means no heading — so the state phrase takes the place the figure
     would have held, rather than leaving the screen opening on a bar */
  const headed = noNums() || S.charge < .20;
  const chargeBlock = headed
    ? `<div><div class="bat"><i style="width:${Math.max(3,S.charge*100)}%;background:${colorFor(S.charge)}"></i></div></div>`
    : `<div><div class="charge">${fmt(S.charge)}<span> / ${fmtMax()} ${unitName()}</span></div></div>`;

  let strip="";
  if(!low){
    const arc=weekArc(f.length);
    const HZ=[[1,"1 day"],[3,"3 day"],[7,"7 day"]];
    strip = `<div class="striphead">
        <p class="label">${f.length===1?"Today":f.length===3?"The next few days":"This week's arc"}</p>
        <div class="hzwrap">
          <button class="hz" data-hmenu="1">${HZ.find(h=>h[0]===f.length)?.[1]||f.length+" day"} ▾</button>
          ${S.hmenu?`<div class="hzmenu">
            ${HZ.map(([n,l])=>`<button data-horizon="${n}" class="${f.length===n?"on":""}">${l}</button>`).join("")}
          </div>`:""}
        </div>
      </div>
      <div class="arcbox">
        <button class="arc" data-arcinfo="1">${arc.axis}${arc.svg}</button>
        <div class="stripcols">
        <div class="colbg">${f.map(d=>`<i class="z-${cellState(d.date)}"></i>`).join("")}</div>
        <div class="stripgrid head">`+
      f.map(d=>{
        const st=cellState(d.date);
        return `<button data-goday="${d.date}" class="z-${st} ${d.date===TODAY?"sel":""}">
          <span class="dl">${dow(d.date)}</span>
          <span class="dd">${dayNum(d.date)}</span>
        </button>`;
      }).join("")+`</div>
        ${(()=>{const dates=f.map(x=>x.date), sp=spansIn(dates);
          if(!sp.length) return "";
          const mineRows=sp.filter(s=>s.group==="mine").length
            ? Math.max(...sp.filter(s=>s.group==="mine").map(s=>s.row))+1 : 0;
          const calRows=sp.filter(s=>s.group==="cal").length
            ? Math.max(...sp.filter(s=>s.group==="cal").map(s=>s.row))+1 : 0;
          const GAP = (mineRows&&calRows) ? 7 : 0;
          /* At seven columns a calendar span is drawn like the chips below it —
             same height, no label — because there's no room to read one and the
             bar already says "this stretch is spoken for". A condition keeps its
             words at every width: "max 6" is a claim about the week you can't
             check anywhere else. */
          const wide = f.length<=4;
          const CALH = wide ? 16 : 9;                     /* bar + 2px gap */
          const topOf=s=>4 + (s.group==="cal" ? mineRows*16+GAP : 0) + s.row*(s.group==="cal"?CALH:16);
          const h = 4 + mineRows*16 + GAP + calRows*CALH;  /* 2px below the last bar */
          return `<div class="spans" style="height:${h}px">
            ${sp.map(s=>{
            const left=s.from/dates.length*100, w=(s.to-s.from+1)/dates.length*100;
            const labelled = s.group==="mine" || wide;
            return `<button class="spanbar ${s.group==="mine"?"mine":"cal"} ${labelled?"":"slim"}" data-editcond="${s.e.id}" style="left:calc(${left}% + 6px);width:calc(${w}% - 12px);top:${topOf(s)}px;background:${calColor(s.e)}">${
            labelled
              ? `${s.e.emoji?`<span class="emo">${s.e.emoji}</span>`:""}${s.open?"‹ ":""}${s.e.name}${s.e.cap?` · max ${fmt(s.e.cap)}`:""}${s.e.every?`<span class="arrow rep">${REPEAT}</span>`:""}${trendIcon(s.e)}`
              : ""
          }</button>`;
          }).join("")}</div>`;})()}
        <div class="stripgrid body ${f.length<=4?"wide":""}">`+
      f.map(d=>{
        const st=cellState(d.date);
        const evs=eventsOn(d.date).filter(e=>costOf(e)!=null||e.type);
        const shown=evs.slice(0,3), extraN=evs.length-shown.length;
        return `<button data-goday="${d.date}" class="z-${st} ${isPartial(d.date)?"partial":""}">
          <span class="evs">
            ${shown.map(e=>`<span class="cev${e.inv?" inv":""}"
                style="--c:${calColor(e)}">${trendIcon(e)}<b>${e.name}</b></span>`).join("")}
            ${extraN>0?`<span class="cev more"><b>+${extraN}</b></span>`:""}
          </span>
        </button>`;
      }).join("")+`</div>
        </div>
      </div>`;

  }

  let extra="";
  if(low){
    /* Burnout mode still has to be constructive. It strips the week away, not
       the help: a guess at what would help now, a way to interrogate that guess,
       and — because the thing you can't do while crashed is arrange anything —
       an offer to put recovery in a day that still has room. */
    const g=inferBranch(), other=g.tree.branches.find(b=>b!==g.branch);
    const r=S.tiredResult, hasR=!!(r&&r.at===TODAY);
    extra = `<div class="rec-note">
        <b>Today only.</b> The week can wait.<br>${OVERWHELMED.frozen}
      </div>
      ${hasR
        ? `<p class="label">What might help</p>
           <div class="card chartcard">
             ${chartHTML(r.picks,r.dirs,true)}
             <div class="recalt" style="margin-top:2px">
               <button data-tstart="1">check in again</button>
               <button data-tclear="1">clear</button>
             </div>
           </div>
           <div style="height:18px"></div>`
        : `<p class="label">${g.branch.label}?</p>
           <div class="card">
             ${g.branch.items.map(i=>`<div class="recitem">${i}</div>`).join("")}
             ${other?`<div class="recalt" style="margin-top:10px">
               <button data-branch="${g.key}|${other.dir}">no — ${other.label.toLowerCase()}</button>
             </div>`:""}
           </div>
           <div style="height:12px"></div>
           <button class="btn" data-tstart="1">See what can help</button>
           <div style="height:18px"></div>`}
      ${planBlock(7)}
      <button class="btn strong" data-goday="${TODAY}">See just today</button>
      <div style="height:24px"></div>`;
  } else {
    const over=f.slice(1).find(d=>zoneOf(d.end).k==="over"&&d.load>0);
    if(over){
      extra = `<p class="label">Heads up</p><div class="card">
        <div style="font-size:13px;line-height:1.45">${dowL(over.date)} is going to be tough.</div>
        <div class="hint" style="margin-top:5px;font-size:12px;line-height:1.5;color:var(--muted)">Cancel or move something if you can. If you can't, build in recovery time on either side.</div>

        <button class="btn" data-goday="${over.date}" style="margin-top:12px">Take a look at ${dowL(over.date)}</button>
      </div>`;
    } else {
      const rd=recoveryDays();
      extra = `<p class="label">Heads up</p><div class="card">
        <div style="font-size:13px;line-height:1.45">Nothing in the next ${f.length} days goes over.</div>
        <div class="hint" style="margin-top:6px">${S.charge<.62?`About ${rd} low-demand day${rd===1?"":"s"} would get you back to comfortable.`:"You're in the comfortable band."}</div>
      </div>`;
    }
    /* The roomy-day offer used to live only on the calendar, which meant
       simplifying that page would have deleted it from the app outside burnout.
       It belongs here anyway: an empty day is a reading of the week ahead, and
       this screen is where the week ahead is read. */
    extra += `<div style="height:20px"></div>${planBlock(7)}`;
  }

  /* Proactive flag: estimates that read low change the forecast, so say so
     before the user goes looking — with the arithmetic of what it would mean. */
  /* Tasks used to live at the bottom of this screen. They're a to-do list, and
     the forecast is a status report — putting the things you owe the world under
     the reading of how much you've got made one a demand on the other. */

  $("v-forecast").innerHTML = `
    <div class="scr-head"><h2>${niceDate(TODAY)}</h2>
      <button class="act" data-settings="1">${GEAR}</button></div>
    <div class="cond">
      ${headed?`<button class="headline" data-settings="1">${headline()}</button>`:""}
      <button class="condbtn" data-settings="1">${chargeBlock}</button>
      <p class="blurb">${blurb(headed)}</p>
      ${checkinPill()}
      ${low?"":tiredBlock()}
    </div>
    ${S.roughNight?`<p class="hint" style="margin:-10px 0 14px;text-align:center">Bad sleep logged — tonight's refill is withheld.</p>`:""}
    ${strip}
    ${extra}`;
}

function renderCalendar(){
  const [y,m]=S.month.split("-").map(Number);
  const first=new Date(y,m-1,1), pad=first.getDay(), len=new Date(y,m,0).getDate();

  /* A week doesn't stop because a month does. The days either side are real days
     with real load in them, and blanking them made the first and last rows read
     as broken grid rather than as the turn of the month. They're dimmed, and
     tapping one moves the calendar to that month. */
  const cellHTML=(date,d,adj)=>{
    const st=cellState(date);
    /* spans first, so a condition or a holiday runs along the top of the row the
       way it does in a real calendar */
    /* every event gets a chip here, priced or not — an unpriced one shows in
       grey, which is how a half-estimated day says so now */
    const chips=S.events.filter(e=>isSpan(e)&&coversDate(e,date))
                .concat(eventsOn(date))
                .slice(0,4)
                .map(e=>`<i class="${e.inv?"inv":""}${costOf(e)==null?" un":""}" style="--c:${calColor(e)}"></i>`).join("");
    return `<button class="cell ${st} ${adj?"adj":""} ${date===TODAY?"today":""} ${date===S.selDate?"sel":""}" data-day="${date}">
      <span class="d">${d}</span><span class="cevs">${chips}</span></button>`;
  };
  const iso=(yy,mm,dd)=>`${yy}-${String(mm).padStart(2,"0")}-${String(dd).padStart(2,"0")}`;

  let cells="";
  const prevY=m===1?y-1:y, prevM=m===1?12:m-1, prevLen=new Date(y,m-1,0).getDate();
  for(let i=pad;i>0;i--){ const d=prevLen-i+1; cells+=cellHTML(iso(prevY,prevM,d),d,true) }
  for(let d=1;d<=len;d++) cells+=cellHTML(iso(y,m,d),d,false);
  const nextY=m===12?y+1:y, nextM=m===12?1:m+1;
  let nd=1;
  for(let i=(pad+len)%7; i>0 && i<7; i++) cells+=cellHTML(iso(nextY,nextM,nd),nd++,true);
  const sel=S.selDate, evs=eventsOn(sel);
  const f=project(Math.max(1,daysBetween(TODAY,sel)+1));
  const d=daysBetween(TODAY,sel)>=0?f[f.length-1]:null;

  let rows = evs.map(e=>{
    const h=hintFor(e), flag=flagMark(h);
    return `<button class="ev ${e.pending?"isp":""}" data-ev="${e.id}">
      <span class="t">${e.time?e.time:"—"}</span>
      <span class="n">${e.name}</span>
      ${e.pending?`<span class="pending">pending</span>`:""}
      ${e.inv?`<span class="invited">invited</span>`:""}
      <span class="g">${typeIcon(e.type)}</span>
      ${flag}${costText(costOf(e),isInferred(e))}
    </button>`}).join("");

  if(d && d.bestGap && d.bestGap.len>=1.5){
    const g=d.bestGap, hrs=Math.round(g.len);
    rows += `<div class="ev open"><span class="t"></span>
      <span class="n">${hrs}h open · ${clockLabel(halfHour(g.from))}–${clockLabel(halfHour(g.from+g.len))}</span>
      <span class="g" style="opacity:0"></span>
      <span class="c plus">${noNums()?pips(.1,true):"+"+fmt(Math.min(d.openHours*REFILL_PER_OPEN_HOUR,DAY_OPEN_CAP))}</span></div>`;
  }
  if(!evs.length) rows += `<p class="hint" style="padding:10px 0">Nothing scheduled. That's recovery.</p>`;

  $("v-calendar").innerHTML=`
    <div class="scr-head"><h2>${MON[m-1]} ${y}</h2>
      <span class="cal-nav"><button data-mon="-1">‹</button><button data-mon="1">›</button></span></div>
    <div class="dow">${DOW.map(x=>`<span>${x[0]}</span>`).join("")}</div>
    <div class="grid">${cells}</div>
    <div class="legend">
      <span><i style="background:var(--ok-deep)"></i>fits</span>
      <span><i style="background:var(--tight-deep)"></i>you'll pay for it</span>
      <span><i style="background:var(--over-deep)"></i>over</span>
      <span><i style="background:none;border-color:var(--line-strong)"></i>no estimate</span>
    </div>
    <div class="agenda">
      <div style="display:flex;justify-content:space-between;align-items:baseline">
        <p class="label">${niceDate(sel)}</p>
        <button class="act" data-goday="${sel}" style="font-size:11px;color:var(--muted)">day view ›</button>
      </div>
      ${rows}
      ${d?`<div class="tot">
        <span>day total ${noNums()?pips(d.load):`<b>${fmt(d.load)}</b>`}</span>
        <span>you'll start with ${noNums()?pips(d.start):`<b>${fmt(d.start)}</b>`}</span></div>`:""}
    </div>
    <div style="height:26px"></div>
    ${lookNote(7)}
    ${condBlock()}`;
}

function renderDay(){
  const date=S.selDate, off=daysBetween(TODAY,date);
  const f=project(Math.max(1,off+1)), d= off>=0 ? f[f.length-1] : runDay(date,.7,0,capOn(date));
  const evs=eventsOn(date).filter(e=>e.time!=null);
  const untimed=eventsOn(date).filter(e=>e.time==null);
  const isHeavy=heavyOn(date);
  const H=380, span=DAY_END_H-DAY_START_H, y=h=>(h-DAY_START_H)/span*H;

  /* gradient from the computed curve */
  let stops=[];
  for(let i=0;i<=32;i++){
    const h=DAY_START_H+span*i/32;
    let c=d.curve[0].c;
    for(let j=0;j<d.curve.length;j++){ if(d.curve[j].h<=h) c=d.curve[j].c; }
    for(let j=0;j<d.curve.length-1;j++){
      const a=d.curve[j], b=d.curve[j+1];
      if(h>=a.h&&h<=b.h&&b.h>a.h){ c=lerp(a.c,b.c,(h-a.h)/(b.h-a.h)); break }
    }
    stops.push(`${colorFor(c)} ${(i/32*100).toFixed(1)}%`);
  }

  /* events, pushed down if they collide */
  let last=-99, nodes="";
  evs.forEach(e=>{
    let top=y(hm(e.time))-15; if(top<last+4) top=last+4; last=top+31;
    const isRest=costOf(e)!=null&&costOf(e)<0;
    let after=d.curve[0].c;
    for(const p of d.curve) if(p.h<=hm(e.time)+.9) after=p.c;
    const cv=costOf(e);
    const delta = cv==null ? "not priced"
      : `<span class="${isInferred(e)?"inf":""}">${cv<0?"+":"−"}${noNums()?"":fmt(Math.abs(cv))}</span> → <b>${noNums()?"":fmt(after)}</b>`;
    const h=hintFor(e), flag=flagMark(h);
    nodes+=`<div class="node" style="top:${y(hm(e.time))-8}px"></div>
      <button class="evt ${isRest?"rest":""} ${e.pending?"isp":""} ${isHeavy(e)?"drain":""}" data-mv="${e.id}" style="top:${top}px">
        <span class="n">${e.name}</span>${e.pending?`<span class="pending">pending</span>`:""}${e.inv?`<span class="invited">invited</span>`:""}${flag}<span class="d">${delta}</span></button>`;
  });

  let ticks="";
  for(let h=8;h<=22;h+=4) ticks+=`<span class="tick" style="top:${y(h)-5}px">${clockLabel(h)}</span>`;

  const cross = d.cross!=null
    ? `<div class="cross" style="top:${y(d.cross)}px"><span>under from here</span></div>` : "";
  /* current time, only on today — a now line on a future day means nothing */
  const nowLine = (date===TODAY && NOW_H>=DAY_START_H && NOW_H<=DAY_END_H)
    ? `<div class="nowline" style="top:${y(NOW_H)}px"><i></i><span>${clockLabel(NOW_H)}</span></div>` : "";

  const pb = paybackDays(d.debt);
  const pbLine = pb ? ` Ends empty with about ${pb} low-demand day${pb===1?"":"s"} to pay back.` : "";
  const u=unitName(), pl=unitPlural();
  const anyHeavy = eventsOn(date).filter(e=>!e.task).some(isHeavy);
  const lead = d.cross!=null
    ? `Your ${u} ${pl?"run":"runs"} out on ${dowL(date)} ${timeOfDay(d.cross)}.`
    : zoneOf(d.end).k==="over"
      ? `Your ${u} ${pl?"are":"is"} gone by the end of ${dowL(date)}.`
      : d.hasEvents
        ? `${dowL(date)} holds together, but leaves you nothing to spare.`
        : `Nothing scheduled. That's recovery.`;
  const sum = lead
    + (anyHeavy ? " The events marked in red are costing you the most. Start there." : "")
    + pbLine;

  /* A condition or a multi-day event doesn't happen AT a time, so it has no
     place on a timeline — but it sets the terms for everything that does. It
     rides above the day as a bar, the same shape it has on the calendar. */
  const dspans=S.events.filter(e=>isSpan(e)&&coversDate(e,date));

  $("v-day").innerHTML=`
    <div class="scr-head"><h2>${niceDate(date)}</h2>
      <button class="act" data-tab2="${S.dayBack||"calendar"}">back</button></div>
    <p class="sumline">${sum}</p>
    ${dspans.length?`<div class="condline" style="margin-top:12px">${dspans.map(e=>`<span class="${e.src==="spoon"?"mine":""}" style="--c:${calColor(e)}"
       >${e.emoji?`<span class="emo">${e.emoji}</span>`:""}${e.name}${e.cap&&!noNums()?` · max ${fmt(e.cap)}`:""}</span>`).join("")}</div>`:""}
    <div class="tl" style="height:${H}px">
      <div class="rail" style="background:linear-gradient(to bottom,${stops.join(",")})"></div>
      ${ticks}${nowLine}${cross}${nodes}
    </div>
    ${untimed.length?`<p class="label">No time set</p>
      ${untimed.map(e=>`<button class="ev ${isHeavy(e)?"drain":""}" data-mv="${e.id}">
        <span class="n">${e.name}</span>
        <span class="g">${typeIcon(e.type)}</span>
        ${costText(costOf(e),isInferred(e))}</button>`).join("")}
      <div style="height:16px"></div>`:""}
    <button class="btn" data-cantmove="${date}" style="border-color:var(--line);color:var(--muted)">I can't move anything</button>`;
}
function lastEventAfter(date,h){
  const e=eventsOn(date).filter(x=>x.time&&hm(x.time)>h&&x.cost>0).pop();
  return e?e.name:null;
}

/* Two different questions, kept apart. The check-in asks how you ARE — it's the
   handshake after a gap, and it belongs over the forecast because it's what you
   do in response to the number you just read. The Log is what HAPPENED: the
   things that cost you something and were never on the calendar. Merging them
   made one screen that answered neither question first. */
function sheetCheckin(){
  const gap=daysBetween(S.lastLog,TODAY), v=S.charge;
  /* "It's been 9 days" is a count of days you didn't open an app — a small
     reproach, in a tool whose whole premise is not adding those. */
  /* One notch per step the scale actually has, and the slider snaps to them —
     so the thumb always sits on a mark. /100 steps by 5, which is why this is
     max/step rather than max. */
  const sc=SCALES[S.scale];
  const divs = sc.max ? Math.round(sc.max/(sc.step||1)) : 10;
  const notches=Array.from({length:divs-1},(_,i)=>
    `<i style="left:calc(17px + (100% - 34px) * ${((i+1)/divs).toFixed(4)})"></i>`).join("");
  openSheet(`
    <h3>How are you doing?</h3>
    <p class="sub">${gap>2?`It's been a minute. `:""}Drag to wherever you are now.</p>

    <div class="readout" id="readout">
      <span class="w">${stateWord(v)}</span>
      ${noNums()?"":`<span class="v">${fmt(v)} / ${fmtMax()} ${unitName()}</span>`}
    </div>
    <div class="slider-wrap">
      <div class="strack"></div>
      <div class="notches">${notches}</div>
      <input id="chargeSlider" type="range" min="0" max="${divs}" step="1" value="${Math.round(v*divs)}"
             aria-label="Current charge">
    </div>
    <div class="ticks"><span>empty</span><span>low</span><span>okay</span><span>good</span></div>

    <div class="divider"><hr><span>optional</span><hr></div>
    <button class="btn" data-tstart="1" style="margin-bottom:10px">What kind of tired are you?</button>
    <button class="row" data-rough="1">
      <span class="box">${S.roughNight?"✓":""}</span>
      <span style="font-size:12.5px">Bad sleep</span>
    </button>
    <div style="height:18px"></div>
    <button class="btn strong" data-closesheet="1">Done</button>
    <div style="height:8px"></div>
    <button class="btn" data-golog="1" style="border-color:var(--line);color:var(--muted)">Something happened — log it</button>`,
    {checkin:true});
}

/* Logging an item is the same calibration loop as rating an event, entered from
   the other end: you name the thing and its size at once. It counts against the
   charge and joins the history, so a "hard phone call" logged often enough
   starts pricing itself like anything else. */
function applyLog(name, cost, type){
  S.prevCharge=S.charge;
  S.charge=Math.max(0, Math.min(capOn(TODAY)||1, S.charge-cost));
  S.lastLog=TODAY;
  S.offlog=(S.offlog||[]).concat({id:"L"+(S.nextLogId=(S.nextLogId||0)+1),
                                  name, cost, type:type||null, at:TODAY});
  S.actuals=(S.actuals||[]).concat({name, est:Math.abs(cost), act:Math.abs(cost)});
}

/* Logging is one tap, so un-logging has to be too — a mis-tap on a chip
   shouldn't need a trip to the slider to put right. Removing an entry reverses
   the charge it took and drops the history row it wrote, so the learned price
   of a name isn't quietly skewed by a mistake. */
function unlog(id){
  const x=(S.offlog||[]).find(e=>e.id===id); if(!x) return null;
  S.charge=Math.max(0, Math.min(capOn(TODAY)||1, S.charge + x.cost));
  S.offlog=S.offlog.filter(e=>e.id!==id);
  const a=S.actuals||[];
  for(let i=a.length-1;i>=0;i--) if(a[i].name===x.name){ a.splice(i,1); break }
  return x;
}

/* Editing reverses the old entry's effect and applies the new one in place, so
   the row keeps its position and the history keeps exactly one row for it. */
function relog(id, name, cost, type){
  const x=(S.offlog||[]).find(e=>e.id===id); if(!x) return;
  S.charge=Math.max(0, Math.min(capOn(TODAY)||1, S.charge + x.cost - cost));
  const a=S.actuals||[];
  for(let i=a.length-1;i>=0;i--) if(a[i].name===x.name){ a.splice(i,1); break }
  S.actuals=(S.actuals||[]).concat({name, est:Math.abs(cost), act:Math.abs(cost)});
  x.name=name; x.cost=cost; x.type=type||null;
}

/* A chip that writes something has to show that it did. It reads its state from
   the log itself rather than keeping its own, so the × in the list below and the
   chip can never disagree. */
function loggedToday(name){
  return (S.offlog||[]).filter(x=>x.at===TODAY && x.name===name).slice(-1)[0] || null;
}

function renderLog(){
  const today=(S.offlog||[]).filter(x=>x.at===TODAY);
  $("v-log").innerHTML=`
    <div class="scr-head"><h2>What happened?</h2></div>
    <p class="screen-sub">Whatever the calendar missed.</p>

    <div class="group">
      <p class="label">Took away energy</p>
      <div class="chips">
        ${quickList().map((q,i)=>[q,i]).filter(([q])=>q.cost>0).map(([q,i])=>
          `<button class="chip ${loggedToday(q.n)?"on":""}" data-off="${i}">${q.n}</button>`).join("")}
      </div>
    </div>
    <div class="group">
      <p class="label">Gave me energy</p>
      <div class="chips">
        ${quickList().map((q,i)=>[q,i]).filter(([q])=>q.cost<0).map(([q,i])=>
          `<button class="chip ${loggedToday(q.n)?"on":""}" data-off="${i}">${q.n}</button>`).join("")}
      </div>
    </div>
    <button class="btn" data-addlog="1">+ something else</button>

    <p class="label" style="margin-top:26px">Logged today</p>
    ${today.length
      ? today.map(x=>`<div class="landed">
          <button class="n" data-editlog="${x.id}">${x.name}</button>
          <span class="g">${x.type?typeIcon(x.type):""}</span>
          <button class="e" data-editlog="${x.id}">${x.cost<0?"+":"−"}${noNums()?"":fmt(Math.abs(x.cost))}</button>
          <button class="rm" data-unlog="${x.id}" aria-label="Remove ${x.name}">×</button>
        </div>`).join("")
      : `<p class="hint" style="padding:4px 0 0">Nothing logged today. That's okay.</p>`}

    <div style="height:24px"></div>
    <button class="btn strong" data-tab="forecast">Done</button>
    <div style="height:8px"></div>
    <button class="btn" data-reset="1" style="border-color:var(--line);color:var(--muted)">Reset demo data</button>`;
}

/* The same sheet writes a new entry and edits an existing one: what it cost you
   is a guess like any other, and the first number you reach for while it's still
   happening is rarely the one you'd pick an hour later. */
function sheetLogItem(editId){
  const ex = editId!=null ? (S.offlog||[]).find(e=>e.id===editId) : null;
  const d = (sheetCtx&&sheetCtx.newLog) ? sheetCtx : {
    newLog:true, editId: ex?ex.id:null,
    name: ex?ex.name:"",
    cost: ex?Math.abs(ex.cost):.15,
    type: ex?(ex.type||"social"):"social",
    rest: ex?ex.cost<0:false
  };
  openSheet(`
    <h3>${d.editId?"Edit event":"Log something"}</h3>
    <p class="sub">This helps make your forecast more accurate.</p>
    <input class="tinput" id="logName" type="text" placeholder="What was it?" value="${(d.name||"").replace(/"/g,"&quot;")}">

/* The SHEET must not re-render mid-drag or the thumb goes with it — but the app
   behind it should track the drag, not sit there stale until you let go. So the
   readout is patched in place, the charge is applied as you move, and the views
   are redrawn once per frame.
   The slider's range IS the scale — one step per notch — so the thumb lands on a
   mark rather than between two, and the range's own max normalises it. */
let dragFrom=null, dragRaf=0;
document.addEventListener("input",e=>{
  if(e.target.id!=="chargeSlider") return;
  const v=e.target.value/(Number(e.target.max)||100);
  if(dragFrom===null) dragFrom=S.charge;      /* where the drag started from */
  $("readout").innerHTML=`<span class="w">${stateWord(v)}</span>`+
    (noNums()?"":`<span class="v">${fmt(v)} / ${fmtMax()} ${unitName()}</span>`);
  S.charge=v;
  if(!dragRaf) dragRaf=requestAnimationFrame(()=>{ dragRaf=0; render() });
});
/* Touching a slider records the answer against the row and says it back in
   words; nothing is filed until Done. Both events are needed: `input` for a
   drag, `click` for a tap that leaves the thumb where it already was — which is
   how you agree with "about right" in one tap. */
function askTouch(el){
  if(!askTouched) return;
  const id=Number(el.dataset.ask), v=Number(el.value);
  askTouched[id]=ASK_MULT[v];
  const lab=$("ans-"+id);
  if(lab) lab.innerHTML=`<b>${ASK_WORD[v]}</b>`;
  el.closest(".askrow")?.classList.add("touched");
}
document.addEventListener("input",e=>{ const el=e.target.closest?.('input[data-ask]'); if(el) askTouch(el) });
document.addEventListener("click",e=>{ const el=e.target.closest('input[data-ask]'); if(el) askTouch(el) });
document.addEventListener("change",e=>{
  if(e.target.id!=="chargeSlider") return;
  const v=e.target.value/(Number(e.target.max)||100);
  /* the drag already moved S.charge, so "before" is where it started */
  S.prevCharge = dragFrom!==null ? dragFrom : S.charge;
  dragFrom=null;
  S.charge=v; S.lastLog=TODAY;
  if(v>.5) S.debt=0;
  render();
  toast(v<.25 ? "Logged. The forecast has dropped to today only — the week can wait."
              : "Logged. Forecast updated.");
});

---------------------------------------------------------------------------- */
let sheetCtx=null;
function openSheet(html,ctx,asModal){
  sheetCtx=ctx||null;
  const el=$("sheet"), open=el.classList.contains("on");
  /* Omitting asModal means "the same kind as the one already up". Tapping
     "Change what it costs" inside a window used to drop the panel to the bottom
     of the screen mid-flow, which reads as a bug rather than a transition. A
     fresh open, with nothing showing, is a drawer. */
  el.innerHTML=html;
  el.classList.toggle("modal", asModal!==undefined ? !!asModal : (open && el.classList.contains("modal")));
  el.classList.add("on"); $("scrim").classList.add("on");
}
function closeSheet(){ $("sheet").classList.remove("on"); $("scrim").classList.remove("on"); sheetCtx=null }

function sheetEvent(id){
  const e=S.events.find(x=>x.id===id); if(!e) return;
  const hint = hintFor(e);
  /* an unpriced event starts at its historical mean — learning applied where
     there's no explicit choice to override */
  const opening = e.cost==null
    ? (hint&&hint.kind==="suggest" ? hint.act : .2)
    : Math.abs(e.cost);
  const draft = sheetCtx&&sheetCtx.id===id ? sheetCtx : {id, cost:opening, rest:e.cost!=null&&e.cost<0, type:e.type||"social"};
  const s=SCALES[S.scale], shown = s.round?s.round(draft.cost):Math.round(draft.cost*10);
  openSheet(`
    <h3>${e.name}</h3>
    <p class="sub">${e.time?e.time+" · ":""}${niceDate(e.date)}</p>
    ${e.inv?`<div class="handoff">Invited, not answered. The forecast counts it at about
      <b>${Math.round(INVITE_DISCOUNT*100)}%</b> until you say yes or no.</div>`:""}
    <p class="label">${draft.rest?"How much does it give back?":"What does it cost you?"}</p>
    <div class="stepper">
      <button data-step="-1">−</button>
      <div class="val">${draft.rest?"+":""}${shown}<small> / ${fmtMax()||"10"}</small></div>

    </div>

      ${hintText(e,hint)}
      ${Math.abs(hint.act-draft.cost)>.02?`<button data-usehist="${hint.act.toFixed(3)}">Use ${fmt(hint.act)}</button>`:""}
    </div>`:""}
    <p class="label">Kind</p>
    <div class="seg">
      ${Object.keys(TYPES).map(t=>`<button data-type="${t}" class="seg-ico ${draft.type===t?"on":""}">${typeIcon(t)}${t}</button>`).join("")}

  `, draft);
}

/* The app never writes to the calendar. It prepares the change and hands it to
   the calendar app, where the user saves it — so guests get notified by their
   own calendar rather than silently by us, and the calendar stays the single
   source of truth. Until a read confirms it, the change is only pending. */
/* Your own list of restorative things. Seeded with three, but the point is
   that it's yours — the app should never be limited to what I guessed. */
/* Check all that apply, follow up only where a category splits, then the chart.
   The chart is the deliverable — it persists on the forecast afterwards so you
   don't have to remember it or run the flow twice. */
function tiredChart(picks,dirs){
  const groups=[], count={};
  picks.forEach(k=>{
    const cat=RECOVERY_TREE[k];
    const b=cat.branches.find(x=>x.dir===(dirs[k]||cat.branches[0].dir))||cat.branches[0];
    b.items.forEach(i=>{ count[i]=(count[i]||0)+1 });
    groups.push({key:k,label:cat.label,branch:b});
  });
  /* something that answers two kinds of tired at once is the highest-leverage
     thing on the list — say so rather than printing it twice */
  const shared=Object.keys(count).filter(i=>count[i]>1);
  return {groups,shared};
}
function chartHTML(picks,dirs,compact){
  const {groups,shared}=tiredChart(picks,dirs);
  return `
    ${shared.length?`<div class="chartgroup">
      <p class="chartq">Covers more than one</p>
      ${shared.map(i=>`<div class="recitem">${i}</div>`).join("")}
    </div>`:""}
    ${groups.map(g=>{
      const items=g.branch.items.filter(i=>shared.indexOf(i)<0);
      if(!items.length) return "";
      return `<div class="chartgroup">
        <p class="chartq">${g.label}${g.branch.dir==="any"?"":` · ${g.branch.label.toLowerCase()}`}</p>
        ${items.map(i=>`<div class="recitem">${i}</div>`).join("")}
      </div>`;
    }).join("")}`;
}

/* which of the chosen categories still need a too-much / too-little answer */
function pendingDirs(c){
  return c.picks.filter(k=>RECOVERY_TREE[k].branches.length>1 && !c.dirs[k]);
}

function sheetTired(reset){
  if(reset||!sheetCtx||!sheetCtx.tired) sheetCtx={tired:true,picks:[],dirs:{}};
  const c=sheetCtx;

  if(!c.done){
    const need=pendingDirs(c);
    if(c.asked && need.length){                      /* follow-ups, one at a time */
      const k=need[0], cat=RECOVERY_TREE[k];
      openSheet(`
        <h3>${cat.label}</h3>
        <p class="sub">Which was it?${need.length>1?`  (${need.length} to go)`:""}</p>
        <div class="tiredgrid">
          ${cat.branches.map(b=>`<button data-tdir="${k}|${b.dir}">${b.label}</button>`).join("")}
        </div>
        <div style="height:16px"></div>
        <button class="btn" data-tstart="1" style="border-color:var(--line);color:var(--muted)">Start over</button>`,c);
      return;
    }
    if(!c.asked){                                    /* check all that apply */
      openSheet(`
        <h3>What kind of tired are you?</h3>
        <p class="sub">Check everything that applies. However it feels — the numbers don't have to agree.</p>
        <div class="tiredgrid">
          ${Object.entries(RECOVERY_TREE).map(([k,cat])=>
            `<button data-tpick="${k}" class="${c.picks.indexOf(k)>=0?"on":""}">
               <span class="bx">${c.picks.indexOf(k)>=0?"✓":""}</span>${cat.short}</button>`).join("")}
        </div>

        <div style="height:8px"></div>
        <button class="btn" data-tguess="1" style="border-color:var(--line);color:var(--muted)">Not sure — go on my week</button>`,c);
      return;
    }
  }
  /* the chart, and it stays on the forecast afterwards */
  S.tiredResult={picks:c.picks,dirs:c.dirs,at:TODAY};
  openSheet(`
    <h3>What might help</h3>
    <p class="sub">From your own list. This stays on your forecast for today.</p>
    ${chartHTML(c.picks,c.dirs)}
    <div style="height:18px"></div>
    <button class="btn" data-tstart="1" style="border-color:var(--line);color:var(--muted)">Start over</button>
    <div style="height:8px"></div>
    <button class="btn strong" data-closesheet="1">Done</button>`,c);
  render();
}

  `);
}

/* Asked once, when the app is opened — not parked at the top of the screen.
   One thing only; anything else waits on the Log screen rather than queuing up
   as an interrogation. */
/* Recording how an event actually landed — state only. The multiplier is what
   the rating means relative to the estimate. */
function recordActual(id, mult){
  const e=S.events.find(x=>x.id===id); if(!e) return null;
  const base=Math.abs(costOf(e));
  const act=Math.round(Math.max(.05,Math.min(1,base*mult))*1000)/1000;
  S.actuals=(S.actuals||[]).concat({name:e.name,est:base,act});
  S.logged=(S.logged||[]).concat(e.id);
  return e;
}

/* What the five stops mean, and what to call them back to you. */

let toastT=null;
function toast(msg){
  $("toast").innerHTML=msg; $("toast").classList.add("on");
  clearTimeout(toastT); toastT=setTimeout(()=>$("toast").classList.remove("on"),2600);
}

/* ---------------------------------------------------------------------------
   EVENTS
---------------------------------------------------------------------------- */
document.addEventListener("click",ev=>{
  const t0=ev.target.closest("[data-hmenu],[data-horizon]");
  if(S.hmenu && !t0){ S.hmenu=false; render() }        /* click away closes it */
  const t=ev.target.closest("[data-tab],[data-tab2],[data-checkin],[data-golog],[data-addlog],[data-unlog],[data-editlog],[data-lstep],[data-ltype],[data-lrest],[data-savelog],[data-day],[data-goday],[data-mon],[data-ev],[data-look],[data-mv],[data-cantmove],[data-pmove],[data-pdrop],[data-settings],[data-set],[data-rough],[data-off],[data-reset],[data-step],[data-type],[data-rest],[data-savecost],[data-closesheet],[data-scale],[data-unit],[data-chrono],[data-book],[data-noplan],[data-dobook],[data-tstart],[data-tpick],[data-tnext],[data-tdir],[data-tguess],[data-tclear],[data-rectree],[data-branch],[data-editplanned],[data-rmplan],[data-pstep],[data-ptype],[data-pat],[data-saveplan],[data-usehist],[data-askdone],[data-deferall],[data-dosync],[data-newcond],[data-editcond],[data-ccolor],[data-cemoji],[data-cspan],[data-cdir],[data-ccap],[data-ccapstep],[data-cevery],[data-csave],[data-cdelete],[data-opencal],[data-hmenu],[data-horizon],[data-arcinfo],[data-addtask],[data-tstep],[data-ttype],[data-twhen],[data-savetask],[data-done],[data-undone],[data-breakdown],[data-sstep],[data-addsub],[data-donebreak]");
  if(!t){ return }
  const D=t.dataset;   /* every clickable in the app routes through here */

  if(D.tab){ S.tab=D.tab; render(); return }
  if(D.tab2){ S.tab=D.tab2; render(); return }
  if(D.mon){
    let [y,m]=S.month.split("-").map(Number); m+=Number(D.mon);
    if(m<1){m=12;y--} if(m>12){m=1;y++}
    S.month=`${y}-${String(m).padStart(2,"0")}`; render(); return;
  }
  /* tapping into the month either side moves the calendar there, rather than
     selecting a day the grid isn't showing */
  if(D.day){ S.selDate=D.day; S.month=D.day.slice(0,7); render(); return }
  if(D.goday){ S.selDate=D.goday; S.month=D.goday.slice(0,7);
    S.dayBack = (S.tab==="day"?S.dayBack:S.tab); S.tab="day"; render(); return }
  if(D.ev){ sheetEvent(Number(D.ev)); return }
  if(D.look){ sheetLook(Number(D.look)); return }
  if(D.mv){ sheetMove(Number(D.mv)); return }
  if(D.cantmove){ sheetCantMove(D.cantmove); return }
  if(D.pmove){ const [id,to]=D.pmove.split("|"); sheetHandoff(Number(id),"move",to); return }
  if(D.pdrop){ sheetHandoff(Number(D.pdrop),"drop",null); return }
  if(D.settings){ sheetSettings(); return }
  if(D.closesheet){ closeSheet(); return }

  if(D.scale){ S.scale=D.scale; render(); sheetSettings(); return }
  if(D.unit){ S.unit=D.unit; render(); sheetSettings(); return }
  if(D.chrono){ S.chrono=D.chrono; render(); sheetSettings(); return }

  if(D.checkin){ sheetCheckin(); return }
  if(D.golog){ closeSheet(); S.tab="log"; render(); return }
  if(D.rough){ const inCheckin=!!(sheetCtx&&sheetCtx.checkin);
    S.roughNight=!S.roughNight; render(); if(inCheckin) sheetCheckin();
    toast(S.roughNight?"Tonight's refill withheld.":"Refill restored."); return }
  if(D.off){
    const q=quickList()[Number(D.off)]; if(!q) return;
    /* a lit chip un-logs — one tap in, one tap out, same as the × below */
    const already=loggedToday(q.n);
    if(already){ unlog(already.id); render(); toast(`“${q.n}” removed.`); return }
    applyLog(q.n, q.cost, q.type);
    render();
    toast(q.cost<0 ? `“${q.n}” logged — charge restored.`
                   : `“${q.n}” logged — charge reduced.`); return;
  }
  /* ---- log an item ---- */
  if(D.unlog){
    const x=unlog(D.unlog);
    /* not "charge restored" — removing a give-back takes charge away, and the
       toast was saying the opposite of what just happened half the time */
    render(); if(x) toast(`“${x.name}” removed.`); return;
  }
  if(D.addlog){ sheetCtx=null; sheetLogItem(); return }
  if(D.editlog){ sheetCtx=null; sheetLogItem(D.editlog); return }
  /* every redraw rebuilds the input, so the half-typed name goes back into the
     draft before the sheet is re-rendered */
  const keepLogName=()=>{ if(sheetCtx) sheetCtx.name=($("logName")||{}).value||sheetCtx.name };
  if(D.lstep&&sheetCtx&&sheetCtx.newLog){
    const s=SCALES[S.scale], step=(s.step||1)/(s.max||10);
    keepLogName();
    sheetCtx.cost=Math.max(step,Math.min(1,sheetCtx.cost+Number(D.lstep)*step));
    sheetLogItem(sheetCtx.editId); return;
  }
  if(D.ltype&&sheetCtx&&sheetCtx.newLog){ keepLogName(); sheetCtx.type=D.ltype; sheetLogItem(sheetCtx.editId); return }
  if(D.lrest&&sheetCtx&&sheetCtx.newLog){ keepLogName(); sheetCtx.rest=!sheetCtx.rest; sheetLogItem(sheetCtx.editId); return }
  if(D.savelog&&sheetCtx&&sheetCtx.newLog){
    const name=(($("logName")||{}).value||"").trim();
    if(!name){ toast("It needs a name — even a rough one."); return }
    const v=Math.round(sheetCtx.cost*1000)/1000, cost=sheetCtx.rest?-v:v;
    const editId=sheetCtx.editId, type=sheetCtx.type;
    if(editId){ relog(editId, name, cost, type) } else { applyLog(name, cost, type) }
    closeSheet(); S.tab="log"; render();
    toast(editId?`“${name}” updated.`:`“${name}” logged.`); return;
  }
  if(D.reset){ S=fresh(); render(); toast("Back to the seeded week."); return }
  /* ---- conditions ---- */
  if(D.newcond){ sheetCtx=null; sheetCondition(null); return }
  if(D.editcond){ sheetCtx=null; sheetCondition(D.editcond); return }
  if(sheetCtx&&sheetCtx.cond&&(D.ccolor||D.cemoji!==undefined||D.cspan||D.ccap||D.ccapstep||D.cevery!==undefined||D.cdir!==undefined)){
    /* keep what's been typed before the sheet redraws */
    sheetCtx.name=($("condName")||{}).value ?? sheetCtx.name;
    sheetCtx.date=($("condDate")||{}).value || sheetCtx.date;
    if(D.ccolor) sheetCtx.color=D.ccolor;
    if(D.cemoji!==undefined) sheetCtx.emoji=D.cemoji||null;
    if(D.cspan)  sheetCtx.span=Math.max(2,Math.min(60,sheetCtx.span+Number(D.cspan)));
    if(D.ccap)   sheetCtx.cap=sheetCtx.cap?null:.6;
    if(D.ccapstep){
      const s=SCALES[S.scale], step=(s.step||1)/(s.max||10);
      sheetCtx.cap=Math.max(step,Math.min(1,(sheetCtx.cap||.6)+Number(D.ccapstep)*step));
    }
    if(D.cevery!==undefined) sheetCtx.every=Number(D.cevery);
    if(D.cdir!==undefined){
      sheetCtx.dir=D.cdir||null;
      if(sheetCtx.dir!=="down") sheetCtx.cap=null;   /* only a limit can cap */
    }
    sheetCondition(sheetCtx.exId); return;
  }
  if(D.csave&&sheetCtx&&sheetCtx.cond){
    const existing = sheetCtx.exId!=null ? S.events.find(e=>e.id===sheetCtx.exId) : null;
    if(existing && isCalSpan(existing)){          /* annotations only */
      existing.dir=sheetCtx.dir||null;
      existing.cap=sheetCtx.cap||null;
      closeSheet(); render(); toast(`${existing.name} updated.`); return;
    }
    const name=(($("condName")||{}).value||"").trim();
    if(!name){ toast("Give it a name first."); return }
    const date=($("condDate")||{}).value||sheetCtx.date;
    const patch={name, date, span:sheetCtx.span, cap:sheetCtx.cap||null,
                 every:sheetCtx.every||null, color:sheetCtx.color,
                 dir:sheetCtx.dir||null, emoji:sheetCtx.emoji||null,
                 time:null, cost:null, type:null, src:"spoon"};
    if(sheetCtx.exId!=null) Object.assign(S.events.find(e=>e.id===sheetCtx.exId), patch);
    else S.events=S.events.concat(Object.assign({id:S.nextId++}, patch));
    const was=sheetCtx.exId!=null;
    closeSheet(); render();
    toast(was?`${name} updated.`:`${name} added.`);
    return;
  }
  if(D.opencal){
    const e=S.events.find(x=>x.id===Number(D.opencal));
    closeSheet(); toast(`Opening your calendar to ${e.name}.`); return;
  }
  if(D.cdelete){
    const e=S.events.find(x=>x.id===Number(D.cdelete));
    S.events=S.events.filter(x=>x.id!==Number(D.cdelete));
    closeSheet(); render(); toast(`${e.name} removed.`); return;
  }
  if(D.hmenu){ S.hmenu=!S.hmenu; render(); return }
  if(D.horizon){
    S.horizon = Number(D.horizon);
    S.hmenu=false; render(); return;
  }
  if(D.arcinfo){ sheetArc(); return }
  if(D.breakdown){ sheetCtx=null; sheetBreakdown(Number(D.breakdown)); return }
  if(D.sstep&&sheetCtx&&sheetCtx.breakdown!=null){
    const s=SCALES[S.scale], step=(s.step||1)/(s.max||10);
    sheetCtx.cost=Math.max(step,Math.min(1,sheetCtx.cost+Number(D.sstep)*step));
    sheetCtx.pending=($("subName")||{}).value||"";
    sheetBreakdown(sheetCtx.breakdown); return;
  }
  if(D.addsub&&sheetCtx){
    const name=(($("subName")||{}).value||"").trim();
    if(!name){ toast("Give the piece a name."); return }
    const parent=S.events.find(e=>e.id===Number(D.addsub));
    S.events=S.events.concat({id:S.nextId++,date:null,time:null,name,
                              cost:Math.round(sheetCtx.cost*1000)/1000,type:parent.type,task:true,
                              added:TODAY,due:parent.due,parent:parent.id});
    sheetCtx.pending="";
    sheetBreakdown(parent.id); render(); toast("Added a piece.");
    return;
  }
  if(D.donebreak){
    S.nudged=(S.nudged||[]).concat(Number(D.donebreak));
    closeSheet(); render(); return;
  }
  if(D.addtask){ sheetCtx=null; sheetTask(); return }
  if(D.tstep&&sheetCtx&&sheetCtx.newTask){
    const s=SCALES[S.scale], step=(s.step||1)/(s.max||10);
    sheetCtx.name=($("taskName")||{}).value||sheetCtx.name;
    sheetCtx.due=($("taskDue")||{}).value||sheetCtx.due;
    sheetCtx.cost=Math.max(step,Math.min(1,sheetCtx.cost+Number(D.tstep)*step));
    sheetTask(); return;
  }
  if(D.ttype&&sheetCtx&&sheetCtx.newTask){
    sheetCtx.name=($("taskName")||{}).value||sheetCtx.name;
    sheetCtx.due=($("taskDue")||{}).value||sheetCtx.due;
    sheetCtx.type=D.ttype; sheetTask(); return;
  }
  if(D.twhen!==undefined&&sheetCtx&&sheetCtx.newTask){
    sheetCtx.name=($("taskName")||{}).value||sheetCtx.name;
    sheetCtx.due=($("taskDue")||{}).value||sheetCtx.due;
    sheetCtx.when=D.twhen||null; sheetTask(); return;
  }
  if(D.savetask&&sheetCtx&&sheetCtx.newTask){
    const name=(($("taskName")||{}).value||"").trim();
    if(!name){ toast("Give it a name first."); return }
    const when=sheetCtx.when||null;          /* closeSheet nulls sheetCtx */
    const due=(($("taskDue")||{}).value||"")||null;
    S.events=S.events.concat({id:S.nextId++,date:when,time:null,
                              name,cost:Math.round(sheetCtx.cost*1000)/1000,
                              type:sheetCtx.type,task:true,added:TODAY,due,parent:null});
    closeSheet(); render();
    toast(when?`Added to ${niceDate(when)}.`:"Added to the list.");
    return;
  }
  if(D.undone){
    const e=S.events.find(x=>x.id===Number(D.undone)); if(!e) return;
    e.done=false; e.doneAt=null;
    S.charge=Math.min(capOn(TODAY)||1, S.charge+e.cost);   /* give the spend back */
    render(); toast(`${e.name} is back on the list.`); return;
  }
  if(D.done){
    const e=S.events.find(x=>x.id===Number(D.done));
    e.done=true; e.doneAt=TODAY;
    const raw=S.charge-e.cost;
    S.prevCharge=S.charge;
    if(raw<0){ S.debt=(S.debt||0)+(-raw); S.charge=0 } else S.charge=raw;
    closeSheet(); render();
    toast(`${e.name} done.`);
    return;
  }
  if(D.tstart){ sheetTired(true); return }
  if(D.tpick&&sheetCtx&&sheetCtx.tired){
    const i=sheetCtx.picks.indexOf(D.tpick);
    if(i>=0) sheetCtx.picks.splice(i,1); else sheetCtx.picks.push(D.tpick);
    sheetTired(); return;
  }
  if(D.tnext&&sheetCtx&&sheetCtx.tired){
    if(!sheetCtx.picks.length){ toast("Pick at least one."); return }
    sheetCtx.asked=true;
    if(!pendingDirs(sheetCtx).length) sheetCtx.done=true;
    sheetTired(); return;
  }
  if(D.tdir&&sheetCtx&&sheetCtx.tired){
    const [k,dir]=D.tdir.split("|");
    sheetCtx.dirs[k]=dir;
    if(!pendingDirs(sheetCtx).length) sheetCtx.done=true;
    sheetTired(); return;
  }
  if(D.tguess){
    const g=inferBranch();
    sheetCtx={tired:true,picks:[g.key],dirs:{[g.key]:g.branch.dir},asked:true,done:true};
    sheetTired(); return;
  }
  if(D.tclear){ S.tiredResult=null; render(); return }
  if(D.rectree){ sheetRecovery(); return }
  if(D.branch){
    const [k,dir]=D.branch.split("|");
    const cat=RECOVERY_TREE[k], b=cat.branches.find(x=>x.dir===dir);
    openSheet(`
      <h3>${b.label}?</h3>
      <p class="sub">${cat.label}</p>
      ${b.items.map(i=>`<div class="recitem">${i}</div>`).join("")}
      <div style="height:18px"></div>
      <button class="btn" data-rectree="1" style="border-color:var(--line);color:var(--muted)">Something else</button>
      <div style="height:8px"></div>
      <button class="btn" data-closesheet="1">Close</button>`);
    return;
  }
  if(D.editplanned){ sheetCtx=null; sheetPlanned(); return }
  if(D.rmplan){
    S.planned=plannedList().filter(x=>x.id!==D.rmplan);
    render(); sheetPlanned(); return;
  }
  if(D.pstep&&sheetCtx&&sheetCtx.newPlan){
    const s=SCALES[S.scale], step=(s.step||1)/(s.max||10);
    sheetCtx.name=($("planName")||{}).value||sheetCtx.name;
    sheetCtx.cost=Math.max(step,Math.min(1,sheetCtx.cost+Number(D.pstep)*step));
    sheetPlanned(); return;
  }
  if(D.ptype&&sheetCtx&&sheetCtx.newPlan){
    sheetCtx.name=($("planName")||{}).value||sheetCtx.name;
    sheetCtx.type=D.ptype; sheetPlanned(); return;
  }
  if(D.pat&&sheetCtx&&sheetCtx.newPlan){
    sheetCtx.name=($("planName")||{}).value||sheetCtx.name;
    sheetCtx.at=D.pat; sheetPlanned(); return;
  }
  if(D.saveplan&&sheetCtx&&sheetCtx.newPlan){
    const name=(($("planName")||{}).value||"").trim();
    if(!name){ toast("Give it a name first."); return }
    S.planned=plannedList().concat({id:"p"+(S.nextPlanId++),n:name,t:sheetCtx.type,
                                    cost:-(Math.round(sheetCtx.cost*1000)/1000),at:sheetCtx.at});
    sheetCtx=null; render(); sheetPlanned(); toast(`${name} added.`);
    return;
  }
  if(D.book){ const [pid,d]=D.book.split("|"); sheetBook(pid,d); return }
  if(D.noplan){ S.plannedFor=(S.plannedFor||[]).concat(D.noplan); render();
    toast("Fine. It'll mention it again another week."); return }
  if(D.dobook){
    const [pid,d]=D.dobook.split("|");
    const spec=plannedById(pid);
    S.events=S.events.concat({id:S.nextId++,date:d,time:spec.at,name:spec.n,
                              cost:spec.cost,type:spec.t,pending:true});
    S.plannedFor=(S.plannedFor||[]).concat(d);
    closeSheet(); render();
    toast(`Opening your calendar… ${spec.n} shows as pending until it lands there.`);
    return;
  }
  if(D.deferall){
    /* deferring is the normal case, not a refusal — it comes back next open,
       and only goes quiet after a few passes */
    S.deferred=S.deferred||{};
    askQueue().forEach(e=>{ S.deferred[e.id]=(S.deferred[e.id]||0)+1 });
    closeSheet(); render();
    toast("Fine — it'll ask again next time you're in."); return;
  }
  if(D.askdone){
    const ids=Object.keys(askTouched||{});
    if(!ids.length){ closeSheet(); toast("Nothing rated — it'll ask again."); return }
    const names=ids.map(id=>recordActual(Number(id), askTouched[id])).filter(Boolean);
    askTouched=null; render();
    /* straight on to the next one, or out — one question on screen at a time */
    if(!sheetAsk()) closeSheet();
    const learned=names.filter(e=>isLearned(e.name));
    toast(learned.length ? `Logged — ${learned[0].name} is learned now, it'll price itself.`
                         : `Logged — ${names[0].name}.`);
    return;
  }

  /* cost sheet */
  if(D.step&&sheetCtx){
    const s=SCALES[S.scale], stepFrac=(s.step||1)/(s.max||10);
    sheetCtx.cost=Math.max(stepFrac,Math.min(1,sheetCtx.cost+Number(D.step)*stepFrac));
    sheetEvent(sheetCtx.id); return;
  }
  if(D.type&&sheetCtx){ sheetCtx.type=D.type; sheetEvent(sheetCtx.id); return }
  if(D.usehist&&sheetCtx){ sheetCtx.cost=Number(D.usehist); sheetEvent(sheetCtx.id); return }
  if(D.rest&&sheetCtx){ sheetCtx.rest=!sheetCtx.rest; sheetEvent(sheetCtx.id); return }
  if(D.savecost&&sheetCtx){
    const e=S.events.find(x=>x.id===sheetCtx.id);
    const v=Math.round(sheetCtx.cost*1000)/1000;
    e.cost=sheetCtx.rest?-v:v; e.type=sheetCtx.type;
    closeSheet(); render(); toast(`${e.name} priced. Everything downstream recalculated.`); return;
  }

  /* hand a move or a cancellation to the calendar app */
  if(D.dosync){
    const [id,kind,to]=D.dosync.split("|");
    const e=S.events.find(x=>x.id===Number(id));
    if(kind==="move"){ e.date=to; e.pending=true }
    else { S.events=S.events.filter(x=>x.id!==Number(id)) }
    closeSheet(); render();
    toast(kind==="move"
      ? `Opening your calendar… the move shows as pending until it lands there.`
      : `Opening your calendar to delete ${e.name}.`);
    return;
  }
});
$("scrim").addEventListener("click",closeSheet);

/* scale the frame to whatever room the window has, rather than a fixed size */
function fitPhone(){
  const W=390, H=812, pad=28;
  const s=Math.max(.55, Math.min(1.6,(window.innerHeight-pad)/H,(window.innerWidth-pad)/W));
  const ph=document.querySelector(".phone"), st=document.querySelector(".stage");
  ph.style.transform=`scale(${s.toFixed(3)})`;
  st.style.width=(W*s)+"px"; st.style.height=(H*s)+"px";
}
window.addEventListener("resize",fitPhone);
fitPhone();

$("clock").textContent = clockLabel(NOW_H).replace(/[ap]m$/,"");
render();
setTimeout(sheetAsk, 450);        /* on open, after the app has drawn */
</script>
</body>
</html>
