/* The SHEET must not re-render mid-drag or the thumb goes with it — but the app
   behind it should track the drag, not sit there stale until you let go. So the
   readout is patched in place, the charge is applied as you move, and the views
   are redrawn once per frame.
   The slider's range IS the scale — one step per notch — so the thumb lands on a
   mark rather than between two, and the range's own max normalises it. */
let dragFrom=null, dragRaf=0;
document.addEventListener("input",e=>{
  if(e.target.id!=="chargeSlider") return;
  const v=e.target.value/(Number(e.target.max)||100);
  if(dragFrom===null) dragFrom=S.charge;      /* where the drag started from */
  $("readout").innerHTML=`<span class="w">${stateWord(v)}</span>`+
    (noNums()?"":`<span class="v">${fmt(v)} / ${fmtMax()} ${unitName()}</span>`);
  S.charge=v;
  if(!dragRaf) dragRaf=requestAnimationFrame(()=>{ dragRaf=0; render() });
});
document.addEventListener("change",e=>{
  if(e.target.id!=="chargeSlider") return;
  const v=e.target.value/(Number(e.target.max)||100);
  /* the drag already moved S.charge, so "before" is where it started */
  S.prevCharge = dragFrom!==null ? dragFrom : S.charge;
  dragFrom=null;
  S.charge=v; S.lastLog=TODAY;
  if(v>.5) S.debt=0;
  render();
  toast(v<.25 ? "Logged. The forecast has dropped to today only — the week can wait."
              : "Logged. Forecast updated.");
});

/* ---------------------------------------------------------------------------
   SHEETS
---------------------------------------------------------------------------- */
let sheetCtx=null;
function openSheet(html,ctx,asModal){
  sheetCtx=ctx||null;
  const el=$("sheet"), open=el.classList.contains("on");
  /* Omitting asModal means "the same kind as the one already up". Tapping
     "Change what it costs" inside a window used to drop the panel to the bottom
     of the screen mid-flow, which reads as a bug rather than a transition. A
     fresh open, with nothing showing, is a drawer. */
  el.innerHTML=html;
  el.classList.toggle("modal", asModal!==undefined ? !!asModal : (open && el.classList.contains("modal")));
  el.classList.add("on"); $("scrim").classList.add("on");
}
function closeSheet(){ $("sheet").classList.remove("on"); $("scrim").classList.remove("on"); sheetCtx=null }

function sheetEvent(id){
  const e=S.events.find(x=>x.id===id); if(!e) return;
  const note = drainNote(e);
  const opening = e.cost==null ? .2 : Math.abs(e.cost);
  /* 0 is a stated price, so a neutral event must not read as "tap to price me" */
  const draft = sheetCtx&&sheetCtx.id===id ? sheetCtx : {id, cost:opening, rest:e.cost!=null&&e.cost<0, type:e.type||"social"};
  const s=SCALES[S.scale], shown = s.round?s.round(draft.cost):Math.round(draft.cost*10);
  openSheet(`
    <h3>${e.name}</h3>
    <p class="sub">${e.time?e.time+" · ":""}${niceDate(e.date)}</p>
    ${e.inv?`<div class="handoff">Invited, not answered. The forecast counts it at about
      <b>${Math.round(INVITE_DISCOUNT*100)}%</b> until you say yes or no.</div>`:""}
    <p class="label">${draft.rest?"How much does it give back?":"What does it cost you?"}</p>
    <div class="stepper">
      <button data-step="-1">−</button>
      <div class="val">${shown==="0"||shown===0
        ? `<span class="zero">\u2014</span>`
        : `${draft.rest?"+":""}${shown}<small> / ${fmtMax()||"10"}</small>`}</div>
      <button data-step="1">+</button>
    </div>
    ${(shown==="0"||shown===0)?`<p class="hint" style="margin:-8px 0 14px">Neither takes
      nor gives. It's on your calendar and it costs you nothing.</p>`:""}
    ${note?`<div class="hintbox">${drainText(e,note)}
      <button data-clearmarks="${e.id}">Clear the marks and start again</button>
    </div>`:""}
    <p class="label">Kind</p>
    <div class="seg">
      ${Object.keys(TYPES).map(t=>`<button data-type="${t}" class="seg-ico ${draft.type===t?"on":""}">${typeIcon(t)}${t}</button>`).join("")}
    </div>
    <button class="row" data-rest="1" style="margin-bottom:16px">
      <span class="box">${draft.rest?"✓":""}</span>
      <span style="font-size:12.5px">This restores me instead</span>
    </button>
    <button class="btn strong" data-savecost="1">Save</button>
    <div style="height:8px"></div>
    <button class="btn" data-closesheet="1" style="border-color:var(--line);color:var(--muted)">Cancel</button>
  `, draft);
}

/* The app never writes to the calendar. It prepares the change and hands it to
   the calendar app, where the user saves it — so guests get notified by their
   own calendar rather than silently by us, and the calendar stays the single
   source of truth. Until a read confirms it, the change is only pending. */
/* Your own list of restorative things. Seeded with three, but the point is
   that it's yours — the app should never be limited to what I guessed. */
/* Check all that apply, follow up only where a category splits, then the chart.
   The chart is the deliverable — it persists on the forecast afterwards so you
   don't have to remember it or run the flow twice. */
function tiredChart(picks,dirs){
  const groups=[], count={};
  picks.forEach(k=>{
    const cat=RECOVERY_TREE[k];
    const b=cat.branches.find(x=>x.dir===(dirs[k]||cat.branches[0].dir))||cat.branches[0];
    b.items.forEach(i=>{ const n=itemName(i); count[n]=(count[n]||0)+1 });
    groups.push({key:k,label:cat.label,branch:b});
  });
  /* something that answers two kinds of tired at once is the highest-leverage
     thing on the list — say so rather than printing it twice */
  const shared=Object.keys(count).filter(i=>count[i]>1);
  return {groups,shared};
}
function chartHTML(picks,dirs,compact){
  const {groups,shared}=tiredChart(picks,dirs);
  return `
    ${shared.length?`<div class="chartgroup">
      <p class="chartq">Covers more than one</p>
      ${shared.map(i=>`<div class="recitem">${i}</div>`).join("")}
    </div>`:""}
    ${groups.map(g=>{
      const items=g.branch.items.filter(i=>shared.indexOf(itemName(i))<0);
      if(!items.length) return "";
      return `<div class="chartgroup">
        <p class="chartq">${g.label}${g.branch.dir==="any"?"":` · ${g.branch.label.toLowerCase()}`}</p>
        ${items.map(i=>`<div class="recitem">${itemName(i)}</div>`).join("")}
      </div>`;
    }).join("")}`;
}

/* ---------------------------------------------------------------------------
   I'M OVERWHELMED
   Being LED through small questions is less work than choosing from a list —
   the questions do the executive function you haven't got. So this is longer
   than a two-tap lookup would be, and easier: four forced choices with big
   targets, no typing, no multi-select, ending on ONE thing.

   Each question is a filter rather than a preference. Kind and direction pick
   the branch — that part is Ferri's own flowchart. Capacity and time decide
   which of its items you can actually do at 9pm on the floor.
--------------------------------------------------------------------------- */
const CAPACITY = [
  {k:"down", n:"I can't really get up",     s:"lying down, phone in hand"},
  {k:"in",   n:"I can move around at home", s:"upright, but not going anywhere"},
  {k:"out",  n:"I could leave the house",   s:"if it were worth it"}
];
const DURATION = [
  {k:"mins",    n:"A few minutes"},
  {k:"hour",    n:"An hour or so"},
  {k:"evening", n:"The rest of the day"},
  {k:"day",     n:"A whole day"}
];

/* Which of the chosen kinds still needs a too-much / too-little answer. */
function pendingDirs(c){
  return (c.picks||[]).filter(k=>RECOVERY_TREE[k].branches.length>1 && !c.dirs[k]);
}
function dirTotal(c){
  return (c.picks||[]).filter(k=>RECOVERY_TREE[k].branches.length>1).length;
}
function branchOf(c,k){
  const cat=RECOVERY_TREE[k];
  return cat.branches.find(x=>x.dir===(c.dirs[k]||cat.branches[0].dir))||cat.branches[0];
}

/* Everything across the chosen branches you could actually do right now, best
   first. Multi-select earns its keep here: a thing that appears under two kinds
   of tired answers both at once, and that's the highest-leverage item on the
   list — it outranks everything, before any learned preference. */
function helpPicks(c){
  const cap=NEEDS_RANK[c.cap], tim=TAKES_RANK[c.time];
  const fits=i=>NEEDS_RANK[i.needs]<=cap && TAKES_RANK[i.takes]<=tim;
  const count={}, order={}, all=[];
  (c.picks||[]).forEach(k=>branchOf(c,k).items.forEach((i,idx)=>{
    const n=itemName(i);
    if(!(n in order)){ order[n]=idx; all.push(i) }
    count[n]=(count[n]||0)+1;
  }));
  const score=i=>{ const n=itemName(i);
    return count[n]*100 + ((S.helped||{})[n]||0)*2 - ((S.passed||{})[n]||0) };
  const rank=list=>list.slice().sort((x,y)=>
      score(y)-score(x) || order[itemName(x)]-order[itemName(y)]);
  const ok=rank(all.filter(fits));
  /* Never dead-end. If the filters leave nothing, offer the nearest thing in the
     branch and say so — an empty result is the one answer this screen must never
     give. */
  return ok.length ? {list:ok, stretch:false, count}
                   : {list:rank(all).slice(0,2), stretch:true, count};
}

/* One item that fits is an answer; "something else" that returns the same item
   is a broken button. When the filters leave exactly one thing, the second
   option stops pretending there's a choice and offers to relax a constraint —
   more time first, then more capacity, because asking for more of your body is
   the bigger ask. */
function canWiden(c){ return TAKES_RANK[c.time]<3 || NEEDS_RANK[c.cap]<2 }
function widen(c){
  if(TAKES_RANK[c.time]<3) c.time=DURATION[TAKES_RANK[c.time]+1].k;
  else if(NEEDS_RANK[c.cap]<2) c.cap=CAPACITY[NEEDS_RANK[c.cap]+1].k;
  c.skip=0;
}

/* The payoff of checking more than one box: say which of them this answers. */
function coversLine(n,of){
  if(n>=of) return of===2 ? "Answers both at once." : `Answers all ${of} at once.`;
  return `Answers ${n} of the ${of} at once.`;
}

function sheetHelp(reset){
  if(reset||!sheetCtx||!sheetCtx.help) sheetCtx={help:true, stage:"pick", picks:[], dirs:{}};
  const c=sheetCtx;
  const dt=dirTotal(c), total=1+dt+2;
  const at={pick:1, dir:1+(dt-pendingDirs(c).length)+1, cap:1+dt+1, time:1+dt+2}[c.stage];
  const back = c.stage!=="pick"
    ? `<div style="height:14px"></div><button class="btn" data-hback="1" style="border-color:var(--line);color:var(--muted)">Back</button>`
    : "";
  const step=(title,sub,body,foot)=>openSheet(`
    <div class="askhead"><h3>${title}</h3><span class="askpos">${at} <i>/</i> ${total}</span></div>
    ${sub?`<p class="sub">${sub}</p>`:""}
    <div class="tiredgrid">${body}</div>${foot||""}${back}`, c, true);

  /* 1 — which kinds. Check all that apply: more than one thing is usually true
     at once, and the overlap between them is the most useful thing here. */
  if(c.stage==="pick"){
    const g=inferBranch();
    return step("What kind of tired are you?",
      "Check everything that applies. However it feels — the numbers don't have to agree.",
      Object.entries(RECOVERY_TREE).map(([k,cat])=>
        `<button data-hpick="${k}" class="${c.picks.indexOf(k)>=0?"on":""}">
           <span class="bx">${c.picks.indexOf(k)>=0?"✓":""}</span>${cat.short}${
           k===g.key&&c.picks.indexOf(k)<0?`<i class="likely">likely</i>`:""}</button>`).join("")
      + `<button class="dim" data-hguess="1">I don't know — go on my week</button>`,
      `<div style="height:14px"></div>
       <button class="btn strong" data-hgo="1" ${c.picks.length?"":'style="opacity:.45"'}>
         ${c.picks.length?"Next":"Pick at least one"}</button>`);
  }
  /* 2 — too much of it, or too little. One kind at a time. */
  if(c.stage==="dir"){
    const need=pendingDirs(c);
    if(!need.length){ c.stage="cap"; return sheetHelp() }
    const k=need[0], cat=RECOVERY_TREE[k];
    return step(cat.label, `Which way?${need.length>1?`  (${need.length} to go)`:""}`,
      cat.branches.map(b=>`<button data-hdir="${k}|${b.dir}">${b.label}</button>`).join(""));
  }
  /* 3 — what you can physically manage. This is the question the old tree never
     asked, and the reason it kept offering a massage to someone who couldn't
     stand up. */
  if(c.stage==="cap") return step("What can you manage?", "Be honest. None of this is graded.",
    CAPACITY.map(x=>`<button data-hcap="${x.k}">${x.n}<i class="sub2">${x.s}</i></button>`).join(""));
  /* 4 — how much time there is */
  if(c.stage==="time") return step("How long have you got?", "",
    DURATION.map(x=>`<button data-htime="${x.k}">${x.n}</button>`).join(""));

  /* the answer — one thing, because a list is another decision */
  const {list,stretch,count}=helpPicks(c);
  const pick=list.length?list[(c.skip||0)%list.length]:null;
  if(!pick){ closeSheet(); toast("Nothing on your list for that. Add something on a better day."); return }
  const name=itemName(pick), covers=count[name]>1;
  S.tiredResult={name, at:TODAY, covers};
  openSheet(`
    <h3 style="margin-bottom:3px">Do this</h3>
    <p class="sub">${stretch
      ? "Nothing on your list fits that exactly. This is the nearest thing."
      : covers ? coversLine(count[name], c.picks.length)
               : "From your own list, for the state you're actually in."}</p>
    <p class="helpbig">${name}</p>
    <button class="btn strong" data-hdone="${encodeURIComponent(name)}">Okay</button>
    <div style="height:8px"></div>
    ${list.length>1
      ? `<button class="btn" data-hskip="${encodeURIComponent(name)}" style="border-color:var(--line);color:var(--muted)">Something else</button>`
      : (canWiden(c)
        ? `<button class="btn" data-hwiden="1" style="border-color:var(--line);color:var(--muted)">Nothing else fits — widen it</button>`
        : `<p class="hint" style="text-align:center;margin:2px 0 8px">That's everything on your list for this.</p>`)}
    <div style="height:8px"></div>
    <button class="btn" data-tstart="1" style="border-color:var(--line);color:var(--muted)">Start over</button>`, c, true);
  render();
}

/* Create and edit conditions. A condition is just a multi-day event with no
   cost — optionally a ceiling, optionally repeating. */
function conditions(){ return S.events.filter(isCondition) }

function sheetCondition(id){

  const d = (sheetCtx&&sheetCtx.cond&&sheetCtx.exId===(ex?ex.id:null)) ? sheetCtx : {
    cond:true, exId: ex?ex.id:null,
    name: ex?ex.name:"", color: ex?calColor(ex):"#BC7BD6",
    date: ex?ex.date:TODAY, span: ex?(ex.span||1):3,
    cap: ex?ex.cap:null, every: ex?(ex.every||0):0,
    dir: ex?(ex.dir||null):null, emoji: ex?(ex.emoji||null):null
  };
  const EVERY=[[0,"doesn't"],[7,"weekly"],[28,"every 28 days"]];
  const fromCal = !!(ex && isCalSpan(ex));
  openSheet(`
    <h3>${fromCal?ex.name:(ex?"Edit condition":"Add a condition")}</h3>
    <p class="sub">${fromCal
      ? `From your calendar · ${niceDate(ex.date)} · ${ex.span} days`

         no cost of its own.`}</p>

    ${fromCal ? `<div class="handoff">
        Spoon can't change your calendar, so the name, dates and colour are
        read-only here. What you can set is what it does to <b>you</b>.
      </div>
      <button class="btn" data-opencal="${ex.id}" style="margin-bottom:20px">Open in Google Calendar</button>`
    : `
    <input class="tinput" id="condName" type="text" placeholder="What is it?"
           value="${(d.name||"").replace(/"/g,"&quot;")}">

    <p class="label">Marker</p>
    <div class="emojis">
      ${EMOJI.map(x=>`<button data-cemoji="${x}" class="${d.emoji===x?"on":""}">${x}</button>`).join("")}
      <button data-cemoji="" class="none ${d.emoji?"":"on"}">none</button>
    </div>

    <p class="label">Colour</p>
    <div class="swatches">
      ${PALETTE.map(c=>`<button data-ccolor="${c}" class="${d.color===c?"on":""}"
        style="background:${c}"></button>`).join("")}
    </div>

    <p class="label">Starts</p>
    <input class="tinput" id="condDate" type="date" value="${d.date}">

    <p class="label">How many days</p>
    <div class="stepper">
      <button data-cspan="-1">−</button>

      <button data-cspan="1">+</button>

    <p class="label">Which way does it push you?</p>
    <div class="seg">
      <button data-cdir="up" class="seg-ico ${d.dir==="up"?"on":""}">${trendGlyph("up")}helps</button>

    </div>

      <button class="row" data-ccap="1" style="margin-bottom:${d.cap?"4px":"18px"}">

        <span style="font-size:12.5px">Caps how high you can get</span>

      ${d.cap?`<div class="stepper" style="margin-top:0">

/* You've already picked the thing; this only answers where it goes. That's the
   division three earlier versions kept getting wrong — they opened with a
   recommendation, which is the app choosing for you, or with the whole week,
   which is a lot of reading to do before you've even said what you'd give up. */
function sheetMove(id){
  const e=S.events.find(x=>x.id===id); if(!e||!e.date) return;
  const {moves,off,drop,day}=movesFor(id);
  const c=costOf(e);
  const fig=v=>noNums()?zoneOf(v).k:`<b>${fmt(v)}</b>`;
  /* Once a day has happened there is nothing to move, and one thing worth
     saying about it. Before it happens it's the other way round. */
  const past = daysBetween(TODAY, e.date) <= 0;
  const marked = markedOn(e.name, e.date);
  openSheet(`
    <h3>${e.name}</h3>
    <p class="sub">${e.time?e.time+" \u00b7 ":""}${niceDate(e.date)}${
      c==null?" \u00b7 not priced":` \u00b7 ${c<0?"gives back ":"costs "}${costArrows(c)}`}</p>
    ${past&&c!==0?`<button class="opt mark ${marked?"on":""}" data-mark="${e.id}">
      <span class="n">${marked?"Marked as draining":"That took it out of me"}</span>
      <span class="d">${marked?"\u2713":""}</span></button>
      <div style="height:6px"></div>`:""}
    ${!past&&moves.length ? `<p class="label">Move it to</p>
      ${moves.map(m=>`<button class="opt" data-pmove="${id}|${m.date}">
        <span class="n">${dowL(m.date)} ${dayNum(m.date)}</span>
        <span class="d">that day ends on ${fig(m.there)}</span></button>`).join("")}
      <p class="hint" style="margin:9px 0 0">Any of them leaves ${dowL(e.date)} on ${
        noNums()?zoneOf(off).k:fmt(off)} instead of ${noNums()?zoneOf(day.end).k:fmt(day.end)}.</p>`
      : (past?"":`<p class="hint" style="padding:6px 0 2px">Nothing later in the week absorbs this without costing you more than it saves.</p>`)}
    ${past?"":`<p class="label" style="margin-top:18px">Or</p>
    <button class="opt" data-pdrop="${id}">
      <span class="n">Cancel it altogether</span>
      <span class="d">${dowL(e.date)} ends on ${fig(drop)}</span></button>`}
    <button class="opt" data-ev="${id}">
      <span class="n">Change what it costs</span><span class="d arrow2">\u203a</span></button>
    <div style="height:16px"></div>
    <button class="btn" data-closesheet="1" style="border-color:var(--line);color:var(--muted)">Leave it as it is</button>
  `, null, true);
}

/* The honest branch, and a different job from the one above — which is why it
   isn't folded into it. Most of the time you CAN'T move the thing: it's work,
   or it's someone else's day. An app that only knows how to say "move it" has
   nothing to offer exactly when you need it most. The day won't get lighter, so
   the answer is the two days touching it. */
function sheetCantMove(date){
  const list=plannedList();
  const row=d=> daysBetween(TODAY,d)<0 ? "" : `
    <p class="label">${dowL(d)} ${dayNum(d)}</p>
    <div class="seg" style="margin-bottom:16px">
      ${list.map(x=>`<button data-book="${x.id}|${d}">${x.n}</button>`).join("")}
      <button data-editplanned="1" class="addchip">+ add</button>
    </div>`;
  openSheet(`
    <h3>Then protect the days either side.</h3>
    <p class="sub">${dowL(date)} won't get lighter. The run-up and the recovery still can.</p>
    <div class="handoff">Keep both as clear as you can, and put something restorative
      in each. It goes in as restorative, so the forecast counts it in your favour.</div>
    ${row(addDays(date,-1))}
    ${row(addDays(date,1))}
    <button class="btn" data-closesheet="1" style="border-color:var(--line);color:var(--muted)">Close</button>`);
}

function sheetHandoff(id,kind,to){

  const verb = kind==="move" ? `Move <b>${e.name}</b> to ${niceDate(to)}` : `Delete <b>${e.name}</b>`;
  openSheet(`
    <h3>${kind==="move"?"Move it in your calendar?":"Delete it in your calendar?"}</h3>
    <p class="sub">Spoon doesn't change your calendar itself.</p>
    <div class="handoff">
      ${verb}.<br><br>
      This opens Google Calendar with the change ready — you save it there.

    <div style="height:8px"></div>
    <button class="btn" data-closesheet="1" style="border-color:var(--line);color:var(--muted)">Not now</button>
  `);
}

function renderTasks(){
  const fit=fitting(), rest=openTasks().filter(e=>!fit.includes(e))
                                       .sort((a,b)=>a.cost-b.cost);
  const dn=doneTasks(), stale=staleTask(), any=openTasks().length;
  $("v-tasks").innerHTML=`
    <div class="scr-head"><h2>Tasks</h2></div>
    <p class="screen-sub">No dates, no order to fall behind on.</p>

    ${any ? `
      <div class="group">
        <p class="label">What fits right now</p>
        ${fit.length?fit.map(e=>taskRow(e)).join("")
                    :`<p class="hint" style="padding:6px 0">Nothing on the list fits today. That's the list's problem, not yours.</p>`}
        ${stale&&!fit.some(x=>x.id===stale.id)?`<p class="nudge">
          <b>${stale.name}</b> has been sitting a while.
          <button data-breakdown="${stale.id}">break it into smaller chunks?</button></p>`:""}
      </div>
      ${rest.length?`<div class="group">
        <p class="label">More than you've got right now</p>
        ${rest.map(e=>`<div class="task no">
          <span class="tick"></span><span class="n">${e.name}</span>
          <span class="g">${typeIcon(e.type)}</span>
          <span class="c">${costArrows(e.cost)}</span></div>`).join("")}
      </div>`:""}`
    : `<p class="lead">Nothing on your list yet.</p>`}

    <button class="btn strong" data-addtask="1">+ add something</button>

    ${dn.length?`<div class="group" style="margin-top:26px">
      <p class="label">Done recently</p>
      ${dn.map(e=>`<div class="task isdone">
        <span class="tick on">✓</span>
        <span class="n">${e.name}</span>
        <button class="undo" data-undone="${e.id}">undo</button>
      </div>`).join("")}

    </div>`:""}
    <div style="height:20px"></div>`;
}

      <span class="n">${k.name}</span>
      <span class="c">${costArrows(k.cost)}</span></div>`).join("")
      :`<p class="hint" style="margin-bottom:14px">What's the first small piece of it?</p>`}
    <input class="tinput" id="subName" type="text" placeholder="A smaller piece of it"
           value="${(draft.pending||"").replace(/"/g,"&quot;")}" style="margin-top:14px">
    <div class="stepper">
      <button data-sstep="-1">−</button>

    ${cur.length?`<p class="hint" style="text-align:center;margin:12px 0 0">

}

let toastT=null;
function toast(msg){
  $("toast").innerHTML=msg; $("toast").classList.add("on");

document.addEventListener("click",ev=>{
  const t0=ev.target.closest("[data-hmenu],[data-horizon]");
  if(S.hmenu && !t0){ S.hmenu=false; render() }        /* click away closes it */
  const t=ev.target.closest("[data-tab],[data-tab2],[data-checkin],[data-golog],[data-addlog],[data-unlog],[data-editlog],[data-lstep],[data-ltype],[data-lrest],[data-savelog],[data-day],[data-goday],[data-mon],[data-ev],[data-look],[data-mark],[data-markday],[data-clearmarks],[data-mv],[data-cantmove],[data-pmove],[data-pdrop],[data-settings],[data-set],[data-rough],[data-off],[data-reset],[data-step],[data-type],[data-rest],[data-savecost],[data-closesheet],[data-scale],[data-unit],[data-chrono],[data-book],[data-noplan],[data-dobook],[data-tstart],[data-hpick],[data-hgo],[data-hguess],[data-hdir],[data-hcap],[data-htime],[data-hback],[data-hskip],[data-hwiden],[data-hdone],[data-tclear],[data-rectree],[data-branch],[data-editplanned],[data-rmplan],[data-pstep],[data-ptype],[data-pat],[data-saveplan],[data-dosync],[data-newcond],[data-editcond],[data-ccolor],[data-cemoji],[data-cspan],[data-cdir],[data-ccap],[data-ccapstep],[data-cevery],[data-csave],[data-cdelete],[data-opencal],[data-hmenu],[data-horizon],[data-arcinfo],[data-addtask],[data-tstep],[data-ttype],[data-twhen],[data-savetask],[data-done],[data-undone],[data-breakdown],[data-sstep],[data-addsub],[data-donebreak]");
  if(!t){ return }
  const D=t.dataset;   /* every clickable in the app routes through here */

  if(D.tab){ S.tab=D.tab; render(); return }
  if(D.tab2){ S.tab=D.tab2; render(); return }
  if(D.mon){
    let [y,m]=S.month.split("-").map(Number); m+=Number(D.mon);
    if(m<1){m=12;y--} if(m>12){m=1;y++}
    S.month=`${y}-${String(m).padStart(2,"0")}`; render(); return;
  }
  /* tapping into the month either side moves the calendar there, rather than
     selecting a day the grid isn't showing */
  if(D.day){ S.selDate=D.day; S.month=D.day.slice(0,7); render(); return }
  if(D.goday){ S.selDate=D.goday; S.month=D.goday.slice(0,7);
    S.dayBack = (S.tab==="day"?S.dayBack:S.tab); S.tab="day"; render(); return }
  if(D.ev){ sheetEvent(Number(D.ev)); return }
  if(D.look){ sheetLook(Number(D.look)); return }
  if(D.mark){ const e=S.events.find(x=>x.id===Number(D.mark));
    toggleMark(e.name, e.date); render(); sheetMove(e.id);
    toast(markedOn(e.name,e.date)
      ? `Noted. ${e.name} is priced up from here.`
      : `Unmarked. ${e.name} goes back to what you set.`); return }
  if(D.markday){ const [name,date]=D.markday.split("|"); toggleMark(name,date); render(); return }
  if(D.clearmarks){ const e=S.events.find(x=>x.id===Number(D.clearmarks));
    clearMarks(e.name); render(); sheetEvent(e.id);
    toast(`Cleared. ${e.name} costs what you set it to.`); return }
  if(D.mv){ sheetMove(Number(D.mv)); return }
  if(D.cantmove){ sheetCantMove(D.cantmove); return }
  if(D.pmove){ const [id,to]=D.pmove.split("|"); sheetHandoff(Number(id),"move",to); return }
  if(D.pdrop){ sheetHandoff(Number(D.pdrop),"drop",null); return }
  if(D.settings){ sheetSettings(); return }
  if(D.closesheet){ closeSheet(); return }

  if(D.scale){ S.scale=D.scale; render(); sheetSettings(); return }
  if(D.unit){ S.unit=D.unit; render(); sheetSettings(); return }
  if(D.chrono){ S.chrono=D.chrono; render(); sheetSettings(); return }

  if(D.checkin){ sheetCheckin(); return }
  if(D.golog){ closeSheet(); S.tab="log"; render(); return }
  if(D.rough){ const inCheckin=!!(sheetCtx&&sheetCtx.checkin);
    S.roughNight=!S.roughNight; render(); if(inCheckin) sheetCheckin();
    toast(S.roughNight?"Tonight's refill withheld.":"Refill restored."); return }
  if(D.off){
    const q=quickList()[Number(D.off)]; if(!q) return;
    /* a lit chip un-logs — one tap in, one tap out, same as the × below */
    const already=loggedToday(q.n);
    if(already){ unlog(already.id); render(); toast(`“${q.n}” removed.`); return }
    applyLog(q.n, q.cost, q.type);
    render();
    toast(q.cost<0 ? `“${q.n}” logged — charge restored.`
                   : `“${q.n}” logged — charge reduced.`); return;
  }
  /* ---- log an item ---- */
  if(D.unlog){
    const x=unlog(D.unlog);
    /* not "charge restored" — removing a give-back takes charge away, and the
       toast was saying the opposite of what just happened half the time */
    render(); if(x) toast(`“${x.name}” removed.`); return;
  }
  if(D.addlog){ sheetCtx=null; sheetLogItem(); return }
  if(D.editlog){ sheetCtx=null; sheetLogItem(D.editlog); return }
  /* every redraw rebuilds the input, so the half-typed name goes back into the
     draft before the sheet is re-rendered */
  const keepLogName=()=>{ if(sheetCtx) sheetCtx.name=($("logName")||{}).value||sheetCtx.name };
  if(D.lstep&&sheetCtx&&sheetCtx.newLog){
    const s=SCALES[S.scale], step=(s.step||1)/(s.max||10);
    keepLogName();
    sheetCtx.cost=Math.max(step,Math.min(1,sheetCtx.cost+Number(D.lstep)*step));
    sheetLogItem(sheetCtx.editId); return;
  }
  if(D.ltype&&sheetCtx&&sheetCtx.newLog){ keepLogName(); sheetCtx.type=D.ltype; sheetLogItem(sheetCtx.editId); return }
  if(D.lrest&&sheetCtx&&sheetCtx.newLog){ keepLogName(); sheetCtx.rest=!sheetCtx.rest; sheetLogItem(sheetCtx.editId); return }
  if(D.savelog&&sheetCtx&&sheetCtx.newLog){
    const name=(($("logName")||{}).value||"").trim();
    if(!name){ toast("It needs a name — even a rough one."); return }
    const v=Math.round(sheetCtx.cost*1000)/1000, cost=sheetCtx.rest?-v:v;
    const editId=sheetCtx.editId, type=sheetCtx.type;
    if(editId){ relog(editId, name, cost, type) } else { applyLog(name, cost, type) }
    closeSheet(); S.tab="log"; render();
    toast(editId?`“${name}” updated.`:`“${name}” logged.`); return;
  }
  if(D.reset){ S=fresh(); render(); toast("Back to the seeded week."); return }
  /* ---- conditions ---- */
  if(D.newcond){ sheetCtx=null; sheetCondition(null); return }
  if(D.editcond){ sheetCtx=null; sheetCondition(D.editcond); return }
  if(sheetCtx&&sheetCtx.cond&&(D.ccolor||D.cemoji!==undefined||D.cspan||D.ccap||D.ccapstep||D.cevery!==undefined||D.cdir!==undefined)){
    /* keep what's been typed before the sheet redraws */
    sheetCtx.name=($("condName")||{}).value ?? sheetCtx.name;
    sheetCtx.date=($("condDate")||{}).value || sheetCtx.date;
    if(D.ccolor) sheetCtx.color=D.ccolor;
    if(D.cemoji!==undefined) sheetCtx.emoji=D.cemoji||null;
    if(D.cspan)  sheetCtx.span=Math.max(2,Math.min(60,sheetCtx.span+Number(D.cspan)));
    if(D.ccap)   sheetCtx.cap=sheetCtx.cap?null:.6;
    if(D.ccapstep){
      const s=SCALES[S.scale], step=(s.step||1)/(s.max||10);
      sheetCtx.cap=Math.max(step,Math.min(1,(sheetCtx.cap||.6)+Number(D.ccapstep)*step));
    }
    if(D.cevery!==undefined) sheetCtx.every=Number(D.cevery);
    if(D.cdir!==undefined){
      sheetCtx.dir=D.cdir||null;
      if(sheetCtx.dir!=="down") sheetCtx.cap=null;   /* only a limit can cap */
    }
    sheetCondition(sheetCtx.exId); return;
  }
  if(D.csave&&sheetCtx&&sheetCtx.cond){
    const existing = sheetCtx.exId!=null ? S.events.find(e=>e.id===sheetCtx.exId) : null;
    if(existing && isCalSpan(existing)){          /* annotations only */
      existing.dir=sheetCtx.dir||null;
      existing.cap=sheetCtx.cap||null;
      closeSheet(); render(); toast(`${existing.name} updated.`); return;
    }
    const name=(($("condName")||{}).value||"").trim();
    if(!name){ toast("Give it a name first."); return }
    const date=($("condDate")||{}).value||sheetCtx.date;
    const patch={name, date, span:sheetCtx.span, cap:sheetCtx.cap||null,
                 every:sheetCtx.every||null, color:sheetCtx.color,
                 dir:sheetCtx.dir||null, emoji:sheetCtx.emoji||null,
                 time:null, cost:null, type:null, src:"spoon"};
    if(sheetCtx.exId!=null) Object.assign(S.events.find(e=>e.id===sheetCtx.exId), patch);
    else S.events=S.events.concat(Object.assign({id:S.nextId++}, patch));
    const was=sheetCtx.exId!=null;
    closeSheet(); render();
    toast(was?`${name} updated.`:`${name} added.`);
    return;
  }
  if(D.opencal){
    const e=S.events.find(x=>x.id===Number(D.opencal));
    closeSheet(); toast(`Opening your calendar to ${e.name}.`); return;
  }
  if(D.cdelete){
    const e=S.events.find(x=>x.id===Number(D.cdelete));
    S.events=S.events.filter(x=>x.id!==Number(D.cdelete));
    closeSheet(); render(); toast(`${e.name} removed.`); return;
  }
  if(D.hmenu){ S.hmenu=!S.hmenu; render(); return }
  if(D.horizon){
    S.horizon = Number(D.horizon);
    S.hmenu=false; render(); return;
  }
  if(D.arcinfo){ sheetArc(); return }
  if(D.breakdown){ sheetCtx=null; sheetBreakdown(Number(D.breakdown)); return }
  if(D.sstep&&sheetCtx&&sheetCtx.breakdown!=null){
    const s=SCALES[S.scale], step=(s.step||1)/(s.max||10);
    sheetCtx.cost=Math.max(step,Math.min(1,sheetCtx.cost+Number(D.sstep)*step));
    sheetCtx.pending=($("subName")||{}).value||"";
    sheetBreakdown(sheetCtx.breakdown); return;
  }
  if(D.addsub&&sheetCtx){
    const name=(($("subName")||{}).value||"").trim();
    if(!name){ toast("Give the piece a name."); return }
    const parent=S.events.find(e=>e.id===Number(D.addsub));
    S.events=S.events.concat({id:S.nextId++,date:null,time:null,name,
                              cost:Math.round(sheetCtx.cost*1000)/1000,type:parent.type,task:true,
                              added:TODAY,due:parent.due,parent:parent.id});
    sheetCtx.pending="";
    sheetBreakdown(parent.id); render(); toast("Added a piece.");
    return;
  }
  if(D.donebreak){
    S.nudged=(S.nudged||[]).concat(Number(D.donebreak));
    closeSheet(); render(); return;
  }
  if(D.addtask){ sheetCtx=null; sheetTask(); return }
  if(D.tstep&&sheetCtx&&sheetCtx.newTask){
    const s=SCALES[S.scale], step=(s.step||1)/(s.max||10);
    sheetCtx.name=($("taskName")||{}).value||sheetCtx.name;
    sheetCtx.due=($("taskDue")||{}).value||sheetCtx.due;
    sheetCtx.cost=Math.max(step,Math.min(1,sheetCtx.cost+Number(D.tstep)*step));
    sheetTask(); return;
  }
  if(D.ttype&&sheetCtx&&sheetCtx.newTask){
    sheetCtx.name=($("taskName")||{}).value||sheetCtx.name;
    sheetCtx.due=($("taskDue")||{}).value||sheetCtx.due;
    sheetCtx.type=D.ttype; sheetTask(); return;
  }
  if(D.twhen!==undefined&&sheetCtx&&sheetCtx.newTask){
    sheetCtx.name=($("taskName")||{}).value||sheetCtx.name;
    sheetCtx.due=($("taskDue")||{}).value||sheetCtx.due;
    sheetCtx.when=D.twhen||null; sheetTask(); return;
  }
  if(D.savetask&&sheetCtx&&sheetCtx.newTask){
    const name=(($("taskName")||{}).value||"").trim();
    if(!name){ toast("Give it a name first."); return }
    const when=sheetCtx.when||null;          /* closeSheet nulls sheetCtx */
    const due=(($("taskDue")||{}).value||"")||null;
    S.events=S.events.concat({id:S.nextId++,date:when,time:null,
                              name,cost:Math.round(sheetCtx.cost*1000)/1000,
                              type:sheetCtx.type,task:true,added:TODAY,due,parent:null});
    closeSheet(); render();
    toast(when?`Added to ${niceDate(when)}.`:"Added to the list.");
    return;
  }
  if(D.undone){
    const e=S.events.find(x=>x.id===Number(D.undone)); if(!e) return;
    e.done=false; e.doneAt=null;
    S.charge=Math.min(capOn(TODAY)||1, S.charge+e.cost);   /* give the spend back */
    render(); toast(`${e.name} is back on the list.`); return;
  }
  if(D.done){
    const e=S.events.find(x=>x.id===Number(D.done));
    e.done=true; e.doneAt=TODAY;
    const raw=S.charge-e.cost;
    S.prevCharge=S.charge;
    if(raw<0){ S.debt=(S.debt||0)+(-raw); S.charge=0 } else S.charge=raw;
    closeSheet(); render();
    toast(`${e.name} done.`);
    return;
  }
  if(D.tstart){ sheetHelp(true); return }
  if(D.hpick&&sheetCtx&&sheetCtx.help){
    const i=sheetCtx.picks.indexOf(D.hpick);
    if(i>=0){ sheetCtx.picks.splice(i,1); delete sheetCtx.dirs[D.hpick] }
    else sheetCtx.picks.push(D.hpick);
    sheetHelp(); return;
  }
  if(D.hgo&&sheetCtx&&sheetCtx.help){
    if(!sheetCtx.picks.length){ toast("Pick at least one."); return }
    sheetCtx.stage="dir"; sheetHelp(); return;
  }
  if(D.hguess){
    const g=inferBranch();
    sheetCtx={help:true, stage:"cap", picks:[g.key], dirs:{[g.key]:g.branch.dir}};
    sheetHelp(); return;
  }
  if(D.hdir&&sheetCtx&&sheetCtx.help){
    const [k,dir]=D.hdir.split("|");
    sheetCtx.dirs[k]=dir;
    if(!pendingDirs(sheetCtx).length) sheetCtx.stage="cap";
    sheetHelp(); return;
  }
  if(D.hcap&&sheetCtx&&sheetCtx.help){ sheetCtx.cap=D.hcap; sheetCtx.stage="time"; sheetHelp(); return }
  if(D.htime&&sheetCtx&&sheetCtx.help){ sheetCtx.time=D.htime; sheetCtx.stage="answer"; sheetCtx.skip=0; sheetHelp(); return }
  if(D.hback&&sheetCtx&&sheetCtx.help){
    const c=sheetCtx;
    if(c.stage==="time") c.stage="cap";
    else if(c.stage==="cap"){
      /* step back into the last direction answered, if there was one */
      const asked=(c.picks||[]).filter(k=>RECOVERY_TREE[k].branches.length>1);
      if(asked.length){ delete c.dirs[asked[asked.length-1]]; c.stage="dir" } else c.stage="pick";
    }
    else if(c.stage==="dir"){
      const asked=(c.picks||[]).filter(k=>RECOVERY_TREE[k].branches.length>1 && c.dirs[k]);
      if(asked.length) delete c.dirs[asked[asked.length-1]]; else c.stage="pick";
    }
    sheetHelp(); return;
  }
  if(D.hskip&&sheetCtx&&sheetCtx.help){
    const n=decodeURIComponent(D.hskip);
    S.passed=Object.assign({},S.passed||{},{[n]:((S.passed||{})[n]||0)+1});
    sheetCtx.skip=(sheetCtx.skip||0)+1; sheetHelp(); return;
  }
  if(D.hwiden&&sheetCtx&&sheetCtx.help){ widen(sheetCtx); sheetHelp(); return }
  if(D.hdone){
    /* "that one helped" is the only thing this screen learns from, and it's the
       same shape as marking an event draining: your word, weighted over time */
    const n=decodeURIComponent(D.hdone);
    S.helped=Object.assign({},S.helped||{},{[n]:((S.helped||{})[n]||0)+1});
    closeSheet(); render(); toast("Noted — that one comes up first next time."); return;
  }
  if(D.tclear){ S.tiredResult=null; render(); return }
  if(D.rectree){ sheetRecovery(); return }
  if(D.branch){
    const [k,dir]=D.branch.split("|");
    const cat=RECOVERY_TREE[k], b=cat.branches.find(x=>x.dir===dir);
    openSheet(`
      <h3>${b.label}?</h3>
      <p class="sub">${cat.label}</p>
      ${b.items.map(i=>`<div class="recitem">${itemName(i)}</div>`).join("")}
      <div style="height:18px"></div>
      <button class="btn" data-rectree="1" style="border-color:var(--line);color:var(--muted)">Something else</button>
      <div style="height:8px"></div>
      <button class="btn" data-closesheet="1">Close</button>`);
    return;
  }
  if(D.editplanned){ sheetCtx=null; sheetPlanned(); return }
  if(D.rmplan){
    S.planned=plannedList().filter(x=>x.id!==D.rmplan);
    render(); sheetPlanned(); return;
  }
  if(D.pstep&&sheetCtx&&sheetCtx.newPlan){
    const s=SCALES[S.scale], step=(s.step||1)/(s.max||10);
    sheetCtx.name=($("planName")||{}).value||sheetCtx.name;
    sheetCtx.cost=Math.max(step,Math.min(1,sheetCtx.cost+Number(D.pstep)*step));
    sheetPlanned(); return;
  }
  if(D.ptype&&sheetCtx&&sheetCtx.newPlan){
    sheetCtx.name=($("planName")||{}).value||sheetCtx.name;
    sheetCtx.type=D.ptype; sheetPlanned(); return;
  }
  if(D.pat&&sheetCtx&&sheetCtx.newPlan){
    sheetCtx.name=($("planName")||{}).value||sheetCtx.name;
    sheetCtx.at=D.pat; sheetPlanned(); return;
  }
  if(D.saveplan&&sheetCtx&&sheetCtx.newPlan){
    const name=(($("planName")||{}).value||"").trim();
    if(!name){ toast("Give it a name first."); return }
    S.planned=plannedList().concat({id:"p"+(S.nextPlanId++),n:name,t:sheetCtx.type,
                                    cost:-(Math.round(sheetCtx.cost*1000)/1000),at:sheetCtx.at});
    sheetCtx=null; render(); sheetPlanned(); toast(`${name} added.`);
    return;
  }
  if(D.book){ const [pid,d]=D.book.split("|"); sheetBook(pid,d); return }
  if(D.noplan){ S.plannedFor=(S.plannedFor||[]).concat(D.noplan); render();
    toast("Fine. It'll mention it again another week."); return }
  if(D.dobook){
    const [pid,d]=D.dobook.split("|");
    const spec=plannedById(pid);
    S.events=S.events.concat({id:S.nextId++,date:d,time:spec.at,name:spec.n,
                              cost:spec.cost,type:spec.t,pending:true});
    S.plannedFor=(S.plannedFor||[]).concat(d);
    closeSheet(); render();
    toast(`Opening your calendar… ${spec.n} shows as pending until it lands there.`);
    return;
  }
  /* cost sheet */
  if(D.step&&sheetCtx){
    const s=SCALES[S.scale], stepFrac=(s.step||1)/(s.max||10);
    sheetCtx.cost=Math.max(0,Math.min(1,sheetCtx.cost+Number(D.step)*stepFrac));
    sheetEvent(sheetCtx.id); return;
  }
  if(D.type&&sheetCtx){ sheetCtx.type=D.type; sheetEvent(sheetCtx.id); return }
  if(D.usehist&&sheetCtx){ sheetCtx.cost=Number(D.usehist); sheetEvent(sheetCtx.id); return }
  if(D.rest&&sheetCtx){ sheetCtx.rest=!sheetCtx.rest; sheetEvent(sheetCtx.id); return }
  if(D.savecost&&sheetCtx){
    const e=S.events.find(x=>x.id===sheetCtx.id);
    const v=Math.round(sheetCtx.cost*1000)/1000;
    e.cost=sheetCtx.rest?-v:v; e.type=sheetCtx.type;
    clearMarks(e.name);
    closeSheet(); render(); toast(`${e.name} priced. Everything downstream recalculated.`); return;
  }

  /* hand a move or a cancellation to the calendar app */
  if(D.dosync){
    const [id,kind,to]=D.dosync.split("|");
    const e=S.events.find(x=>x.id===Number(id));
    if(kind==="move"){ e.date=to; e.pending=true }
    else { S.events=S.events.filter(x=>x.id!==Number(id)) }
    closeSheet(); render();
    toast(kind==="move"
      ? `Opening your calendar… the move shows as pending until it lands there.`
      : `Opening your calendar to delete ${e.name}.`);
    return;
  }
});
$("scrim").addEventListener("click",closeSheet);

/* scale the frame to whatever room the window has, rather than a fixed size */
function fitPhone(){
  const W=390, H=812, pad=28;
  const s=Math.max(.55, Math.min(1.6,(window.innerHeight-pad)/H,(window.innerWidth-pad)/W));
  const ph=document.querySelector(".phone"), st=document.querySelector(".stage");
  ph.style.transform=`scale(${s.toFixed(3)})`;
  st.style.width=(W*s)+"px"; st.style.height=(H*s)+"px";
}
window.addEventListener("resize",fitPhone);
fitPhone();

$("clock").textContent = clockLabel(NOW_H).replace(/[ap]m$/,"");
render();
</script>
</body>
</html>
