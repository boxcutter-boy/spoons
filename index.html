}
function load(){
  try{
    const r=localStorage.getItem("spoon.proto.v4"); if(!r) return null;
    const v=JSON.parse(r);
    /* Anyone who used an earlier build has ITS state in localStorage, and the
       app has to open on their saved copy without arguing with it. Settings
       that have since lost an option get pulled back to a valid one — the
       write-in unit is the live example: "Your custom runs out on Monday". */
    if(!SCALES[v.scale]) v.scale="ten";
    if(["spoons","energy","mana"].indexOf(v.unit)<0) v.unit="spoons";
    if(!Array.isArray(v.events)||!v.events.length) return null;
    if(!Array.isArray(v.drains)) return null;   /* pre-marks schema — start clean */
    return v;
  }catch(e){ return null }
}
function save(){ try{ localStorage.setItem("spoon.proto.v4",JSON.stringify(S)) }catch(e){} }

/* The scale says how MANY; the unit says what they're CALLED. They were one
   setting ("12 spoons"), which meant picking a granularity and picking a word
   were the same decision — and the word is the part that makes the number feel
   like yours. */
const UNITS = [["spoons","spoons"],["energy","energy"],["mana","mana"]];
function unitName(){
  return S.unit||"spoons";
}
/* "Your spoons run out" but "Your energy runs out" — a sentence that makes the
   unit its subject needs the verb to agree, and with a closed set of three
   that's a lookup rather than a guess. */
function unitPlural(){ return S.unit==="spoons" || !S.unit }
/* The unit is also the word for the STUFF, not just for the figures — "took away
   spoons", "this gave me mana". Under "no numbers" there are no units to name,
   and the Scale units setting is hidden along with them, so the word falls back
   to the plain one everybody already understands. */
function unitWord(){ return noNums() ? "energy" : unitName() }
/* "2 spoons" but "1 spoon" — and "energy" and "mana" don't inflect at all. With
   a closed set of three this is a lookup; it was a heuristic when the unit could
   be anything the user typed, which is one more reason that option went. */
const UNIT_ONE = { spoons:"spoon", energy:"energy", mana:"mana" };
function unitCount(v){
  const n=fmt(Math.abs(v));
  return `${n} ${n==="1" ? (UNIT_ONE[unitName()]||unitName()) : unitName()}`;
}
/* The crossing hour is computed to the minute, which makes "under from 6:46pm"
   look like a fact. It isn't one — it's the output of a model built on guesses.
   Four buckets is the honest resolution, and the timeline draws the exact line
   anyway for anyone who wants to look. */
function timeOfDay(h){ return h<12 ? "morning" : h<17 ? "afternoon" : h<21.5 ? "evening" : "night" }

/* "Most draining" has to mean something on the day in hand, not in the abstract:
   a 2 is the heavy one on a light day and unremarkable on a heavy one. So the
   bar is a share of the day's load, floored so a quiet day can't promote a
   standup into a villain. */
function heavyOn(date){
  const evs=eventsOn(date).filter(e=>!e.task);
  const bar=Math.max(.15, evs.reduce((a,e)=>a+Math.max(0,costOf(e)||0),0)*.25);
  return e=>{ const c=costOf(e); return c!=null && c>0 && c>=bar };
}

/* Where an event could go is a SECOND question — it only exists once you've
   picked the thing. Only later days are candidates: moving a cost earlier
   drains the run-up and cascades straight back into the day you're rescuing. */
function movesFor(id){
  const e=S.events.find(x=>x.id===id);
  const f=project(Math.max(1,daysBetween(TODAY,e.date)+1)), day=f[f.length-1];
  let moves=[], off=null;
  for(let step=1;step<=6;step++){
    const cand=addDays(e.date,step);
    const fr=whatIf(()=>{ S.events.find(x=>x.id===id).date=cand });
    const there=endOn(fr,cand), here=endOn(fr,e.date);
    if(there==null||here==null||here<=day.end+.03) continue;
    moves.push({date:cand,there,here}); if(off==null) off=here;
  }
  moves.sort((a,b)=>b.there-a.there);
  moves=moves.slice(0,3).sort((a,b)=>a.date<b.date?-1:1);
  const drop=endOn(whatIf(()=>{ S.events=S.events.filter(x=>x.id!==id) }),e.date);
  return {moves,off,drop,day};
}


/* ---------- scale / formatting ---------- */
const SCALES = {
  ten:     {label:"out of 10",  max:10,  step:1,  round:v=>Math.round(v*10)},
  twelve:  {label:"out of 12",  max:12,  step:1,  round:v=>Math.round(v*12)},
  hundred: {label:"out of 100", max:100, step:5,  round:v=>Math.round(v*100/5)*5},
  none:    {label:"no numbers", max:null,step:null,round:null}
};
const noNums = ()=> S.scale==="none";
function fmt(v){ const s=SCALES[S.scale]; return s.round ? String(s.round(Math.max(0,v))) : ""; }
function fmtMax(){ const s=SCALES[S.scale]; return s.max==null?"":String(s.max); }
/* Magnitude without digits. The figures were the overwhelming part, and they get
   read far more often than they're needed: on an agenda the question is "is this
   the heavy one", never "is this a 2 or a 3". Three bands, because light /
   medium / heavy is the whole judgement anyone makes from a cost — a fourth
   arrow would be a digit wearing a costume.

   What DOESN'T become arrows is how much you have. That's the number worth
   knowing, so charge, day totals and "ends on" stay as figures. Costs are
   relative and constantly re-estimated; a level is a fact about you. */
/* Boundaries set where the printed figures used to fall, so an event that read
   "3" gets three arrows and one that read "2" gets two — the bands are a coarser
   view of the same scale, not a different opinion about it. */
const COST_BANDS = [.15, .25];
function costArrows(c){
  /* Some things are neither. A standup you've stopped noticing doesn't drain you
     and doesn't give anything back — and an arrow on it is a claim the app can't
     support. A dash says "this is on your calendar and it costs you nothing",
     which is a real and common answer. */
  if(c===0) return `<span class="arrows flat">\u2014</span>`;
  const a=Math.abs(c), up=c<0;
  const n = a<COST_BANDS[0] ? 1 : a<COST_BANDS[1] ? 2 : 3;   /* light | medium | heavy */
  return `<span class="arrows${up?" plus":""}">${(up?TREND.up:TREND.down).repeat(n)}</span>`;
}

function pips(v,plus){
  const n=Math.max(1,Math.round(Math.abs(v)*10));
  return `<span class="pips${plus?" plus":""}">${"<i></i>".repeat(Math.min(n,6))}</span>`;
}
function costText(c,inferred){
  if(c==null) return `<span class="c none">tap</span>`;
  const plus = c<0;
  const inner = costArrows(c);
  return `<span class="c ${plus?"plus":""} ${inferred?"inf":""}">${inner}</span>`;
}

/* ---------- dates ---------- */
const DOW=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
const DOWL=["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
const MON=["January","February","March","April","May","June","July","August","September","October","November","December"];
function parse(d){ const [y,m,dd]=d.split("-").map(Number); return new Date(y,m-1,dd) }
function iso(dt){ return dt.getFullYear()+"-"+String(dt.getMonth()+1).padStart(2,"0")+"-"+String(dt.getDate()).padStart(2,"0") }
function addDays(d,n){ const dt=parse(d); dt.setDate(dt.getDate()+n); return iso(dt) }
function dow(d){ return DOW[parse(d).getDay()] }
function dowL(d){ return DOWL[parse(d).getDay()] }
function dayNum(d){ return parse(d).getDate() }
function longDate(d){ const dt=parse(d); return DOW[dt.getDay()]+" "+dt.getDate()+" "+MON[dt.getMonth()].slice(0,4).replace("Sept","Sept") }
function niceDate(d){ const dt=parse(d); return DOW[dt.getDay()]+" "+dt.getDate()+" "+MON[dt.getMonth()] }
function daysBetween(a,b){ return Math.round((parse(b)-parse(a))/864e5) }
function hm(t){ const [h,m]=t.split(":").map(Number); return h+m/60 }
function halfHour(h){ return Math.round(h*2)/2 }
function clockLabel(h){
  const hh=Math.floor(h), mm=Math.round((h-hh)*60);
  const ap=hh>=12?"pm":"am"; let d=hh%12; if(d===0)d=12;
  return d+(mm?":"+String(mm).padStart(2,"0"):"")+ap;
}

/* ---------- per-day computation ---------- */
function isSpan(e){ return (e.span||1)>1 }
/* Two kinds of multi-day bar, and they're not the same thing:
   - a CALENDAR span comes from your calendar. Spoon never writes there, so it
     can't offer to edit one — only to annotate it (direction, ceiling) and hand
     you over to the calendar app for the rest.
   - a CONDITION is Spoon's own: a period, seeing your parents monthly, a flare.
     It needn't exist in any calendar, and it's fully editable here. */
function isCondition(e){ return isSpan(e) && e.src==="spoon" }
function isCalSpan(e){ return isSpan(e) && e.src!=="spoon" }
/* A condition can impose a CEILING — "you can't get above 7 this week". A
   clamp, not a multiplier: two overlapping ones take the lower, it never
   interacts with the chronotype curve, and it says itself in words. Rate and
   recovery modifiers were considered and rejected for exactly that reason. */
/* A condition can repeat — a cycle is the clearest case, since it's the one
   thing about a future bad week that's knowable in advance. Recurring TASKS
   were rejected (scheduling laundry is itself cognitive load); a recurring
   condition is the opposite — set once, and the forecast knows forever with no
   logging at all. */
function coversDate(e,date){
  const step=e.every||0, off=daysBetween(e.date,date);
  if(off<0 && !step) return false;
  if(!step) return off>=0 && off<(e.span||1);
  const m=((off%step)+step)%step;          /* where in the cycle this date falls */
  return m>=0 && m<(e.span||1);
}
function capOn(date){
  let cap=1;
  for(const e of S.events){
    if(!isSpan(e)||!e.cap) continue;
    if(coversDate(e,date)) cap=Math.min(cap,e.cap);
  }
  return cap;
}
function capNameOn(date){
  const hit=S.events.filter(e=>isSpan(e)&&e.cap&&coversDate(e,date))
                    .sort((a,b)=>a.cap-b.cap)[0];
  return hit?hit.name:null;
}
function eventsOn(date){
  return S.events.filter(e=>e.date===date&&!isSpan(e))
    .sort((a,b)=>(a.time?hm(a.time):99)-(b.time?hm(b.time):99));
}
function zoneOf(v){ let z=ZONES[0]; for(const q of ZONES) if(v>=q.min) z=q; return z }
function lerp(a,b,t){ return a+(b-a)*t }
function hex(c){ return [parseInt(c.slice(1,3),16),parseInt(c.slice(3,5),16),parseInt(c.slice(5,7),16)] }
function colorFor(v){
  const stops=[[0,"#f0537c"],[.25,"#f0537c"],[.45,"#eda029"],[.62,"#23a8a2"],[1,"#23a8a2"]];
  for(let i=0;i<stops.length-1;i++){
    const [a,ca]=stops[i], [b,cb]=stops[i+1];
    if(v>=a&&v<=b){
      const t=(b-a)===0?0:(v-a)/(b-a), A=hex(ca), B=hex(cb);
      return `rgb(${Math.round(lerp(A[0],B[0],t))},${Math.round(lerp(A[1],B[1],t))},${Math.round(lerp(A[2],B[2],t))})`;
    }
  }
  return "#23a8a2";
}

/* Walk one day event by event.
   Charge never goes below 0 (concept.md §4) — but the overspend can't just
   vanish either, or a 20-point day would cost the same as an 8-point one. It
   accumulates as `debt`, and recovery pays that off BEFORE charge climbs. That
   is "debt is measured in time" made mechanical: no negative number anywhere,
   but overspending still delays the recovery. */
function runDay(date, startCharge, startDebt, cap){
  const evs = eventsOn(date).filter(e=>e.time!=null);
  const CAP = cap==null ? 1 : cap;
  let c = Math.min(startCharge, CAP), debt = startDebt||0;
  const curve = [{h:DAY_START_H, c}];
  let cross = null, openHours = 0, budget = DAY_OPEN_CAP, bestGap = null;
  const noteGap = (from,len) => {
    if(!bestGap || len>bestGap.len) bestGap = {from, len};
  };
  let cursor = DAY_START_H;
  const claim = gap => {
    const gain = Math.min(gap*REFILL_PER_OPEN_HOUR, budget);
    budget -= gain;
    const pay = Math.min(debt, gain); debt -= pay;
    return gain - pay;                              // only the surplus lifts charge
  };

  for(const e of evs){
    const h = hm(e.time);
    if(h>cursor){                                    // open stretch → slow refill
      const gap = h-cursor;
      if(gap>=1.5){
        openHours += gap; noteGap(cursor, gap);
        c = Math.min(CAP, c+claim(gap));
        curve.push({h, c});
      } else curve.push({h, c});
      cursor = h;
    }
    const base = planned(e);
    const cost = base==null ? 0 : (base>0 ? base*todMult(h) : base);
    const before = c;
    const raw = c - cost;
    if(raw < 0){ debt += -raw; c = 0 } else c = Math.min(CAP, raw);
    const dur = .9;
    curve.push({h:h+dur, c});
    if(cross==null && before>=.25 && c<.25){
      const t = (before-.25)/(before-c||1);
      cross = h + dur*t;
    }
    cursor = h+dur;
  }
  if(cursor<DAY_END_H){
    const gap = DAY_END_H-cursor;
    if(gap>=1.5){ openHours += gap; noteGap(cursor, Math.min(gap, 21-cursor)); c = Math.min(CAP,c+claim(gap)) }
    curve.push({h:DAY_END_H-.8, c});
  }
  /* Events with no time still cost you — they just can't be placed. Applied at
     the end of the day so the total and the curve agree. */
  /* untimed things happen "sometime", so no chronotype multiplier */
  const loose = eventsOn(date).filter(e=>e.time==null && costOf(e)!=null);
  if(loose.length){
    const sum = loose.reduce((s,e)=>s+planned(e),0);
    const raw = c - sum;
    if(raw<0){ debt += -raw; c = 0 } else c = Math.min(CAP, raw);
    curve.push({h:DAY_END_H, c});
  } else curve.push({h:DAY_END_H, c});
  /* load/rest are the base sums, so they match the prices shown on the rows;
     the chronotype effect lives in the curve, not in the printed totals */
  const priced   = eventsOn(date).filter(e=>costOf(e)!=null);
  const unpriced = eventsOn(date).filter(e=>costOf(e)==null);
  const load = priced.reduce((s,e)=>s+Math.max(0,costOf(e)),0);
  const rest = priced.reduce((s,e)=>s+Math.max(0,-costOf(e)),0);
  return {curve, start:startCharge, end:c, debt, cross, openHours, bestGap, load, rest,
          unpriced:unpriced.length, hasEvents:eventsOn(date).length>0};
}

/* Project forward from today. Day 0 uses live charge; later days add the night refill. */
let projCache=null;
function project(n){
  if(projCache && projCache.length>=n) return projCache.slice(0,n);
  const N=Math.max(n,32), out=[]; let c=S.charge, debt=S.debt||0;
  for(let i=0;i<N;i++){
    const date=addDays(TODAY,i);
    if(i>0){
      const gain = (i===1&&S.roughNight) ? NIGHT_BAD : nightRefill(c);
      const pay = Math.min(debt, gain); debt -= pay;
      c = Math.min(1, c + (gain-pay));
    }
    const cap=capOn(date);
    c = Math.min(c, cap);
    const d=runDay(date,c,debt,cap);
    out.push(Object.assign({date},d));
    c=d.end; debt=d.debt;
  }
  projCache=out;
  return out.slice(0,n);
}
function dayAt(date){
  const off=daysBetween(TODAY,date);
  if(off<0) return null;
  const f=project(off+1);
  return f[off]||null;
}
/* "unknown" only when there's nothing priced to go on. A day that's part-priced
   shows its zone and is flagged partial — "at least this heavy" beats a shrug. */
/* Because charge floors at 0, you can't undo a cost by adding it back — the day
   has to be re-run. whatIf() applies a change, reprojects, then restores. */
function whatIf(fn){
  /* fn mutates COPIES — the originals are never touched, so references held by
     the caller across this call stay valid. (Mutating the originals and
     restoring copies leaves stale references pointing at changed objects.) */
  const orig=S.events, cache=projCache;
  S.events=orig.map(e=>Object.assign({},e));
  fn(); projCache=null;
  const f=project(32);
  S.events=orig; projCache=cache;
  return f;
}
function endOn(f,date){
  const i=daysBetween(TODAY,date);
  return (i>=0&&f[i])?f[i].end:null;
}

function cellState(date){
  if(daysBetween(TODAY,date)<0) return "past";
  const d=dayAt(date);
  if(!d) return "unknown";
  if(d.unpriced>0 && d.load===0 && d.rest===0) return "unknown";
  return zoneOf(d.end).k;
}
function isPartial(date){
  const d=dayAt(date);
  return !!(d && d.unpriced>0 && (d.load>0||d.rest>0));
}

/* ---------------------------------------------------------------------------
   CALIBRATION
   Speaks up only with enough instances, a gap worth mentioning, and a
   consistent direction — one sample saying "actually it's higher" is noise, and
   an app that cries wolf gets ignored. Advisory only: an explicit estimate is
   never silently overridden. Unpriced events do take the historical mean as
   their suggested default, which is where the learning gets applied.
---------------------------------------------------------------------------- */
/* A cost is not a property of an event. It's a property of an event AT A POINT
   IN YOUR LIFE. The daily 1:1 doesn't have a true number the app was measuring
   badly — it genuinely costs less than it did in March, and averaging six months
   of ratings actively hides that. So nothing is rated. You mark the things that
   took it out of you, and everything else drifts quietly downward.

   Silence means it was fine, and silence is free — which is the whole point for
   someone with nothing spare. */
const DRAIN_WINDOW = 56;   /* days a mark still counts for */
const DRAIN_BUMP   = .35;  /* what one mark adds */
const DRAIN_CAP    = 3;    /* marks past this add nothing — it's already expensive */
const QUIET_FADE   = .07;  /* what a week of not marking it takes off */
const FACTOR_MIN   = .35, FACTOR_MAX = 2.1;

function drainHits(name){
  return (S.drains||[])
    .filter(d=>d.name===name && daysBetween(d.date,TODAY)>=0
                             && daysBetween(d.date,TODAY)<=DRAIN_WINDOW)
    .sort((a,b)=>a.date<b.date?-1:1);
}
/* Up on evidence, down on silence, clamped at both ends: a thing you've never
   flagged settles at about a third of its stated price, and one you've flagged
   three times sits at twice. */
function drainFactor(name){
  const hits=drainHits(name);
  /* the clock runs from whichever came last: the final mark, a deliberate
     reset, or the first time the app saw the name at all */
  const from = [hits.length?hits[hits.length-1].date:null,
                (S.marksFrom||{})[name] || null,
                nameFirstSeen(name)].filter(Boolean).sort().pop();
  const weeksQuiet = from ? daysBetween(from, TODAY)/7 : 0;
  const f = 1 + DRAIN_BUMP*Math.min(hits.length,DRAIN_CAP) - QUIET_FADE*Math.max(0,weeksQuiet);
  return Math.max(FACTOR_MIN, Math.min(FACTOR_MAX, f));
}
/* How long the app has known this name — a brand-new event hasn't earned any
   fade yet, and shouldn't open at a discount it didn't earn. */
function nameFirstSeen(name){
  if(SEED_KNOWN[name]!=null) return addDays(TODAY,-SEED_KNOWN[name]);
  let first=null;
  for(const e of S.events){
    if(e.name!==name || !e.date) continue;
    if(daysBetween(e.date,TODAY)<0) continue;            /* future */
    if(first===null || e.date<first) first=e.date;
  }
  return first;
}
/* Restores don't habituate this way — a bath doesn't stop working because you
   didn't complain about it. */
function drainNote(e){
  const c=e.cost;
  if(c==null||c<=0) return null;
  const hits=drainHits(e.name);
  if(!hits.length) return null;
  const f=drainFactor(e.name);
  if(f<=1.05) return null;
  return {n:hits.length, factor:f, last:hits[hits.length-1].date, cost:c*f};
}
function markedOn(name,date){ return (S.drains||[]).some(d=>d.name===name&&d.date===date) }
function toggleMark(name,date){
  if(markedOn(name,date)) S.drains=(S.drains||[]).filter(d=>!(d.name===name&&d.date===date));
  else S.drains=(S.drains||[]).concat({name,date});
}
/* Setting a price outright is a fresh statement about the thing, so the marks
   behind it are spent — otherwise the number you just typed is immediately
   multiplied by a history you were trying to overrule. It also restarts the
   quiet clock: without that, clearing the marks on a five-month-old event drops
   it straight through to the floor, which is the opposite of what "start again"
   means. */
function clearMarks(name){
  S.drains=(S.drains||[]).filter(d=>d.name!==name);
  S.marksFrom=Object.assign({}, S.marksFrom||{}, {[name]:TODAY});
}
function drainText(e,note){
  const times = note.n===1 ? "once" : note.n===2 ? "twice" : `${note.n} times`;
  return `You've marked this draining ${times} in the last while, so it's priced
          at ${noNums()?costArrows(note.cost):unitCount(note.cost)} rather than
          the ${noNums()?costArrows(e.cost):unitCount(e.cost)} you set.`;
}
/* The stated price, adjusted for how this thing has actually been landing. */
function costOf(e){
  if(e.cost==null) return null;
  return e.cost<0 ? e.cost : e.cost*drainFactor(e.name);
}
/* An invitation you haven't answered might not happen. Counting it at full
   price makes the week look worse than it is; dropping it makes it look better
   than it is. So it counts, at a discount, until you answer (concept.md §10b).
   Like the chronotype curve, the discount lives in the forecast and not in the
   printed price — the dinner costs what it costs if you go. */
const INVITE_DISCOUNT = .6;
function planned(e){ const c=costOf(e); return c==null?null:(e.inv?c*INVITE_DISCOUNT:c) }

/* Chronotype multiplier: the same meeting costs more in your bad hours.
   Applied to drains only, and to the charge curve rather than to the printed
   price of an event — a standup shouldn't appear to cost different amounts on
   different days. */
const CHRONO={
  /* Yours: slow mornings, best through the afternoon and evening, and a hard
     drop after 10pm — "basically done for the day". */
  yours:   [[7,1.34],[10,1.15],[13,.96],[17,.86],[21,.97],[22,1.32],[23,1.58]],
  morning: [[7,.82],[12,1.0],[17,1.12],[23,1.28]],
  evening: [[7,1.28],[12,1.10],[17,.95],[23,.84]],
  dip:     [[7,.90],[13,1.0],[16,1.22],[23,.98]],
  flat:    [[7,1],[23,1]]
};
function todMult(h){
  const pts=CHRONO[S.chrono]||CHRONO.flat;
  if(h<=pts[0][0]) return pts[0][1];
  for(let i=0;i<pts.length-1;i++){
    const [x1,y1]=pts[i],[x2,y2]=pts[i+1];
    if(h>=x1&&h<=x2) return lerp(y1,y2,(h-x1)/(x2-x1));
  }
  return pts[pts.length-1][1];
}

/* Events in the horizon you've marked draining, so the app is pricing them
   above what you set. Worth surfacing unprompted: it's the one place your own
   input has silently changed the forecast. */
function markedUp(days){
  const out=[], seen={};
  for(let i=0;i<days;i++){
    for(const e of eventsOn(addDays(TODAY,i))){
      const note=drainNote(e);
      if(!note || seen[e.name]) continue;
      seen[e.name]=1; out.push({ev:e, note});
    }
  }
  return out.sort((a,b)=>b.note.factor-a.note.factor);
}

/* What the week ahead asks of you, by kind. Read-only: it changes no
   arithmetic. Depletion bleeds across types (a physically wrecked day leaves
   you less able to do anything), so there is one battery — these are
   annotations that explain the shape, not four separate tanks. */
function typeMix(days){
  const tally={social:0,sensory:0,executive:0,physical:0};
  for(let i=0;i<days;i++){
    for(const e of eventsOn(addDays(TODAY,i))){
      const cv=costOf(e);
      if(cv>0&&e.type&&tally[e.type]!==undefined) tally[e.type]+=cv;
    }
  }
  const total=Object.values(tally).reduce((s,v)=>s+v,0);
  if(total<=0) return null;
  const rows=Object.entries(tally).map(([k,v])=>({k,v,share:v/total}))
                   .sort((a,b)=>b.v-a.v);
  return {rows,total,top:rows[0]};
}
function mixNote(mix,days){
  const t=mix.top;
  if(t.share>=.5)  return `${t.k[0].toUpperCase()+t.k.slice(1)} is over half of what the next ${days} days ask of you.`;
  if(t.share>=.36) return `Mostly ${t.k} in the next ${days} days.`;
  return `Fairly evenly spread across the four.`;
}

/* The app knows which currency went, and roughly whether a type has been
   hammered or neglected — so it guesses the branch and lets you correct it,
   the same estimate-then-correct move used everywhere else. */
function inferBranch(){
  const mix=typeMix(7), recent=typeMix(3);
  const top=(recent&&recent.top.v>0) ? recent.top.k : (mix?mix.top.k:"sensory");
  const tree=RECOVERY_TREE[top]||RECOVERY_TREE.sensory;
  /* a type at nearly zero over the window points at the opposite branch */
  const share=(mix&&mix.rows.find(r=>r.k===top)||{}).share||0;
  const starved=tree.branches.find(b=>b.dir==="little");
  const dir=(starved && share<.08) ? "little" : (tree.branches[0].dir);
  return {key:top, tree, branch:tree.branches.find(b=>b.dir===dir)||tree.branches[0]};
}

/* A day with room and nothing in it — the moment to book something restorative,
   while it's still bookable. */
function plannedList(){ return S.planned||[] }
function plannedById(id){ return plannedList().find(x=>x.id===id) }

function roomyDay(days){
  /* "Room" means the day is largely empty — not that you're thriving. This used
     to also require the day not to END over, which quietly disabled the whole
     feature exactly when it matters: crashed, every day ends over, so there was
     never a day with "room" to offer. A near-empty day is only over because of
     where you're starting from, and what gets booked into it gives energy back,
     so emptiness is the whole test. */
  return project(Math.max(days,7)).slice(1)
    .filter(d=>d.load<=.15 && d.unpriced===0)
    .sort((a,b)=>(b.end-a.end)||daysBetween(TODAY,a.date)-daysBetween(TODAY,b.date))[0] || null;
}

/* ---------------------------------------------------------------------------
   TASKS
   Deliberately not a to-do list: no due dates, no counts, no overdue state,
   nothing turns red for being undone. The only question asked is "what fits in
   what's left", and the biggest affordable thing leads — spend the charge on
   something that matters while you have it.
---------------------------------------------------------------------------- */
function kids(id){ return S.events.filter(x=>x.parent===id&&!x.done) }
function parentOf(e){ return e.parent!=null ? S.events.find(x=>x.id===e.parent) : null }
/* a broken-down task stops being actionable — its parts are what you can do */
function openTasks(){ return S.events.filter(e=>e.task&&!e.done&&kids(e.id).length===0) }
/* A ticked task used to vanish on the spot, so a mis-tap was unrecoverable and
   there was no record of a day's work — which on a bad week is the only evidence
   you did anything. They sit in "done recently" instead, and clear themselves
   after three days so the list can't turn into an archive to maintain. */
const DONE_KEEP_DAYS = 3;
function doneTasks(){
  return S.events.filter(e=>e.task&&e.done&&e.doneAt)
    .sort((a,b)=>daysBetween(a.doneAt,TODAY)-daysBetween(b.doneAt,TODAY));
}
function fitting(){
  return openTasks().filter(e=>e.cost!=null&&e.cost<=S.charge+.001)
    .sort((a,b)=>{
      const ua=urgency(a), ub=urgency(b);
      if(ua!==ub) return ua-ub;                 /* real deadlines lead */
      return b.cost-a.cost;                     /* then the biggest that fits */
    });
}
function urgency(e){
  if(!e.due) return 99;
  const d=daysBetween(TODAY,e.due);
  return d<=14 ? d : 99;                        /* distant ones sort on cost like anything else */
}
/* The capacity-aware version of a deadline: not "overdue" but "how many days
   before this is due could you actually afford it?" */
function affordableBefore(e){
  if(!e.due) return null;
  const n=daysBetween(TODAY,e.due);
  if(n<0) return {days:n,count:0};
  return {days:n, count:project(n+1).filter(d=>d.start>=e.cost).length};
}
function deadlineLine(e){
  const a=affordableBefore(e); if(!a) return null;
  if(a.days<0) return `was due ${-a.days} day${a.days===-1?"":"s"} ago`;
  const due=`due in ${a.days} day${a.days===1?"":"s"}`;
  if(a.count===0) return `${due} — no day before then has room for it`;
  return `${due} · ${a.count} day${a.count===1?"":"s"} before then you could afford it`;
}
/* a task that has sat untouched long enough to be worth breaking up */
const STALE_DAYS = 21;
function staleTask(){
  return openTasks().filter(e=>e.added&&daysBetween(e.added,TODAY)>=STALE_DAYS
                            &&e.parent==null&&!(S.nudged||[]).includes(e.id))
                    .sort((a,b)=>daysBetween(b.added,TODAY)-daysBetween(a.added,TODAY))[0]||null;
}
/* What the week asks of you — moved off the homepage and behind a tap on the
   arc, with the actual events named so it's something you can act on rather
   than four abstract bars. */
function typeEvents(days){
  const out={social:[],sensory:[],executive:[],physical:[]};
  for(let i=0;i<days;i++){
    const date=addDays(TODAY,i);
    for(const e of eventsOn(date)){
      const c=costOf(e);
      if(c>0&&e.type&&out[e.type]) out[e.type].push({e,c,date});
    }
  }
  return out;
}
function sheetArc(){
  const days=horizonDays(), mix=typeMix(days);
  if(!mix){ openSheet(`<h3>What it asks of you</h3>
    <p class="sub">Nothing priced in the next ${days} days yet.</p>
    <button class="btn" data-closesheet="1">Close</button>`); return; }
  const evs=typeEvents(days);
  openSheet(`
    <h3>What it asks of you</h3>
    <p class="sub">${mixNote(mix,days)}</p>
    <div class="mix" style="margin-bottom:18px">${mix.rows.map((r,i)=>`
      <div class="mixrow ${i===0?"top":""}">
        <span class="k">${typeIcon(r.k)}${r.k}</span>
        <span class="b"><i style="width:${Math.max(2,r.share/mix.top.share*100).toFixed(0)}%"></i></span>
      </div>`).join("")}</div>
    ${mix.rows.filter(r=>r.v>0).map(r=>`
      <div class="chartgroup">
        <p class="chartq">${r.k}</p>
        ${evs[r.k].sort((a,b)=>b.c-a.c).map(x=>`
          <button class="ev" data-goday="${x.date}">
            <span class="n">${x.e.name}</span>
            <span class="t" style="width:auto">${dow(x.date)}</span>
            <span class="c">${costArrows(x.c)}</span>
          </button>`).join("")}
      </div>`).join("")}
    <div style="height:10px"></div>
    <button class="btn" data-closesheet="1">Close</button>`);
}

/* Secondary, planning-shaped cards. They live on the Calendar screen — the
   forecast is for how you are and what's coming, not for everything the app
   happens to know. */
/* The calendar page had four stacked blocks under the grid and ran to twice the
   screen. This one earned its place least as a block: it's an alert — something
   the app noticed, not a panel you came here to read — and an alert should be
   one line you can't miss, with the detail a tap away. */
function lookNote(days){
  const flags=markedUp(days);
  if(!flags.length) return "";
  const n=flags.length;
  return `<button class="note" data-look="${days}">
      <span class="warn">${WARN_ICON}</span>
      <span class="nb">
        <span class="nh">${n===1
          ? `<b>${flags[0].ev.name}</b> has been draining you.`
          : `${n} things have been draining you.`}</span>
        <span class="np">${n===1?"It's":"They're"} priced higher than you set ${n===1?"it":"them"}. Tap to see.</span>
      </span>
      <span class="chev">\u203a</span>
    </button>
    <div style="height:22px"></div>`;
}

/* What your own marks have done to the week. Rows open the cost sheet, where
   setting a price outright clears the marks and starts the count again. */
function sheetLook(days){
  const flags=markedUp(days).slice(0,4);
  if(!flags.length) return;
  openSheet(`
    <h3>What's been draining you</h3>
    <p class="sub">Marked by you, and priced up accordingly.</p>
    ${flags.map(x=>`<button class="opt" data-ev="${x.ev.id}">
      <span class="n">${x.ev.name}<br>
        <span class="hint">marked ${x.note.n===1?"once":x.note.n===2?"twice":x.note.n+" times"},
          last on ${niceDate(x.note.last)}</span></span>
      <span class="d">${costArrows(x.note.cost)}</span>
    </button>`).join("")}
    <p class="hint" style="margin:13px 0 0;line-height:1.45">Anything you stop marking
      drifts back down on its own — a thing that used to cost you doesn't have to
      go on costing you.</p>
    <div style="height:18px"></div>
    <button class="btn" data-closesheet="1" style="border-color:var(--line);color:var(--muted)">Close</button>
  `, null, true);
}
function planBlock(days){
  const roomy=roomyDay(days);
  if(!roomy || (S.plannedFor||[]).indexOf(roomy.date)>=0) return "";
  return `<p class="label">Room on ${dowL(roomy.date)}</p>
    <div class="card">
      <div style="font-size:13px;line-height:1.45">${dowL(roomy.date)} has room, and nothing in it yet.</div>
      <p class="hint" style="margin:6px 0 12px">Worth putting something good in while it's still free.</p>
      <div class="seg" style="margin-bottom:4px">
        ${plannedList().map(x=>`<button data-book="${x.id}|${roomy.date}">${x.n}</button>`).join("")}
        <button data-editplanned="1" class="addchip">+ add</button>
      </div>
      <button class="hint" data-noplan="${roomy.date}" style="display:block;margin-top:10px">not this week</button>
    </div>
    <div style="height:18px"></div>`;
}

/* The one action the forecast offers, at EVERY charge. Burnout mode used to
   drop it along with the rest of the screen furniture, which meant the one state
   you most need to correct was the one state you couldn't tell the app about —
   and since the check-in is how the charge goes back up, it was a room with no
   door. */
/* Burnout mode is triggered by the MODEL. Overwhelm is a state you're in, and
   you can be at a 7 and still in it — an app that offers help only when its own
   arithmetic approves is calling you a liar about your own day. So the door is
   always here, next to the other one. */
function checkinPill(low){
  return `<div class="pillrow">
    <button class="pill" data-checkin="1">Check in</button>
    ${low?"":`<button class="pill quiet" data-tstart="1">I'm overwhelmed</button>`}
  </div>`;
}

function tiredBlock(){
  const r=S.tiredResult;
  if(!r||r.at!==TODAY||!r.name) return "";
  return `<p class="label" style="margin-top:20px">What you landed on</p>
    <div class="card">
      <p class="helpbig" style="margin:2px 0 10px">${r.name}</p>
      <div class="recalt">
        <button data-tstart="1">ask again</button>
        <button data-tclear="1">clear</button>
      </div>
    </div>`;
}
function taskRow(e,plain){
  const par=parentOf(e), dl=deadlineLine(e);
  const nudgeable = e.added&&daysBetween(e.added,TODAY)>=STALE_DAYS
                    &&e.parent==null&&!(S.nudged||[]).includes(e.id);
  return `<div class="taskwrap">
    <button class="task" data-done="${e.id}">
      <span class="tick"></span>
      <span class="n">${par?`<span class="par">${par.name} · </span>`:""}${e.name}</span>
      <span class="g">${typeIcon(e.type)}</span>
      <span class="c">${costArrows(e.cost)}</span>
    </button>
    ${dl?`<p class="due ${affordableBefore(e).count===0?"tight":""}">${dl}</p>`:""}
    ${!plain&&nudgeable?`<p class="nudge"><button data-breakdown="${e.id}">sitting a while — break it into smaller chunks?</button></p>`:""}
  </div>`;
}

/* ---------- blurb ---------- */
/* The horizon is yours to pick. The shrink-as-you-drain behaviour (§8) survives
   in its strongest form — below the bottom threshold the week is hidden
   entirely — but the intermediate 7→3 step is gone with the "auto" option. */
function horizonDays(){ return S.horizon || 3 }
function trendText(){
  const d=S.charge-S.prevCharge, gap=daysBetween(S.lastLog,TODAY);
  const dt=parse(S.lastLog);
  const since = gap===0 ? "since this morning"
              : gap===1 ? "since yesterday"
              : gap<=6  ? "since "+dow(S.lastLog)
              : "since "+dt.getDate()+" "+MON[dt.getMonth()].slice(0,3);
  if(Math.abs(d)<.04) return "steady "+since;
  return (d>0?"climbing ":"dropping ")+since;
}
function stateWord(v){
  if(v<=.04) return "empty";
  if(v<.18)  return "crashing";
  if(v<.32)  return "running low";
  if(v<.46)  return "spread thin";
  if(v<.62)  return "okay";
  if(v<.80)  return "good";
  return "great";
}
/* With no number on screen, the state phrase IS the heading — it's doing the
   job the 64px figure does otherwise. So the blurb drops its own opener when a
   headline is shown, rather than saying "Feeling good. Good charge, and…".
   Same bands as the check-in's readout word, so the home screen and the slider
   can't describe the same charge differently. */
function headline(){
  const c=S.charge;
  if(c<=.04) return "One thing at a time.";
  if(c<.18)  return "Let's take it a day at a time.";
  if(c<.32)  return "Go gently today.";
  if(c<.46)  return "There's not much spare.";
  if(c<.62)  return "Enough to work with.";
  if(c<.80)  return "Feeling good.";
  return "Feeling great.";
}

function blurb(headed){
  const capNow=capOn(TODAY);
  if(capNow<1){
    const n=capNameOn(TODAY);
    const rec=S.events.find(e=>isSpan(e)&&e.cap&&e.every&&coversDate(e,TODAY));
    return `${n} — you can't get above ${fmt(capNow)} while it lasts.${rec?" It comes round again, so this is a ceiling you can plan for.":" Plan for that ceiling, not your usual one."}`;
  }
  const f=project(7), over=f.slice(1).filter(d=>zoneOf(d.end).k==="over"&&d.load>0);
  const c=S.charge, n=v=>noNums()?"":fmt(v);
  const firstOver = over[0];
  const day = firstOver?dowL(firstOver.date):"Sunday";
  if(c<=0) return headed
    ? "Anything you spend now comes out of recovery time."
    : "You're at empty. Anything you spend now comes out of recovery time.";
  if(c<.20) return headed ? "Just today, then." : "Running very low. Just today, then.";
  if(c<.35) return headed
    ? "This week is asking for more than that. Worth looking at what could move."
    : `${noNums()?"You're low":"You're at a "+n(c)}, and this week is asking for more than that. Worth looking at what could move.`;
  if(c<.50) return headed
    ? `Enough for the week as planned, but there's no slack in it. A quiet ${day} would buy you some.`
    : `${noNums()?"Middling":"You're at a "+n(c)}. Enough for the week as planned, but there's no slack in it. A quiet ${day} would buy you some.`;
  if(c<.70) return firstOver
    ? `${headed?"But ":"Decent charge, but "}${dowL(firstOver.date)} is going to be a tough one.`
    : `${headed?"The week ahead fits without much fuss.":"Decent charge, and the week ahead fits without much fuss."}`;
  if(c<.85) return firstOver
    ? `${headed?"Though ":"Good charge — though "}${dowL(firstOver.date)} is still going to be a stretch.`
    : `${headed?"This week fits — taking it easy is still the smart call.":"Good charge, and this week fits — taking it easy is still the smart call."}`;
  return firstOver
    ? `${headed?"But ":"Plenty in the tank, but "}${dowL(firstOver.date)} is heavy enough to matter.`
    : `${headed?"Plenty of room for the week you've got planned.":"Plenty of room in the tank for the week you've got planned."}`;
}
function paybackDays(debt){
  if(!debt||debt<=.01) return 0;
  return Math.max(1, Math.round(debt/(nightRefill(0)+DAY_OPEN_CAP)));
}
function recoveryDays(){
  let c=S.charge,d=0;
  while(c<.62&&d<21){ c=Math.min(1,c+nightRefill(c)+DAY_OPEN_CAP); d++ }
  return d;
}
function drainedType(){
  const since=addDays(TODAY,-7); const tally={};
  S.events.filter(e=>e.cost>0&&e.type&&e.date>=since&&e.date<=addDays(TODAY,2))
    .forEach(e=>tally[e.type]=(tally[e.type]||0)+e.cost);
  return Object.entries(tally).sort((a,b)=>b[1]-a[1])[0]?.[0]||"sensory";
}

/* ---------------------------------------------------------------------------
   WEEK ARC
   The day-view gradient generalised to a week: charge falls through each day and
   climbs overnight, so the shape is a sawtooth that sags when the week is too
   full. Past days are evening readings only; future days carry full curves.
---------------------------------------------------------------------------- */
/* One day per column, matching the strip below it, so the two read as a single
   component. Inside each column the waking hours take the first 72% and the
   overnight climb takes the rest — which is what makes it a sawtooth. */
function arcPoints(days){
  const f=project(days), pts=[];
  const SAMPLE=1.5, span=DAY_END_H-DAY_START_H, DAY1=days===1;
  f.forEach((d,i)=>{
    const at=h=>{
      let c=d.curve[0].c;
      for(let j=0;j<d.curve.length-1;j++){
        const a=d.curve[j], b=d.curve[j+1];
        if(h>=a.h&&h<=b.h&&b.h>a.h) return lerp(a.c,b.c,(h-a.h)/(b.h-a.h));
        if(d.curve[j].h<=h) c=d.curve[j].c;
      }
      return c;
    };
    /* Every horizon shares one axis: each day's column IS a 24-hour clock, so an
       hour sits at h/24 across it. The waking curve runs 7am–11pm (29%–96% of
       the column) and the gap to the next day is the overnight climb, drawn at
       its true width. The columns used to squeeze the waking day into 72% and
       give the night 28%, which put the "you are here" dot well to the left of
       where the clock says you are — 4:45pm landed at 44% of the day instead of
       70%. */
    if(i===0) pts.push({x:0, c:at(DAY_START_H), date:d.date, h:0});
    for(let h=DAY_START_H;h<=DAY_END_H+.001;h+=SAMPLE){
      const hh=Math.min(h,DAY_END_H);
      pts.push({x:(i+hh/24)/days, c:at(hh), date:d.date, h:hh});
    }
  });
  /* the last day's overnight stretch has nothing after it — carry the line to
     the edge so the chart doesn't stop short of its own frame */
  if(pts.length) pts.push({...pts[pts.length-1], x:1});
  return pts;
}
function weekArc(days){
  const W=358, H=86, PAD=5;
  const pts=arcPoints(days);
  const y=c=>PAD+(1-c)*(H-PAD*2), X=x=>x*W;

  /* smooth the polyline with midpoint quadratics — keeps the peaks, drops jitter */
  let path=`M${X(pts[0].x).toFixed(1)},${y(pts[0].c).toFixed(1)}`;
  for(let i=1;i<pts.length-1;i++){
    const mx=(X(pts[i].x)+X(pts[i+1].x))/2, my=(y(pts[i].c)+y(pts[i+1].c))/2;
    path+=`Q${X(pts[i].x).toFixed(1)},${y(pts[i].c).toFixed(1)} ${mx.toFixed(1)},${my.toFixed(1)}`;
  }
  const last=pts[pts.length-1];
  path+=`L${X(last.x).toFixed(1)},${y(last.c).toFixed(1)}`;

  const stops=pts.map(pt=>`<stop offset="${(pt.x*100).toFixed(1)}%" stop-color="${colorFor(pt.c)}"/>`).join("");
  let grid=Array.from({length:days-1},(_,i)=>
    `<line x1="${X((i+1)/days)}" y1="0" x2="${X((i+1)/days)}" y2="${H}" stroke="var(--hair)" stroke-width="1"/>`).join("");
  const lowest=pts.reduce((a,b)=>b.c<a.c?b:a,pts[0]);

  /* At one day the arc IS a clock, so it gets hour lines and a label every four
     hours. Longer horizons subdivide by day instead — hour lines across seven
     columns would be a hundred-odd strokes of noise. */
  let axis="";
  if(days===1){
    for(let h=1;h<24;h++)
      grid+=`<line x1="${X(h/24)}" y1="0" x2="${X(h/24)}" y2="${H}" stroke="var(--hair)"
               stroke-width="1" opacity="${h%4===0?"1":".45"}"/>`;
    /* midnight is labelled at both ends so the axis reads as a whole day rather
       than a window onto one — pinned to the edges, since a centred label there
       would hang half outside the frame */
    axis=`<span class="hr edge" style="left:10px">${clockLabel(0)}</span>`
       + [4,8,12,16,20].map(h=>`<span class="hr" style="left:calc(10px + (100% - 20px) * ${(h/24).toFixed(4)})">${clockLabel(h)}</span>`).join("")
       + `<span class="hr edge" style="right:10px">${clockLabel(0)}</span>`;
  }

  /* "You are here" — the dot walks the curve as the day goes by. It used to mark
     the week's lowest point, but that's already said by the colour and by the
     heads-up card, and a marker that never moves teaches you nothing. */
  const nowX = NOW_H/24/days;      /* the same clock the columns are drawn on */
  const showNow = true;
  const cAt=x=>{
    for(let i=0;i<pts.length-1;i++){
      const a=pts[i], b=pts[i+1];
      if(x>=a.x && x<=b.x && b.x>a.x) return lerp(a.c, b.c, (x-a.x)/(b.x-a.x));
    }
    return pts[pts.length-1].c;
  };
  const nowC = cAt(Math.max(0,Math.min(1,nowX)));

  return {svg:`<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">
      <defs><linearGradient id="arcg" x1="0" x2="${W}" gradientUnits="userSpaceOnUse">${stops}</linearGradient></defs>
      ${grid}
      ${showNow?`<line x1="${X(nowX)}" y1="0" x2="${X(nowX)}" y2="${H}" stroke="var(--ink)"
               stroke-width="1" opacity=".5"/>`:""}
      <line x1="0" y1="${y(.25)}" x2="${W}" y2="${y(.25)}" stroke="#2f3760" stroke-width="1"/>
      <path d="${path}" fill="none" stroke="url(#arcg)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
      ${showNow?`<circle cx="${X(nowX)}" cy="${y(nowC)}" r="3.5" fill="var(--surface)" stroke="${colorFor(nowC)}" stroke-width="2"/>`:""}
    </svg>`, axis, lowest};
}
/* The day cell shows the charge as a stack of bars — a visual, deliberately
   independent of which number scale is on, so it reads the same at /10, /100 or
   in spoons. Capped at six; the number beside it carries the precision. */
/* banners intersecting the visible window, clipped to it */
function spansIn(dates){
  const first=dates[0], n=dates.length;
  const out=[];
  for(const e of S.events){
    if(!isSpan(e)) continue;
    const len=e.span||1, step=e.every||0;
    /* every start that could touch the window */
    const starts=[];
    if(!step) starts.push(e.date);
    else {
      const k=Math.floor(daysBetween(e.date,first)/step);
      for(let i=-1;i<=Math.ceil(n/step)+1;i++) starts.push(addDays(e.date,(k+i)*step));
    }
    for(const st of starts){
      const s=daysBetween(first,st);
      const from=Math.max(0,s), to=Math.min(n-1, s+len-1);
      if(to<from) continue;
      out.push({e, from, to, open:s<0});
    }
  }
  /* Conditions stack above calendar spans — yours first, then the calendar's,
     with a gap between so the two kinds read as two groups. */
  const lay=(list)=>list.sort((a,b)=>a.from-b.from||b.to-a.to)
    .reduce((lanes,s)=>{
      let row=0;
      while(lanes.some(x=>x.row===row && !(s.from>x.to || s.to<x.from))) row++;
      lanes.push({...s,row}); return lanes;
    },[]);
  const mine=lay(out.filter(s=>isCondition(s.e)));
  const cal =lay(out.filter(s=>!isCondition(s.e)));
  const mineRows=mine.length?Math.max(...mine.map(s=>s.row))+1:0;
  return mine.map(s=>({...s,group:"mine"}))
    .concat(cal.map(s=>({...s,group:"cal",row:s.row,offsetRows:mineRows})));
}

function render(){
  projCache=null;
  S.events=S.events.filter(e=>!(e.task&&e.done&&e.doneAt&&daysBetween(e.doneAt,TODAY)>DONE_KEEP_DAYS));

function renderForecast(){
  const f=project(horizonDays()), today=f[0], low=S.charge<.25;
  /* concept.md §4: at the bottom band the score disappears — a bleak number to
     stare at is not useful information when you're crashed. */
  /* no number means no heading — so the state phrase takes the place the figure
     would have held, rather than leaving the screen opening on a bar */
  const headed = noNums() || S.charge < .20;
  const chargeBlock = headed
    ? `<div><div class="bat"><i style="width:${Math.max(3,S.charge*100)}%;background:${colorFor(S.charge)}"></i></div></div>`
    : `<div><div class="charge">${fmt(S.charge)}<span> / ${fmtMax()} ${unitName()}</span></div></div>`;

  let strip="";
  if(!low){
    const arc=weekArc(f.length);
    const HZ=[[1,"1 day"],[3,"3 day"],[7,"7 day"]];
    strip = `<div class="striphead">
        <p class="label">${f.length===1?"Today":f.length===3?"The next few days":"This week's arc"}</p>
        <div class="hzwrap">
          <button class="hz" data-hmenu="1">${HZ.find(h=>h[0]===f.length)?.[1]||f.length+" day"} ▾</button>
          ${S.hmenu?`<div class="hzmenu">
            ${HZ.map(([n,l])=>`<button data-horizon="${n}" class="${f.length===n?"on":""}">${l}</button>`).join("")}
          </div>`:""}
        </div>
      </div>
      <div class="arcbox plain">
        <button class="arc" data-arcinfo="1">${arc.axis}${arc.svg}</button>
        <div class="stripcols">
        <div class="colbg">${f.map(d=>`<i class="z-${cellState(d.date)}"></i>`).join("")}</div>
        <div class="stripgrid head">`+
      f.map(d=>{
        const st=cellState(d.date);
        return `<button data-goday="${d.date}" class="z-${st} ${d.date===TODAY?"sel":""}">
          <span class="dl">${dow(d.date)}</span>
          <span class="dd">${dayNum(d.date)}</span>
        </button>`;
      }).join("")+`</div>
        ${(()=>{const dates=f.map(x=>x.date), sp=spansIn(dates);
          if(!sp.length) return "";
          const mineRows=sp.filter(s=>s.group==="mine").length
            ? Math.max(...sp.filter(s=>s.group==="mine").map(s=>s.row))+1 : 0;
          const calRows=sp.filter(s=>s.group==="cal").length
            ? Math.max(...sp.filter(s=>s.group==="cal").map(s=>s.row))+1 : 0;
          const GAP = (mineRows&&calRows) ? 7 : 0;
          /* At seven columns a calendar span is drawn like the chips below it —
             same height, no label — because there's no room to read one and the
             bar already says "this stretch is spoken for". A condition keeps its
             words at every width: "max 6" is a claim about the week you can't
             check anywhere else. */
          const wide = f.length<=4;
          const CALH = wide ? 16 : 9;                     /* bar + 2px gap */
          const topOf=s=>4 + (s.group==="cal" ? mineRows*16+GAP : 0) + s.row*(s.group==="cal"?CALH:16);
          const h = 4 + mineRows*16 + GAP + calRows*CALH;  /* 2px below the last bar */
          return `<div class="spans" style="height:${h}px">
            ${sp.map(s=>{
            const left=s.from/dates.length*100, w=(s.to-s.from+1)/dates.length*100;
            const labelled = s.group==="mine" || wide;
            return `<button class="spanbar ${s.group==="mine"?"mine":"cal"} ${labelled?"":"slim"}" data-editcond="${s.e.id}" style="left:calc(${left}% + 6px);width:calc(${w}% - 12px);top:${topOf(s)}px;background:${calColor(s.e)};--rail:${calRail(s.e)};--ct:${calInk(s.e)}">${
            labelled
              ? `${s.e.emoji?`<span class="emo">${s.e.emoji}</span>`:""}${s.open?"‹ ":""}${s.e.name}${s.e.cap?` · max ${fmt(s.e.cap)}`:""}${s.e.every?`<span class="arrow rep">${REPEAT}</span>`:""}${trendIcon(s.e)}`
              : ""
          }</button>`;
          }).join("")}</div>`;})()}
        <div class="stripgrid body ${f.length<=4?"wide":""}">`+
      f.map(d=>{
        const st=cellState(d.date);
        const evs=eventsOn(d.date).filter(e=>costOf(e)!=null||e.type);
        const shown=evs.slice(0,3), extraN=evs.length-shown.length;
        return `<button data-goday="${d.date}" class="z-${st} ${isPartial(d.date)?"partial":""}">
          <span class="evs">
            ${shown.map(e=>`<span class="cev${e.inv?" inv":""}"
                style="--c:${calColor(e)};--rail:${calRail(e)};--ct:${calInk(e)}">${trendIcon(e)}<b>${e.name}</b></span>`).join("")}
            ${extraN>0?`<span class="cev more"><b>+${extraN}</b></span>`:""}
          </span>
        </button>`;
      }).join("")+`</div>
        </div>
      </div>`;

  }

  let extra="";
  if(low){
    /* Burnout mode still has to be constructive. It strips the week away, not
       the help: a guess at what would help now, a way to interrogate that guess,
       and — because the thing you can't do while crashed is arrange anything —
       an offer to put recovery in a day that still has room. */
    const r=S.tiredResult, hasR=!!(r&&r.at===TODAY&&r.name);
    extra = `<div class="rec-note">
        <b>Today only.</b> The week can wait.<br>${OVERWHELMED.frozen}
      </div>
      ${hasR
        ? `<p class="label">What you landed on</p>
           <div class="card">
             <p class="helpbig" style="margin:2px 0 10px">${r.name}</p>
             <div class="recalt">
               <button data-tstart="1">ask again</button>
               <button data-tclear="1">clear</button>
             </div>
           </div>
           <div style="height:18px"></div>`
        : `<button class="btn strong" data-tstart="1">I'm overwhelmed</button>
           <p class="hint" style="text-align:center;margin:9px 0 18px">Four questions, then one thing to do.</p>`}
      ${planBlock(7)}
      <button class="btn strong" data-goday="${TODAY}">See just today</button>
      <div style="height:24px"></div>`;
  } else {
    const over=f.slice(1).find(d=>zoneOf(d.end).k==="over"&&d.load>0);
    if(over){
      extra = `<p class="label">Heads up</p><div class="card">
        <div style="font-size:13px;line-height:1.45">${dowL(over.date)} is going to be tough.</div>
        <div class="hint" style="margin-top:5px;font-size:12px;line-height:1.5;color:var(--muted)">Cancel or move something if you can. If you can't, build in recovery time on either side.</div>

        <button class="btn" data-goday="${over.date}" style="margin-top:12px">Take a look at ${dowL(over.date)}</button>
      </div>`;
    } else {
      const rd=recoveryDays();
      extra = `<p class="label">Heads up</p><div class="card">
        <div style="font-size:13px;line-height:1.45">Nothing in the next ${f.length} days goes over.</div>
        <div class="hint" style="margin-top:6px">${S.charge<.62?`About ${rd} low-demand day${rd===1?"":"s"} would get you back to comfortable.`:"You're in the comfortable band."}</div>
      </div>`;
    }
    /* The roomy-day offer used to live only on the calendar, which meant
       simplifying that page would have deleted it from the app outside burnout.
       It belongs here anyway: an empty day is a reading of the week ahead, and
       this screen is where the week ahead is read. */
    extra += `<div style="height:20px"></div>${planBlock(7)}`;
  }

  /* Proactive flag: estimates that read low change the forecast, so say so
     before the user goes looking — with the arithmetic of what it would mean. */
  /* Tasks used to live at the bottom of this screen. They're a to-do list, and
     the forecast is a status report — putting the things you owe the world under
     the reading of how much you've got made one a demand on the other. */

  $("v-forecast").innerHTML = `
    <div class="scr-head"><h2>${niceDate(TODAY)}</h2>
      <button class="act" data-settings="1">${GEAR}</button></div>
    <div class="cond">
      ${headed?`<button class="headline" data-settings="1">${headline()}</button>`:""}
      <button class="condbtn" data-settings="1">${chargeBlock}</button>
      <p class="blurb">${blurb(headed)}</p>
      ${checkinPill(low)}
      ${low?"":tiredBlock()}
    </div>
    ${S.roughNight?`<p class="hint" style="margin:-10px 0 14px;text-align:center">Bad sleep logged — tonight's refill is withheld.</p>`:""}
    ${strip}
    ${extra}`;
}

function renderCalendar(){
  const [y,m]=S.month.split("-").map(Number);
  const first=new Date(y,m-1,1), pad=first.getDay(), len=new Date(y,m,0).getDate();

  /* A week doesn't stop because a month does. The days either side are real days
     with real load in them, and blanking them made the first and last rows read
     as broken grid rather than as the turn of the month. They're dimmed, and
     tapping one moves the calendar to that month. */
  const cellHTML=(date,d,adj)=>{
    const st=cellState(date);
    /* spans first, so a condition or a holiday runs along the top of the row the
       way it does in a real calendar */
    /* every event gets a chip here, priced or not — an unpriced one shows in
       grey, which is how a half-estimated day says so now */
    const chips=S.events.filter(e=>isSpan(e)&&coversDate(e,date))
                .concat(eventsOn(date))
                .slice(0,4)
                .map(e=>`<i class="${e.inv?"inv":""}${costOf(e)==null?" un":""}" style="--c:${calColor(e)}"></i>`).join("");
    return `<button class="cell ${st} ${adj?"adj":""} ${date===TODAY?"today":""} ${date===S.selDate?"sel":""}" data-day="${date}">
      <span class="d">${d}</span><span class="cevs">${chips}</span></button>`;
  };
  const iso=(yy,mm,dd)=>`${yy}-${String(mm).padStart(2,"0")}-${String(dd).padStart(2,"0")}`;

  let cells="";
  const prevY=m===1?y-1:y, prevM=m===1?12:m-1, prevLen=new Date(y,m-1,0).getDate();
  for(let i=pad;i>0;i--){ const d=prevLen-i+1; cells+=cellHTML(iso(prevY,prevM,d),d,true) }
  for(let d=1;d<=len;d++) cells+=cellHTML(iso(y,m,d),d,false);
  const nextY=m===12?y+1:y, nextM=m===12?1:m+1;
  let nd=1;
  for(let i=(pad+len)%7; i>0 && i<7; i++) cells+=cellHTML(iso(nextY,nextM,nd),nd++,true);
  const sel=S.selDate, evs=eventsOn(sel);
  const f=project(Math.max(1,daysBetween(TODAY,sel)+1));
  const d=daysBetween(TODAY,sel)>=0?f[f.length-1]:null;

  let rows = evs.map(e=>{
    const flag=flagMark(e);
    return `<button class="ev ${e.pending?"isp":""}" data-ev="${e.id}">
      <span class="t">${e.time?clockLabel(hm(e.time)):"—"}</span>
      <span class="n">${e.name}</span>
      ${e.pending?`<span class="pending">pending</span>`:""}
      ${e.inv?`<span class="invited">invited</span>`:""}
      ${flag}${costText(costOf(e))}
    </button>`}).join("");

  if(d && d.bestGap && d.bestGap.len>=1.5){
    const g=d.bestGap, hrs=Math.round(g.len);
    rows += `<div class="ev open"><span class="t"></span>
      <span class="n">${hrs}h open · ${clockLabel(halfHour(g.from))}–${clockLabel(halfHour(g.from+g.len))}</span>
      <span class="g" style="opacity:0"></span>
      <span class="c plus">${costArrows(-Math.min(d.openHours*REFILL_PER_OPEN_HOUR,DAY_OPEN_CAP))}</span></div>`;
  }
  if(!evs.length) rows += `<p class="hint" style="padding:10px 0">Nothing scheduled. That's recovery.</p>`;

  $("v-calendar").innerHTML=`
    <div class="scr-head"><h2>${MON[m-1]} ${y}</h2>
      <span class="cal-nav"><button data-mon="-1">‹</button><button data-mon="1">›</button></span></div>
    <div class="dow">${DOW.map(x=>`<span>${x[0]}</span>`).join("")}</div>
    <div class="grid">${cells}</div>
    <div class="legend">
      <span><i style="background:var(--ok-deep)"></i>fits</span>
      <span><i style="background:var(--tight-deep)"></i>you'll pay for it</span>
      <span><i style="background:var(--over-deep)"></i>over</span>
      <span><i style="background:none;border-color:var(--line-strong)"></i>no estimate</span>
    </div>
    <div class="agenda">
      <div style="display:flex;justify-content:space-between;align-items:baseline">
        <p class="label">${niceDate(sel)}</p>
        <button class="act" data-goday="${sel}" style="font-size:11px;color:var(--muted)">day view ›</button>
      </div>
      ${rows}
      ${d?`<div class="tot">
        <span>day total ${noNums()?pips(d.load):`<b>${fmt(d.load)}</b>`}</span>
        <span>you'll start with ${noNums()?pips(d.start):`<b>${fmt(d.start)}</b>`}</span></div>`:""}
    </div>
    <div style="height:26px"></div>
    ${lookNote(7)}
    ${condBlock()}`;
}

function renderDay(){
  const date=S.selDate, off=daysBetween(TODAY,date);
  const f=project(Math.max(1,off+1)), d= off>=0 ? f[f.length-1] : runDay(date,.7,0,capOn(date));
  const evs=eventsOn(date).filter(e=>e.time!=null);
  const untimed=eventsOn(date).filter(e=>e.time==null);
  const isHeavy=heavyOn(date);
  const H=380, span=DAY_END_H-DAY_START_H, y=h=>(h-DAY_START_H)/span*H;

  /* gradient from the computed curve */
  let stops=[];
  for(let i=0;i<=32;i++){
    const h=DAY_START_H+span*i/32;
    let c=d.curve[0].c;
    for(let j=0;j<d.curve.length;j++){ if(d.curve[j].h<=h) c=d.curve[j].c; }
    for(let j=0;j<d.curve.length-1;j++){
      const a=d.curve[j], b=d.curve[j+1];
      if(h>=a.h&&h<=b.h&&b.h>a.h){ c=lerp(a.c,b.c,(h-a.h)/(b.h-a.h)); break }
    }
    stops.push(`${colorFor(c)} ${(i/32*100).toFixed(1)}%`);
  }

  /* events, pushed down if they collide */
  let last=-99, nodes="";
  evs.forEach(e=>{
    let top=y(hm(e.time))-15; if(top<last+4) top=last+4; last=top+31;
    const isRest=costOf(e)!=null&&costOf(e)<0;
    let after=d.curve[0].c;
    for(const p of d.curve) if(p.h<=hm(e.time)+.9) after=p.c;
    const cv=costOf(e);
    /* the arrow is what it takes, the figure is what you're left holding */
    const delta = cv==null ? "not priced"
      : `<span>${costArrows(cv)}</span> → <b>${fmt(after)}</b>`;
    const flag=flagMark(e);
    nodes+=`<div class="node" style="top:${y(hm(e.time))-8}px"></div>
      <button class="evt ${isRest?"rest":""} ${e.pending?"isp":""} ${isHeavy(e)?"drain":""}" data-mv="${e.id}" style="top:${top}px">
        <span class="n">${e.name}</span>${e.pending?`<span class="pending">pending</span>`:""}${e.inv?`<span class="invited">invited</span>`:""}${flag}<span class="d">${delta}</span></button>`;
  });

  let ticks="";
  for(let h=8;h<=22;h+=4) ticks+=`<span class="tick" style="top:${y(h)-5}px">${clockLabel(h)}</span>`;

  const cross = d.cross!=null
    ? `<div class="cross" style="top:${y(d.cross)}px"><span>under from here</span></div>` : "";
  /* current time, only on today — a now line on a future day means nothing */
  const nowLine = (date===TODAY && NOW_H>=DAY_START_H && NOW_H<=DAY_END_H)
    ? `<div class="nowline" style="top:${y(NOW_H)}px"><i></i><span>${clockLabel(NOW_H)}</span></div>` : "";

  const pb = paybackDays(d.debt);
  const pbLine = pb ? ` Ends empty with about ${pb} low-demand day${pb===1?"":"s"} to pay back.` : "";
  const u=unitName(), pl=unitPlural();
  const anyHeavy = eventsOn(date).filter(e=>!e.task).some(isHeavy);
  const lead = d.cross!=null
    ? `Your ${u} ${pl?"run":"runs"} out on ${dowL(date)} ${timeOfDay(d.cross)}.`
    : zoneOf(d.end).k==="over"
      ? `Your ${u} ${pl?"are":"is"} gone by the end of ${dowL(date)}.`
      : d.hasEvents
        ? `${dowL(date)} holds together, but leaves you nothing to spare.`
        : `Nothing scheduled. That's recovery.`;
  const sum = lead
    + (anyHeavy ? " The events marked in red are costing you the most. Start there." : "")
    + pbLine;

  /* A condition or a multi-day event doesn't happen AT a time, so it has no
     place on a timeline — but it sets the terms for everything that does. It
     rides above the day as a bar, the same shape it has on the calendar. */
  const dspans=S.events.filter(e=>isSpan(e)&&coversDate(e,date));

  $("v-day").innerHTML=`
    <div class="scr-head"><h2>${niceDate(date)}</h2>
      <button class="act" data-tab2="${S.dayBack||"calendar"}">back</button></div>
    <p class="sumline">${sum}</p>
    ${dspans.length?`<div class="condline" style="margin-top:12px">${dspans.map(e=>`<span class="${e.src==="spoon"?"mine":""}" style="--c:${calColor(e)};--rail:${calRail(e)};--ct:${calInk(e)}"
       >${e.emoji?`<span class="emo">${e.emoji}</span>`:""}${e.name}${e.cap&&!noNums()?` · max ${fmt(e.cap)}`:""}</span>`).join("")}</div>`:""}
    <div class="tl" style="height:${H}px">
      <div class="rail" style="background:linear-gradient(to bottom,${stops.join(",")})"></div>
      ${ticks}${nowLine}${cross}${nodes}
    </div>
    ${untimed.length?`<p class="label">No time set</p>
      ${untimed.map(e=>`<button class="ev ${isHeavy(e)?"drain":""}" data-mv="${e.id}">
        <span class="n">${e.name}</span>
        ${costText(costOf(e))}</button>`).join("")}
      <div style="height:16px"></div>`:""}
    <button class="btn" data-cantmove="${date}" style="border-color:var(--line);color:var(--muted)">I can't move anything</button>`;
}
function lastEventAfter(date,h){
  const e=eventsOn(date).filter(x=>x.time&&hm(x.time)>h&&x.cost>0).pop();
  return e?e.name:null;
}

/* Two different questions, kept apart. The check-in asks how you ARE — it's the
   handshake after a gap, and it belongs over the forecast because it's what you
   do in response to the number you just read. The Log is what HAPPENED: the
   things that cost you something and were never on the calendar. Merging them
   made one screen that answered neither question first. */
function sheetCheckin(){
  const gap=daysBetween(S.lastLog,TODAY), v=S.charge;
  /* "It's been 9 days" is a count of days you didn't open an app — a small
     reproach, in a tool whose whole premise is not adding those. */
  /* One notch per step the scale actually has, and the slider snaps to them —
     so the thumb always sits on a mark. /100 steps by 5, which is why this is
     max/step rather than max. */
  const sc=SCALES[S.scale];
  const divs = sc.max ? Math.round(sc.max/(sc.step||1)) : 10;
  const notches=Array.from({length:divs-1},(_,i)=>
    `<i style="left:calc(17px + (100% - 34px) * ${((i+1)/divs).toFixed(4)})"></i>`).join("");
  openSheet(`
    <h3>How are you doing?</h3>
    <p class="sub">${gap>2?`It's been a minute. `:""}Drag to wherever you are now.</p>

    <div class="readout" id="readout">
      <span class="w">${stateWord(v)}</span>
      ${noNums()?"":`<span class="v">${fmt(v)} / ${fmtMax()} ${unitName()}</span>`}
    </div>
    <div class="slider-wrap">
      <div class="strack"></div>
      <div class="notches">${notches}</div>
      <input id="chargeSlider" type="range" min="0" max="${divs}" step="1" value="${Math.round(v*divs)}"
             aria-label="Current charge">
    </div>
    <div class="ticks"><span>empty</span><span>low</span><span>okay</span><span>good</span></div>

    <div class="divider"><hr><span>optional</span><hr></div>
    <button class="btn" data-tstart="1" style="margin-bottom:10px">What kind of tired are you?</button>
    <button class="row" data-rough="1">
      <span class="box">${S.roughNight?"✓":""}</span>
      <span style="font-size:12.5px">Bad sleep</span>
    </button>
    <div style="height:18px"></div>
    <button class="btn strong" data-closesheet="1">Done</button>
    <div style="height:8px"></div>
    <button class="btn" data-golog="1" style="border-color:var(--line);color:var(--muted)">Something happened — log it</button>`,
    {checkin:true});
}

/* Logging an item is the same calibration loop as rating an event, entered from
   the other end: you name the thing and its size at once. It counts against the
   charge and joins the history, so a "hard phone call" logged often enough
   starts pricing itself like anything else. */
function applyLog(name, cost, type){
  S.prevCharge=S.charge;
  S.charge=Math.max(0, Math.min(capOn(TODAY)||1, S.charge-cost));
  S.lastLog=TODAY;
  S.offlog=(S.offlog||[]).concat({id:"L"+(S.nextLogId=(S.nextLogId||0)+1),
                                  name, cost, type:type||null, at:TODAY});
}

/* Logging is one tap, so un-logging has to be too — a mis-tap on a chip
   shouldn't need a trip to the slider to put right. Removing an entry reverses
   the charge it took and drops the history row it wrote, so the learned price
   of a name isn't quietly skewed by a mistake. */
function unlog(id){
  const x=(S.offlog||[]).find(e=>e.id===id); if(!x) return null;
  S.charge=Math.max(0, Math.min(capOn(TODAY)||1, S.charge + x.cost));
  S.offlog=S.offlog.filter(e=>e.id!==id);
  return x;
}

/* Editing reverses the old entry's effect and applies the new one in place, so
   the row keeps its position and the history keeps exactly one row for it. */
function relog(id, name, cost, type){
  const x=(S.offlog||[]).find(e=>e.id===id); if(!x) return;
  S.charge=Math.max(0, Math.min(capOn(TODAY)||1, S.charge + x.cost - cost));
  x.name=name; x.cost=cost; x.type=type||null;
}

/* A chip that writes something has to show that it did. It reads its state from
   the log itself rather than keeping its own, so the × in the list below and the
   chip can never disagree. */
function loggedToday(name){
  return (S.offlog||[]).filter(x=>x.at===TODAY && x.name===name).slice(-1)[0] || null;
}

function renderLog(){
  /* The calendar already knows what you did today; the only thing it can't know
     is which of it cost you. Marking here is the same act as marking from the
     day view — this is just the end-of-day version of it. */
  const todayEvents = eventsOn(TODAY).filter(e=>!e.task && costOf(e)>0);
  const today=(S.offlog||[]).filter(x=>x.at===TODAY);
  $("v-log").innerHTML=`
    <div class="scr-head"><h2>What happened?</h2></div>
    <p class="screen-sub">Mark what took it out of you. Everything else, the app assumes was fine.</p>

    ${todayEvents.length?`<div class="group">
      <p class="label">On your calendar today</p>
      <div class="chips">
        ${todayEvents.map(e=>`<button class="chip ${markedOn(e.name,TODAY)?"on":""}"
          data-markday="${e.name}|${TODAY}">${e.name}</button>`).join("")}
      </div>
    </div>`:""}

    <div class="group">
      <p class="label">Off the calendar — took away ${unitWord()}</p>
      <div class="chips">
        ${quickList().map((q,i)=>[q,i]).filter(([q])=>q.cost>0).map(([q,i])=>
          `<button class="chip ${loggedToday(q.n)?"on":""}" data-off="${i}">${q.n}</button>`).join("")}
      </div>
    </div>
    <div class="group">
      <p class="label">Off the calendar — gave me ${unitWord()}</p>
      <div class="chips">
        ${quickList().map((q,i)=>[q,i]).filter(([q])=>q.cost<0).map(([q,i])=>
          `<button class="chip ${loggedToday(q.n)?"on":""}" data-off="${i}">${q.n}</button>`).join("")}
      </div>
    </div>
    <button class="btn" data-addlog="1">+ something else</button>

    <p class="label" style="margin-top:26px">Logged today</p>
    ${today.length
      ? today.map(x=>`<div class="landed">
          <button class="n" data-editlog="${x.id}">${x.name}</button>
          <span class="g">${x.type?typeIcon(x.type):""}</span>
          <button class="e" data-editlog="${x.id}">${x.cost<0?"+":"−"}${noNums()?"":fmt(Math.abs(x.cost))}</button>
          <button class="rm" data-unlog="${x.id}" aria-label="Remove ${x.name}">×</button>
        </div>`).join("")
      : `<p class="hint" style="padding:4px 0 0">Nothing logged today. That's okay.</p>`}

    <div style="height:24px"></div>
    <button class="btn strong" data-tab="forecast">Done</button>
    <div style="height:8px"></div>
    <button class="btn" data-reset="1" style="border-color:var(--line);color:var(--muted)">Reset demo data</button>`;
}

/* The same sheet writes a new entry and edits an existing one: what it cost you
   is a guess like any other, and the first number you reach for while it's still
   happening is rarely the one you'd pick an hour later. */
function sheetLogItem(editId){
  const ex = editId!=null ? (S.offlog||[]).find(e=>e.id===editId) : null;
  const d = (sheetCtx&&sheetCtx.newLog) ? sheetCtx : {
    newLog:true, editId: ex?ex.id:null,

    cost: ex?Math.abs(ex.cost):.15,

    rest: ex?ex.cost<0:false
  };
  openSheet(`
    <h3>${d.editId?"Edit event":"Log something"}</h3>
    <p class="sub">This helps make your forecast more accurate.</p>

    <p class="label">${d.rest?"How much did it give back?":"What did it take?"}</p>
    <div class="stepper">
      <button data-lstep="-1">−</button>
      <div class="val">${d.rest?"+":""}${fmt(d.cost)}<small> / ${fmtMax()||"10"}</small></div>
      <button data-lstep="1">+</button>
    </div>
    <p class="label">Kind</p>
    <div class="seg">
      ${Object.keys(TYPES).map(k=>`<button data-ltype="${k}" class="seg-ico ${d.type===k?"on":""}">${typeIcon(k)}${k}</button>`).join("")}
    </div>
    <button class="row" data-lrest="1" style="margin-bottom:16px">
      <span class="box">${d.rest?"✓":""}</span>

    </button>
